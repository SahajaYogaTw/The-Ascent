<style>

  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{

  .globalbar{

  }
  .globalbar-fill{
    height:100%;

  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:14px 14px 8px;

  .iconbtn{
    background:none;

    flex:1 1 auto;
    overflow:hidden;
  }

  .track{
    position:absolute;
    top:0; left:0;

    display:flex;
    transition:transform 380ms cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }

  .leaf{
    flex:0 0 100vw;
    max-width:640px;

    padding:8px 26px 20px;
    overflow:hidden;

  .leaf-inner{ display:block; }

  .leaf-inner p{

  .dots{

    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    padding:12px 0 14px;

  .edge{
    position:absolute; top:0; height:100%; width:34px; z-index:15;
    display:flex; align-items:center; justify-content:center;

  .edge.left{ left:0; }
  .edge.right{ right:0; }

  .overlay{

    align-items:flex-end;

    padding:0 20px 14px;
    font-size:12px; letter-spacing:0.2em; color:var(--gold);
  }
  .sheet-head button{
    background:none; border:none; color:var(--muted); font-size:18px; padding:4px 8px; cursor:pointer;
  }

  .sheet-list{ overflow-y:auto; padding:0 8px; }
  .sheet-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 12px;
    text-decoration:none;
    color:var(--ink);
    border-bottom:1px solid rgba(0,0,0,0.06);
    font-size:14.5px;
  }
  .sheet-item.current{ color:var(--gold); }
  .sheet-item:last-child{ border-bottom:none; }
  .sheet-item .n{ color:var(--gold); font-size:11px; width:28px; flex:0 0 auto; }
  .sheet-item .t{ flex:1 1 auto; padding:0 6px; }

  .settings-body{ padding:6px 20px 10px; }
  .setting-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  .setting-row:last-child{ border-bottom:none; }
  .setting-label{ font-size:13px; color:var(--muted); letter-spacing:0.08em; }
  .setting-controls{ display:flex; align-items:center; gap:10px; }
  .pillbtn{
    background:none;
    border:1px solid var(--muted);
    color:var(--ink);
    width:32px; height:32px;
    border-radius:50%;
    font-size:14px;
    cursor:pointer;
  }
  .theme-toggle{
    display:flex; border:1px solid var(--muted); border-radius:16px; overflow:hidden;
  }
  .theme-toggle button{
    background:none; border:none; color:var(--muted); font-size:14px; padding:6px 14px; cursor:pointer;
  }
  .theme-toggle button.active{ background:var(--gold); color:var(--card); }
</style>

(function(){

  var CHAPTER_LIST = [{"num": "01", "title": "求道者", "file": "chapter_1.html"}, {"num": "02", "title": "靈量（Kundalini）", "file": "chapter_2.html"}, {"num": "03", "title": "陰脈、陽脈和中脈", "file": "chapter_3.html"}, {"num": "04", "title": "人體小宇宙", "file": "chapter_4.html"}, {"num": "05", "title": "根輪（Mooladhara Chakra）", "file": "chapter_5.html"}, {"num": "06", "title": "腹輪（Swadisthan Chakra）", "file": "chapter_6.html"}, {"num": "07", "title": "臍輪（Nabhi Chakra）", "file": "chapter_7.html"}, {"num": "08", "title": "集體意識", "file": "chapter_8.html"}, {"num": "09", "title": "十大宗師", "file": "chapter_9.html"}, {"num": "10", "title": "心輪（Heart Chakra）", "file": "chapter_10.html"}, {"num": "11", "title": "喉輪（Visshudhi Chakra）", "file": "chapter_11.html"}, {"num": "12", "title": "額輪（Agnya Chakra）", "file": "chapter_12.html"}, {"num": "13", "title": "頂輪（Sahasrara Chakra）", "file": "chapter_13.html"}, {"num": "14", "title": "神聖的生命能量", "file": "chapter_14.html"}, {"num": "15", "title": "靜坐冥想", "file": "chapter_15.html"}, {"num": "16", "title": "萬物之母", "file": "chapter_16.html"}, {"num": "17", "title": "後記", "file": "chapter_17.html"}];

  var HEADER_HTML =
    '<div class="chapter-head">'+
      '<div class="eyebrow">AGNYA CHAKRA</div>'+
      '<h1>第十二章　額輪（Agnya Chakra）</h1>'+
      '<div class="divider">❖</div>'+
    '</div>';

  var PARAGRAPHS = ["孔雀抱怨說：「我真要拔掉這些羽毛嗎？這些漂亮的羽毛只會令我變得驕傲。」無論那個求道者多麼有才智，他都得當心，追求誘餌，便看不見圈套，求道者當小心他們的自我，意志和技能，恐怕沒有其他東西，比自由意志更易置人於死地。", "人類的一切努力，除非與集體意識建立了聯繫，否則只是服務於自我。於是那個人便會產生虛假的信心，釀成災禍。使用和發展人類各方面的才能當然重要，但最好是為而不持，功成而不居。要時常記著，我們的能力只是集體意識的渠道。", "人類發展的第六階段有三位大宗師降世，他們是佛陀、耆那教的大雄（Mahavira）和耶穌基督。佛陀教導世人慈悲為懷，反對暴力，又講授八正道，使人能克服自我，生活平衡，於是靈量能夠從中間的通道通過。", "耆那教的大雄教人不要對自己施行暴力，他傳授的訊息很微妙。他教人不要有暴力的思想，通過溫和柔順的思想，超我便可得到昇華，這樣人便能克服思想的積集。耶穌基督則是來到世上幫助世人了解自己的自我，祂甚至讓人把祂釘死在十字架上，引起人們的悔改心，讓他們看見自我的可怕，於是改而活在謙卑之中。耶穌寬恕了那些釘祂在十字架上的人。我們也一樣要寬恕別人，心中的惡意只會把我們往下拉。我們要寬恕別人，把一切過去的留給死去的人。因此，耶穌基督降世是人類靈性昇進的一大突破，祂免去人的罪，使他們的自我昇華。耶穌還教人要互相寬恕，又用自身的復活，證明靈體是不朽的。", "在集體進化的過程之中，一個人的發現往往會為他人帶來好處。例如，一個科學家發明了某些東西，整個人類都會受惠。我們不必每個人都去重複那個實驗。思想也以同樣的方式出現。當一個觀念在某個偉大的思想家腦中形成，便可給整個社會分享。因為有些人已成功地這樣做過，社會上其他人按著這樣做便成了。同樣道理，那些大宗師和降世神祇為我們開啓了道路，我們便毋須重頭做起，因為祂們已經為我們準備好了。是以如果耶穌基督已為我們開啓了一個門戶，已為我們受了苦，我們便毋須再受苦了。", "很不幸，我們的第六中心，在今天因為一個錯誤的想法而受到阻塞，那個錯誤的想法認為我們要承擔生命積累下來的罪。耶穌基督已經免了我們的債，寬恕了我們的罪，使我們在生命進化的過程中取得一大突破。這是耶穌基督的貢獻，我們應因此而懷念祂，否則祂的降生便沒有意義了。由於耶穌基督已經寬恕了我們，我們便毋須背負著過去的包袱，老是認為自己有罪。", "那些不能寬恕別人的人在第六中心會有阻塞。無論你寬恕或不寬恕別人，無論你做甚麼或甚麼都不做，結果都是一樣。你懷恨於心只會污染你自己思想，妨礙你自一己的進化，被你記恨的人一點也不會受到影響。這種做法只會使自我越來越大。要超越自我，我們要學習耶穌基督的寬恕，不肯學習寬恕的人將不能進入上帝的國。", "現在已經有一些心理學家研究霎哈嘉瑜伽。在日本東京，索菲亞大學東方宗教研究所的負責人，威廉．莊士敦（William Johnston）說：「不肯寬恕別人，在記憶中潛藏憤怒，對人是很有害的。由於早期的創傷，有些人拒絕接受別人，認為別人是不成的，也不接受自己，認為自己也是不成的，最後這種人只會鬧至精神崩潰。這種問題的根本原因是不自覺地拒絕去愛，例如他們不肯寬恕自己的父母。這樣的人很難去愛別人和寬恕別人，因為他們遇到甚麼人，都把雙親的形象投射在他們身上。有些人能夠有意識地寬恕別人，但在無意識中卻不能夠，於是不能夠像普通人那樣去愛人。」", "同情共感的另一面是愛與寬恕，如果我們能忘記過去，便如同蓮花般美麗，散發出芳香。", "冤冤相報是種幼稚的行為，表示那個人還不成熟，還要玩壞人必定要受罰的遊戲。如果殺人者逃脫，就要拿他的孩子來抵罪。復仇的行為結果只會毀滅自我。", "「在此神殿圍牆之內，我們不知甚麼叫報復，如果有人拋棄責任，愛可使他重新肩負責任。", "伸出友誼之手，引他向光明之國。", "那裡人群之間，都由愛來維繫。所有的罪都得赦免，找不到一個背叛的人，那些愛的力量也不能維繫者，便不配活在光明之國。」", "——莫札特：最後的歌劇耶穌基督向人類說明了聖靈的真相和律則，告訴他們別犯下對抗靈體的罪。聖靈在每個人體內的反映便是靈量，即母親愛的力量。耶穌基督說的洗禮是指喚醒人們體內沉睡的力量，讓人們得到自覺。我們的頭蓋骨頂端便是與無所不在的神聖力量建立聯繫的孔道。真正的洗禮是穿透頭蓋骨，建立這個聯繫。消極的思想、壞習慣、淫邪的眼神會損害這個中心的注意力。過度的視覺娛樂，例如：看得太多電視和電影也會令此中心能量衰竭。", "當我們能超越思維和理性時，第六中心，即通往天國的通道便會打開，讓靈量通過。耶穌基督早已說過，只有那些純真如兒童的人才能進入上帝的國。", "對神有錯誤的觀念也會使這個中心堵塞。宗教人士往往變得很教條，他們只是忠於經典上的字句，而不是先知的真正教導。我們不應該變得教條和狂熱。我們應該遵從佛陀之道，而不是佛教；基督之道，而不是基督教。表面的東西是沒有多大用處的。如果你把一幅勞斯萊斯汽車的圖像掛在頸項，你是否能移動一分一吋呢？現在為宗教狂熱而流的血，已比世界大戰還要多。", "意守第六能量中心是十分危險的，會使這個中心負荷過重，受到破壞。那些具天眼通的人不能受超自然力量的吸引，走上反進化的道路，對他們身心都構成莫大危害。", "靈量是那個使你能夠活在當下，不走向過去，也不走向將來的力量。過去好像磁石一般，常常吸引你的注意力，要你成為它的媒體。但當靈量昇起，靈量變成更大的磁石，吸引你走向中心，活在當下。如果你的注意力在過去，也許很快便要找心理醫生了。但當你活在當下，你便超越了心理學。", "精神是高於物質的，你不是你的情感，也不是你的理智，靈體是高於精神的。你應該努力成為靈體。活在當下是異常快樂的，每一刻，你都對宇宙的汪洋大海，即集體意識，或稱之為神，作出回應。你可以經常活在這個喜樂的泉源之中。通過種種方式，我們被迫活在世俗的狀態，不是被定型於活在過去，便是被定型於活在將來。活在當下是無法勉強的，只有自然而然才能達到。只有活在當下，生命意義才會展現出來。", "動物不能作心靈投射，只有人類能夠。例如，畫家能夠投射抽象的形象，然後畫在畫布上。建築師構想一個意念，然後畫成藍圖。通過這種能力，我們漸漸學會玩思想的遊戲，建立空中的樓閣，然後又去堵毀它。心靈投射的能力使我們能夠進入不同的層次。但許多時，我們會被自己的遊戲逮住，希望釋放自己。求道的過程不是別的，而是努力離開自己所建的思維的迷宮。", "心靈的投射只是個概念。錫呂．瑪塔吉女士說：概念並非真實，它只是種無知。當無知去除後，人便受到啓發。虛妄去盡，便見真實。比如在夢中，我們以為發生了甚麼事情，但一覺醒來，便知道那是幻象。有時我們會說：「噢，我還以為那是真的，誰知不過是誤解。」我們的結論來自邏輯推理，但如果前提是虛假的，結論也會跟著是虛假的。只有當我們看見現實，才能辨別虛妄。當我們經驗到事物的幽隱層次時，它的粗糙面紗才會解下。最後的真實不能繼續剝開，此猶如剝洋蔥，剝到最裡層時，便不能再剝下去了。這一點很重要，心靈好像洋蔥一樣，當所有概念都放下後，只有靈體在閃亮。這才是真正的現實，其他東西都是虛妄的。", "有些人認為真理也是相對的，對某個人是真的道理，對另一個人未必是真。「這是我的道理，那是你的道理。」這種說法是屬於思維層面的，說話者也只生活在這個層次。此猶之乎電腦只能根据輸入的資料輸出答案。因此，在心智的層面，只有心智的投射才會被視為真理。在蘇格拉底的時代，一個人是否偉大要看他的智力和思辯的能力。那些學者辯士能夠邏輯地證明人是牛。今天的宗教論爭和政治宣傳其實在玩著同樣的遊戲。", "霎哈嘉瑜伽不依賴任何思辯的能力。它是通過既內在又外在的微妙力量來運作。在內，靈量對每個行為都作出回應。當對靈體的知覺喚醒我們的中樞神經系統，我們便可以實際上感覺到靈體的能量。當我們的注意力轉到自己內在的意識，我們便可以提昇他人的靈量。我們可以感覺到靈量在他人身體的位置和上昇的情況。這樣我們便建立了集體意識，變成一個整全的生命體。再往下去，我們便說不出人我之分。愛的力量何等偉大，只要我們運用雙手，便能提昇別人的靈量。只有這樣，才可能成就人類集體的自覺，在這個黑暗時代喚醒真理。", "每個能量中心在內和在外都代表著自然的一個基本律法。如果我們違反任何一個律法，便立即在那個能量中心反映出來，並使我們的某個指頭發熱。這樣，我們便可以經驗到所有創造背後的力量，由一粒種子到天上的星球，由一粒原子到整個銀河系，由微觀的生命到宏觀的生命。一旦我們的集體意識鞏固了，便有分辨真假對錯的能力。這不是簡單的辨別是非黑白，而是揭開了生命的真相。", "如此個人才可以超越一己形軀之私，看見生命的普遍真理。科學家努力通過顯微鏡試圖發現這個真理。現在，到了真理全盤向我們展現的時候了。此不單是為了我們的進化，還為了我們的生存。錫呂．瑪塔吉女士說，現在是開花結果的時代，人類永恆的追求將會得到集體的實現。"];
  var END_MARK_HTML = '<div class="leaf-foot">◇</div>';

  var track = document.getElementById('track');
  var book = document.getElementById('book');
  var dotsWrap = document.getElementById('dots');
  var curPageEl = document.getElementById('curPage');
  var totalPageEl = document.getElementById('totalPage');
  var edgeLeft = document.getElementById('edgeLeft');
  var edgeRight = document.getElementById('edgeRight');
  var loadingEl = document.getElementById('loading');
  var measureInner = document.getElementById('measureInner');
  var measureOuter = document.getElementById('measure');
  var globalFill = document.getElementById('globalFill');

  var index = 0;
  var pages = [];
  var pageOffsets = [];
  var dragging = false, startX = 0, startY = 0;

  // ---------- theme ----------
  function applyTheme(t){
    document.documentElement.classList.toggle('dark', t === 'dark');
    document.getElementById('themeLight').classList.toggle('active', t !== 'dark');
    document.getElementById('themeDark').classList.toggle('active', t === 'dark');

  var savedTheme = localStorage.getItem('theme') || 'light';
  applyTheme(savedTheme);
  document.getElementById('themeLight').addEventListener('click', function(){
    localStorage.setItem('theme','light'); applyTheme('light');
  });
  document.getElementById('themeDark').addEventListener('click', function(){
    localStorage.setItem('theme','dark'); applyTheme('dark');
  });

  // ---------- font scale ----------
  var savedScale = parseFloat(localStorage.getItem('fontScale') || '1');
  document.documentElement.style.setProperty('--scale', savedScale);
  function changeScale(delta){
    savedScale = Math.max(0.8, Math.min(1.4, Math.round((savedScale + delta) * 100) / 100));
    document.documentElement.style.setProperty('--scale', savedScale);
    localStorage.setItem('fontScale', savedScale);
    rebuild();
  }
  document.getElementById('fontMinus').addEventListener('click', function(){ changeScale(-0.1); });
  document.getElementById('fontPlus').addEventListener('click', function(){ changeScale(0.1); });

  // ---------- overlays ----------
  var tocOverlay = document.getElementById('tocOverlay');

  // ---------- pagination ----------
  function wrapPara(text, indent){
    return '<p' + (indent ? '' : ' class="continued"') + '>' + text + '</p>';
  }

  function measure(html){
    measureInner.innerHTML = html;
    return measureOuter.getBoundingClientRect().height;
  }

  function maxFit(pageHTML, remaining, indent, limit){
    var lo = 0, hi = remaining.length, best = 0;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      var h = measure(pageHTML + wrapPara(remaining.slice(0, mid), indent));
      if(h <= limit){ best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  function globalOffset(paraIdx, charIdx){
    var off = 0;
    for(var i=0;i<paraIdx;i++) off += PARAGRAPHS[i].length;
    return off + charIdx;
  }

  function paginate(){
    var leafW = book.clientWidth;
    measureOuter.style.width = Math.min(leafW, 640) + 'px';
    measureOuter.style.padding = getComputedStyle(document.querySelector('.leaf') || measureOuter).padding;

    var probe = document.createElement('div');
    probe.className = 'leaf';
    probe.style.cssText = 'position:fixed; top:0; left:-9999px; visibility:hidden; width:' + Math.min(leafW,640) + 'px;';
    probe.style.height = book.clientHeight + 'px';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    var padTop = parseFloat(cs.paddingTop), padBot = parseFloat(cs.paddingBottom);
    document.body.removeChild(probe);
    var availableHeight = book.clientHeight - padTop - padBot;

    pages = [];
    pageOffsets = [];

    var paraIdx = 0, charIdx = 0;
    var firstPage = true;

    while(paraIdx < PARAGRAPHS.length){
      var pageHTML = firstPage ? HEADER_HTML : '';
      var startOffset = globalOffset(paraIdx, charIdx);
      var brokeMidPage = false;

      while(paraIdx < PARAGRAPHS.length){
        var text = PARAGRAPHS[paraIdx];
        var remaining = text.slice(charIdx);
        var indent = (charIdx === 0);
        var candidate = pageHTML + wrapPara(remaining, indent);

        if(measure(candidate) <= availableHeight){
          pageHTML = candidate;
          paraIdx++; charIdx = 0;
          continue;
        } else {
          var k = maxFit(pageHTML, remaining, indent, availableHeight);
          if(k > 0){
            pageHTML = pageHTML + wrapPara(remaining.slice(0, k), indent);
            charIdx += k;
          } else if(pageHTML === (firstPage ? HEADER_HTML : '')){
            k = Math.max(1, maxFit('', remaining, indent, availableHeight));
            pageHTML = pageHTML + wrapPara(remaining.slice(0, k), indent);
            charIdx += k;
          }
          brokeMidPage = true;
          break;
        }
      }

      pages.push(pageHTML);
      pageOffsets.push(startOffset);
      firstPage = false;
      if(!brokeMidPage) break;
    }

    if(pages.length){
      var lastIdx = pages.length - 1;
      var withMark = pages[lastIdx] + END_MARK_HTML;
      if(measure(withMark) <= availableHeight){
        pages[lastIdx] = withMark;
      } else {
        pages.push(END_MARK_HTML);
        pageOffsets.push(pageOffsets[lastIdx] + 1);
      }
    }
  }

  function renderPages(keepOffset){
    track.innerHTML = '';
    dotsWrap.innerHTML = '';
    pages.forEach(function(html){
      var leaf = document.createElement('div');
      leaf.className = 'leaf';
      var inner = document.createElement('div');
      inner.className = 'leaf-inner';
      inner.innerHTML = html;
      leaf.appendChild(inner);
      track.appendChild(leaf);

      var dot = document.createElement('div');
      dot.className = 'dot';
      dotsWrap.appendChild(dot);
    });
    totalPageEl.textContent = pages.length;

    var target = 0;
    if(typeof keepOffset === 'number'){
      for(var i=0;i<pageOffsets.length;i++){
        if(pageOffsets[i] <= keepOffset) target = i; else break;
      }
    }
    goTo(target, false);
  }

  function leafWidth(){ return book.clientWidth; }

  function saveProgress(){
    try{
      var offset = pageOffsets[index] || 0;
      localStorage.setItem('progress:' + CHAPTER_FILE, offset);
      localStorage.setItem('lastRead', JSON.stringify({file: CHAPTER_FILE, title: '第十二章　額輪（Agnya Chakra）'}));
    }catch(e){}
  }

  function updateGlobalBar(){
    var localOffset = pageOffsets[index] || 0;
    var pct = ((BASE_OFFSET + localOffset) / TOTAL_CHARS) * 100;
    globalFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  function goTo(i, animate){
    index = Math.max(0, Math.min(pages.length - 1, i));
    var w = leafWidth();
    track.classList.toggle('no-anim', animate === false);
    track.style.transform = 'translateX(' + (-index * w) + 'px)';
    var dots = dotsWrap.children;
    for(var n=0;n<dots.length;n++) dots[n].classList.toggle('active', n === index);
    curPageEl.textContent = index + 1;
    edgeLeft.classList.toggle('show', index > 0);
    edgeRight.classList.toggle('show', index < pages.length - 1);
    updateGlobalBar();
    saveProgress();
  }

  function rebuild(){
    var savedOffset = null;
    try{
      var raw = localStorage.getItem('progress:' + CHAPTER_FILE);
      if(raw !== null) savedOffset = parseFloat(raw);
    }catch(e){}
    var keepOffset = savedOffset !== null ? savedOffset : (pageOffsets.length ? pageOffsets[index] : 0);
    paginate();
    renderPages(keepOffset);
    loadingEl.style.display = 'none';
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 200);
  });
  window.addEventListener('orientationchange', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 250);

  book.addEventListener('touchstart', function(e){
    startX = e.touches[0].clientX;

  }, {passive:true});

  book.addEventListener('touchmove', function(e){
    if(!dragging) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if(Math.abs(dy) > Math.abs(dx)) return;
    var w = leafWidth();
    track.style.transform = 'translateX(' + (-index * w + dx) + 'px)';
  }, {passive:true});

  book.addEventListener('touchend', function(e){
    if(!dragging) return;
    dragging = false;
    var dx = e.changedTouches[0].clientX - startX;
    var w = leafWidth();
    track.classList.remove('no-anim');
    if(Math.abs(dx) > w * 0.18){
      if(dx < 0){
        if(index >= pages.length - 1 && NEXT_FILE){
          window.location.href = NEXT_FILE;
        } else {
          goTo(index + 1);
        }
      } else {
        if(index <= 0 && PREV_FILE){
          window.location.href = PREV_FILE;
        } else {
          goTo(index - 1);
        }
      }
    } else {
      goTo(index);
    }
  });

  edgeLeft.addEventListener('click', function(){
    if(index <= 0 && PREV_FILE) window.location.href = PREV_FILE; else goTo(index - 1);
  });
  edgeRight.addEventListener('click', function(){
    if(index >= pages.length - 1 && NEXT_FILE) window.location.href = NEXT_FILE; else goTo(index + 1);
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') edgeRight.click();
    if(e.key === 'ArrowLeft') edgeLeft.click();
  });

  window.addEventListener('load', function(){ setTimeout(rebuild, 30); });
  if(document.readyState === 'complete'){ setTimeout(rebuild, 30); }
})();
</script>

</body>
</html>
