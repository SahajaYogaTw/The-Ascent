<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第六章　腹輪（Swadisthan Chakra）</title>
<style>
  :root{
    --gold:#b8975f;
    --soft:#f7f4ee;
    --card:#fffdf9;
    --muted:#9c9484;
    --ink:#4a4238;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--soft);
    font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .app{
    position:relative;
    height:100vh;
    max-width:640px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px 8px;
    z-index:20;
  }

  .topbar .title{
    font-size:13px;
    letter-spacing:0.28em;
    color:var(--gold);
  }

  .topbar .counter{
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--muted);
  }

  .book{
    position:relative;
    flex:1 1 auto;
    overflow:hidden;
  }

  .track{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    transition:transform 380ms cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .track.no-anim{ transition:none; }

  .leaf{
    flex:0 0 100vw;
    max-width:640px;
    height:100%;
    padding:8px 26px 20px;
    overflow:hidden;
  }

  .leaf-inner{
    display:block;
  }

  .chapter-head{
    text-align:center;
    margin-bottom:30px;
  }

  .chapter-head .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    color:var(--gold);
    margin-bottom:8px;
  }

  .chapter-head h1{
    font-size:24px;
    font-weight:600;
    letter-spacing:0.14em;
    margin:0 0 8px;
  }

  .chapter-head .divider{
    color:var(--gold);
    font-size:14px;
    letter-spacing:0.4em;
    margin-top:14px;
  }

  .leaf-inner p{
    font-size:16.5px;
    line-height:1.98;
    letter-spacing:0.02em;
    margin:0 0 22px;
    text-indent:2em;
  }

  .leaf-inner p:last-child{ margin-bottom:0; }
  .leaf-inner p.continued{ text-indent:0; }

  .leaf-foot{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:var(--gold);
    letter-spacing:0.15em;
  }

  .dots{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    padding:12px 0 20px;
    z-index:20;
    flex-wrap:wrap;
  }

  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--muted);
    opacity:0.35;
    transition:all 260ms ease;
  }

  .dot.active{
    opacity:1;
    background:var(--gold);
    width:16px;
    border-radius:3px;
  }

  .edge{
    position:absolute;
    top:0;
    height:100%;
    width:34px;
    z-index:15;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:15px;
    opacity:0;
    transition:opacity 200ms ease;
    pointer-events:none;
  }

  .edge.show{ opacity:0.5; }
  .edge.left{ left:0; }
  .edge.right{ right:0; }

  .loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:13px;
    letter-spacing:0.2em;
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <span class="title">第六章　腹輪（Swadisthan Chakra）</span>
    <span class="counter"><span id="curPage">1</span> / <span id="totalPage">…</span></span>
  </div>

  <div class="book" id="book">
    <div class="edge left" id="edgeLeft">‹</div>
    <div class="edge right" id="edgeRight">›</div>
    <div class="loading" id="loading">排版中 ◇</div>
    <div class="track no-anim" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

</div>

<div id="measure" class="leaf" style="position:fixed; top:0; left:-9999px; visibility:hidden; height:auto; overflow:visible;">
  <div class="leaf-inner" id="measureInner"></div>
</div>

<script>
(function(){

  var HEADER_HTML =
    '<div class="chapter-head">'+
      '<div class="eyebrow">SWADISTHAN CHAKRA</div>'+
      '<h1>第六章　腹輪（Swadisthan Chakra）</h1>'+
      '<div class="divider">❖</div>'+
    '</div>';

  var PARAGRAPHS = ["宇宙的生命力為了表現自己，採用了不同的形式，顯示出不同的美態。此猶之乎人類為了溫暖，便用他天賦的才智創造了房屋。當人發展出美感，他們更懂得美化居室，最後發展成建築學。這種趨勢會繼續發展，人的感覺越是敏銳，他們越是能創造出美麗的事物。人類會不斷地創作，因為這是他創造力的本質。在進化的第三階段，人類發展出美感。這時，他們第一次能夠超越視覺和聽覺的限制，進入了抽象界。他們能夠想像，預見和設想那些還未存在的事物的形象。憑著這種能力，他們才能夠改善生活的形式。", "從事創作的人首先要有想像力。他要設想那些只存在於腦海之中，郤還未存在於現實界的事物。這種能力是人類獨有的，動物沒有這種能力。那些高度發展了這種能力的人便成為天才，他們成為創意者、社會的先鋒、藝術和文化的前衛之士。", "可是無論做甚麼，人類總有一種不懂得適可而止，走向極端的傾向。這種不斷重複使用同一能力的傾向，會使第二能量中心迅速流失能量，失去平衡。如果不斷透支，無暇稍息，第二中心會變得越來越衰弱。第二中心負責分解腹部的脂肪，供應腦部灰質細胞和白質細胞的需要，使人能進行思考。然而，過量的思考會使陽脈衰竭，並使中脈的能量大量流失。長期這樣做會使自我膨脹，把超我壓下去。這樣我們便會與創造力的泉源，即中脈中斷了聯繫。大腦便會由海綿狀的狀態，變成石頭一般，失去了吸收的能力。所以藝術家和那些經常計劃，沉迷於思考的人通常都是第二中心過弱。", "腹輪左部的性質是真正的知識。得自亡靈的知識是粗淺的和不被認可的。亡靈應該遵從自然秩序的循環，與生人無涉。死亡可以使人重新注入活力，但對亡靈的關注會使我們進入集體潛意識，遭受集體亡靈的滋擾。當我們讓這個力量作主宰，所有恐佈的力量都會被釋放出來。無論他們表面上怎樣幫忙或提供甚麼訊息、，我們都不要與亡靈界溝通。因為這種行為是反乎進化的，對我們的進化過程有礙。如果我們通過中脈靈量的力量建立了聯繫，便有靈感來自上天。", "最近，美國軍方的一位工程師，亦是美國占仗測水者協會副主席的夏維力克博士（Dr.Z.V.Harvalik）宣稱，他找到了人體內接收和感應力的部位。他在實驗室用金屬屏障遮蔽人體不同的部位，最後發現腎上腺是主要的接收地帶。", "如果身體的接收器不能配合能量中心的頻率，它們便會接上一些異常的頻道。這些不良的頻道便是所謂亡靈或干擾心靈之物（Unit of Psychic Interference）5它們在集體潛意識與集體超意識的地帶徘徊不去，無法進昇。它們依靠別的生命體來生存，好像寄生蟲一樣。在正常的情況下，他們不能入侵一個靈性健全的人。但如果那個人失去了專注力，他的腦波便調入那個頻道，亡魂便可附體。如果那個人較弱，亡魂便有機可乘，長期住在裏面，並逐漸控制那個人的頭腦。", "在人體中，第二中心掌管腎臟、肝臟下部、胰臟、脾臟和腸臟的功能。", "肝臟是注意力的所在。注意力是右邊能量的表現。當我們行動時，有關行動的經驗傳到大腦的左邊，產生對行動作某種認可和認定的要求。在一個平衡的社會，這種要求是受到社會制約的。但如果一個人情緒上不平衡，他便更需要不斷的養育。專注力是那種在適當時候，把靈體投射到所需要的境界的能力。注意力的所在不單在頭部，還主要在肝臟。", "酒精能傷害第二中心，因為酒精能燒傷肝臟。肝臟是負責排出熱力的。每個中心都有一個適當的溫度，才能有效運作。如果某中心熱力太多，便會發熱，有需要把熱力散發出來。如果不排出，熱力便會燒傷器官的細胞，使它功能遲鈍。此所以各種宗教的導師和先知都叫人不要喝酒。眾所週知，回教的先知嚴禁門徒喝酒，可是今日那些石油國郤是最大的酒精消費國。因為不忠於靈體的特性，這種酗酒行為會使第二中心閉塞。肝臟失調亦會使第二中心的能量迅速流失。肝臟的問題會傳導到左邊，並會使在頭部左邊的汽球膨脹，形成自我。就算那個人沒有肝炎，也會出現作嘔、昏睡等病徵。肝臟太弱或太熱的人都不能靜坐冥想，他們的注意力分散，不能固定在無思慮的知覺狀態（Thoughtless Awareness）。沒有注意力便不能作靜坐冥想。如果我們好好照顧肝臟，便能防患於未然，使這些問題在早期得到抑制。肝臟有問題的人必然性格暴躁，坐立不安。", "過分人為造作的行為也會使第二中心感應遲鈍。那些按本子辦事和說話的人都有第二中心的問題。在一個外交官家裡，公使的妻子坐在貴賓之旁，無論他說甚麼，她都應道：「真是太好了！」那個貴賓後來說他爸爸上月去世了，她還一味說：「真是太好了！」", "世俗的客套是自然美的大敵。粗淺的造作行為使人失去對真正現實的感應。", "那些活在人為投射出來的世界中的人會以失落告終。情緒低落其實是我們自覺地或不自覺地投射出來的印象引起的。塑膠造的花沒有香氣，如果我們通過一種投射的方式與人相處，便永遠不能感受到人們深處的甜蜜。你頂多可以做到玲瓏八面，左右逢源。然而所謂物以類聚，這樣的人身邊，也只會聚集一群枯燥無味、不知喜樂的淺薄之輩。", "有句話說：「忠於你自己。」如果你對自己的靈體忠實，那麼你便會閃耀著純真的品格。純真是最大的力量，真心誠意便能凝聚好人好事，以誠處世會帶來滿足和喜樂。", "在喜瑪拉雅山冰天雪地中生有一朵白花。此花空有芳香和美麗，卻沒有蜜蜂相訪。有個求道人問此花為何無人欣賞。花兒說：真正的甜蜜只能是與自己合一者分享，不浪擲予過路的人。蜂兒在花間飛來飛去，博採眾蜜，卻不曾真正擁抱過任何一朵。", "希望高人一等的欲望，希望在人前跨耀才華的欲望都是由自我生出來的。自我通過左邊通道聯繫著根輪右部。當一個人的作品背後有一種競爭心時，那個作品便欠缺自然了。此所以現代藝術這麼缺乏生命力。", "如果一個藝術家不平衡，他的作品只是反映出個人和集體的思想積集。除非藝術家成為了生命力表現的渠道，否則他的詩句只是些陳腔濫調。許多本具才華的詩人也常作無病呻吟，把精神花在失戀和過去痛苦的回憶上。但當創作力來臨時，他們的作品便顯現新貌。這時藝術家與上天建立了聯繫，成為集體進化過程的表達通道。這時他便能有所創新，領導社會，帶來喜樂，開發宇宙無窮無盡的財富，社會亦因此而走向成熟。凡不能接上進化過程的社會都會趨向滅亡。六十年代便是這樣，當時的年青人與父母親那一輩的文化格格不相入，於是簡單地作全盤否定，發展出他們的嬉皮士文化或新時代文化。除非有傳統文化作根基，否則所謂新文化只會走入死胡同。", "今天，我們遇到同樣的窘境。迅速改變，拋棄一切，接受新事物的風氣使我們有如扁舟失舵，走到無根的邊緣。這些都不是真正來自上天的靈感。那是來自潛意識（陰脈）或超意識（陽脈），而不是無意識（中脈）。集體無意識是所有創造的生命力，它像一棵樹的營養液，除非樹根（第一中心）接在母親大地之上，否則能量便不能流通。河流不能流入大海，它自己只會滿溢和泛濫。我們需要有源頭活水，打開一切創造力的泉源。現在我們還是沒有根，沒有源頭，沒有建立與上天的聯繫，所以顯得分散，像一盤散沙。如果作品不反映靈體的愛，便沒有生命力，像棵不結果的樹。創作可以成為個人的消遣，自得其樂，但如果沒有生命能量的流通，那只會是枯燥乏味的，或只能成為一時的時尙。藝術不只是畫布上的顏料，它是生命本身，它是分享、溝通、靈感，和與上天結合的基礎。", "如果一個畫家得到了自覺，那麼他的作品便反映了無意識。當畫家、畫筆、畫布結合成一體時，無意識便顯現出來了。在那種自然而然的狀態，靈體便傳來上天的靈感，通過人體而流通。這樣的作品會成為劃時代的創作甚或不朽的經典之作，成為永恆的美麗和喜樂。這些作品將永遠成為靈感和生命能量的泉源。例如米開安琪羅（Michael angel。）在西斯汀教堂的壁畫，莫札特（Mozart）", "的音樂，都能引動人的靈魂。這些作品是文化的里程碑，帶引人類在美感方面的進步，並注入了靈體的生命力。這樣，文化才會繁茂、生長。相反，那些終日把才華用於心靈投射的藝術家，只會造出缺乏生命力的作品。今天，我們要找一個時尙的藝術家才能解釋另一個時尙的藝術家的作品。在音樂方面，那些熱門音樂發出可怕的能量，令植物都會死亡。這樣的作品只會造成一個庸俗不堪的社會。"];

  var END_MARK_HTML = '<div class="leaf-foot">◇</div>';

  var track = document.getElementById('track');
  var book = document.getElementById('book');
  var dotsWrap = document.getElementById('dots');
  var curPageEl = document.getElementById('curPage');
  var totalPageEl = document.getElementById('totalPage');
  var edgeLeft = document.getElementById('edgeLeft');
  var edgeRight = document.getElementById('edgeRight');
  var loadingEl = document.getElementById('loading');
  var measureInner = document.getElementById('measureInner');
  var measureOuter = document.getElementById('measure');

  var index = 0;
  var pages = [];
  var pageOffsets = [];
  var dragging = false, startX = 0, startY = 0;

  function wrapPara(text, indent){
    return '<p' + (indent ? '' : ' class="continued"') + '>' + text + '</p>';
  }

  function measure(html){
    measureInner.innerHTML = html;
    return measureOuter.getBoundingClientRect().height;
  }

  function maxFit(pageHTML, remaining, indent, limit){
    var lo = 0, hi = remaining.length, best = 0;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      var h = measure(pageHTML + wrapPara(remaining.slice(0, mid), indent));
      if(h <= limit){ best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  function globalOffset(paraIdx, charIdx){
    var off = 0;
    for(var i=0;i<paraIdx;i++) off += PARAGRAPHS[i].length;
    return off + charIdx;
  }

  function paginate(){
    var leafW = book.clientWidth;
    measureOuter.style.width = Math.min(leafW, 640) + 'px';
    measureOuter.style.padding = getComputedStyle(document.querySelector('.leaf') || measureOuter).padding;

    var probe = document.createElement('div');
    probe.className = 'leaf';
    probe.style.cssText = 'position:fixed; top:0; left:-9999px; visibility:hidden; width:' + Math.min(leafW,640) + 'px;';
    probe.style.height = book.clientHeight + 'px';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    var padTop = parseFloat(cs.paddingTop), padBot = parseFloat(cs.paddingBottom);
    document.body.removeChild(probe);
    var availableHeight = book.clientHeight - padTop - padBot;

    pages = [];
    pageOffsets = [];

    var paraIdx = 0, charIdx = 0;
    var firstPage = true;

    while(paraIdx < PARAGRAPHS.length){
      var pageHTML = firstPage ? HEADER_HTML : '';
      var startOffset = globalOffset(paraIdx, charIdx);
      var brokeMidPage = false;

      while(paraIdx < PARAGRAPHS.length){
        var text = PARAGRAPHS[paraIdx];
        var remaining = text.slice(charIdx);
        var indent = (charIdx === 0);
        var candidate = pageHTML + wrapPara(remaining, indent);

        if(measure(candidate) <= availableHeight){
          pageHTML = candidate;
          paraIdx++; charIdx = 0;
          continue;
        } else {
          var k = maxFit(pageHTML, remaining, indent, availableHeight);
          if(k > 0){
            pageHTML = pageHTML + wrapPara(remaining.slice(0, k), indent);
            charIdx += k;
          } else if(pageHTML === (firstPage ? HEADER_HTML : '')){
            k = Math.max(1, maxFit('', remaining, indent, availableHeight));
            pageHTML = pageHTML + wrapPara(remaining.slice(0, k), indent);
            charIdx += k;
          }
          brokeMidPage = true;
          break;
        }
      }

      pages.push(pageHTML);
      pageOffsets.push(startOffset);
      firstPage = false;
      if(!brokeMidPage) break;
    }

    if(pages.length){
      var lastIdx = pages.length - 1;
      var withMark = pages[lastIdx] + END_MARK_HTML;
      if(measure(withMark) <= availableHeight){
        pages[lastIdx] = withMark;
      } else {
        pages.push(END_MARK_HTML);
        pageOffsets.push(pageOffsets[lastIdx] + 1);
      }
    }
  }

  function renderPages(keepOffset){
    track.innerHTML = '';
    dotsWrap.innerHTML = '';
    pages.forEach(function(html){
      var leaf = document.createElement('div');
      leaf.className = 'leaf';
      var inner = document.createElement('div');
      inner.className = 'leaf-inner';
      inner.innerHTML = html;
      leaf.appendChild(inner);
      track.appendChild(leaf);

      var dot = document.createElement('div');
      dot.className = 'dot';
      dotsWrap.appendChild(dot);
    });
    totalPageEl.textContent = pages.length;

    var target = 0;
    if(typeof keepOffset === 'number'){
      for(var i=0;i<pageOffsets.length;i++){
        if(pageOffsets[i] <= keepOffset) target = i; else break;
      }
    }
    goTo(target, false);
  }

  function leafWidth(){ return book.clientWidth; }

  function goTo(i, animate){
    index = Math.max(0, Math.min(pages.length - 1, i));
    var w = leafWidth();
    track.classList.toggle('no-anim', animate === false);
    track.style.transform = 'translateX(' + (-index * w) + 'px)';
    var dots = dotsWrap.children;
    for(var n=0;n<dots.length;n++) dots[n].classList.toggle('active', n === index);
    curPageEl.textContent = index + 1;
    edgeLeft.classList.toggle('show', index > 0);
    edgeRight.classList.toggle('show', index < pages.length - 1);
  }

  function rebuild(){
    var keepOffset = pageOffsets.length ? pageOffsets[index] : 0;
    paginate();
    renderPages(keepOffset);
    loadingEl.style.display = 'none';
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 200);
  });
  window.addEventListener('orientationchange', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 250);
  });

  book.addEventListener('touchstart', function(e){
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = true;
    track.classList.add('no-anim');
  }, {passive:true});

  book.addEventListener('touchmove', function(e){
    if(!dragging) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if(Math.abs(dy) > Math.abs(dx)) return;
    var w = leafWidth();
    track.style.transform = 'translateX(' + (-index * w + dx) + 'px)';
  }, {passive:true});

  book.addEventListener('touchend', function(e){
    if(!dragging) return;
    dragging = false;
    var dx = e.changedTouches[0].clientX - startX;
    var w = leafWidth();
    track.classList.remove('no-anim');
    if(Math.abs(dx) > w * 0.18){
      goTo(index + (dx < 0 ? 1 : -1));
    } else {
      goTo(index);
    }
  });

  edgeLeft.addEventListener('click', function(){ goTo(index - 1); });
  edgeRight.addEventListener('click', function(){ goTo(index + 1); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') goTo(index + 1);
    if(e.key === 'ArrowLeft') goTo(index - 1);
  });

  window.addEventListener('load', function(){
    setTimeout(rebuild, 30);
  });
  if(document.readyState === 'complete'){ setTimeout(rebuild, 30); }
})();
</script>

</body>
</html>
