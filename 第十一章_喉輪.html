<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第十一章　喉輪（Visshudhi Chakra）</title>
<style>
  :root{
    --gold:#b8975f;
    --soft:#f7f4ee;
    --card:#fffdf9;
    --muted:#9c9484;
    --ink:#4a4238;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--soft);
    font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .app{
    position:relative;
    height:100vh;
    max-width:640px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px 8px;
    z-index:20;
  }

  .topbar .title{
    font-size:13px;
    letter-spacing:0.28em;
    color:var(--gold);
  }

  .topbar .counter{
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--muted);
  }

  .book{
    position:relative;
    flex:1 1 auto;
    overflow:hidden;
  }

  .track{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    transition:transform 380ms cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .track.no-anim{ transition:none; }

  .leaf{
    flex:0 0 100vw;
    max-width:640px;
    height:100%;
    padding:8px 26px 20px;
    overflow:hidden;
  }

  .leaf-inner{
    display:block;
  }

  .chapter-head{
    text-align:center;
    margin-bottom:30px;
  }

  .chapter-head .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    color:var(--gold);
    margin-bottom:8px;
  }

  .chapter-head h1{
    font-size:24px;
    font-weight:600;
    letter-spacing:0.14em;
    margin:0 0 8px;
  }

  .chapter-head .divider{
    color:var(--gold);
    font-size:14px;
    letter-spacing:0.4em;
    margin-top:14px;
  }

  .leaf-inner p{
    font-size:16.5px;
    line-height:1.98;
    letter-spacing:0.02em;
    margin:0 0 22px;
    text-indent:2em;
  }

  .leaf-inner p:last-child{ margin-bottom:0; }
  .leaf-inner p.continued{ text-indent:0; }

  .leaf-foot{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:var(--gold);
    letter-spacing:0.15em;
  }

  .dots{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    padding:12px 0 20px;
    z-index:20;
    flex-wrap:wrap;
  }

  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--muted);
    opacity:0.35;
    transition:all 260ms ease;
  }

  .dot.active{
    opacity:1;
    background:var(--gold);
    width:16px;
    border-radius:3px;
  }

  .edge{
    position:absolute;
    top:0;
    height:100%;
    width:34px;
    z-index:15;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:15px;
    opacity:0;
    transition:opacity 200ms ease;
    pointer-events:none;
  }

  .edge.show{ opacity:0.5; }
  .edge.left{ left:0; }
  .edge.right{ right:0; }

  .loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:13px;
    letter-spacing:0.2em;
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <span class="title">第十一章　喉輪（Visshudhi Chakra）</span>
    <span class="counter"><span id="curPage">1</span> / <span id="totalPage">…</span></span>
  </div>

  <div class="book" id="book">
    <div class="edge left" id="edgeLeft">‹</div>
    <div class="edge right" id="edgeRight">›</div>
    <div class="loading" id="loading">排版中 ◇</div>
    <div class="track no-anim" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

</div>

<div id="measure" class="leaf" style="position:fixed; top:0; left:-9999px; visibility:hidden; height:auto; overflow:visible;">
  <div class="leaf-inner" id="measureInner"></div>
</div>

<script>
(function(){

  var HEADER_HTML =
    '<div class="chapter-head">'+
      '<div class="eyebrow">VISHUDDHI CHAKRA</div>'+
      '<h1>第十一章　喉輪（Visshudhi Chakra）</h1>'+
      '<div class="divider">❖</div>'+
    '</div>';

  var PARAGRAPHS = ["在進化的第五階段，第五能量中心形成，其作用是表達靈體的喜樂。人類寫作音樂、詩歌來榮耀上天，頌讚人與上天的聯繫。但逐漸地，人類的自我發展起來，吸收了所有的注意力。自我的思維開始投射他自己的觀念。自此之後，第五中心不再是上天的工具，而成為自我的工具。今天第五中心因為人類過分的思維而受到阻塞，不容上天的意識流通。由於第五中心受阻，我們失去了敏銳的感覺，感覺不到自己靈體發出的能量。只有承認絕對真理，我們才可以建立與上天的聯繫。當聯繫建立起來，第五能量中心便會打開，發生作用。", "胡亂唸咒，或念誦假導師傳授的口訣，都會傷害喉部的能量。口訣能對精神起作用，就如單調的催眠曲可減弱嬰兒的知覺，令他入睡。同樣，單調的聲音會使知覺遲鈍，引開了注意力，於是人便感到沒有了壓力，身心舒朗。此所以在生活緊張的社會，販賣口訣的行業十分成功，口訣也有自我催眠的效果。自我催眠是反自覺意識的，只有敏銳的知覺才可把問題解決。當我們了解問題之所在，問題已不再是問題了。就如拼圖遊戲往往令小孩束手無策，但一旦拼合成功，他就會發覺其實十分簡單，難題不再是難題了。", "生命的創造力帶領人類到達新的高度。那些以為自己是真正的行動者，然後以成就自居的人只會變得驕傲。由於成功感，於是自高自大、趾高氣揚，最後引致各種各樣的問題。但當一個人認同於真我，認同於靈體，所有一問題都會消失於無形。人必自尊自重，然後別人才敬重他。我們也要尊重自己的靈量，我們內在的母性力量。沒有尊重，能量便不會流通，靈量也不會作出回應。", "喉輪是身體的第五個過濾器，它非常敏感，保護身體不受外來病毒和細菌的感染。吸入受工業污染的空氣，吸煙等都會傷害這個中心。", "罪疚感會損害此輪。有些人過分關心別人，把他們的行為的責任都包攬在身。如果那個人沒有達到預期的要求，他便感到羞恥，於是他的喉輪便受到阻塞。比方有一個野心很大的女士，每當她丈夫在公眾場合結結巴巴、大出洋相的時候，她便感到受傷害，好像她自己犯了甚麼過錯一樣，於是造成她的第五中心受阻。我們要學習作旁觀者，心不要隨事物而轉。只有我們能冷靜地旁觀，才可以看清楚事物的本相。不偏不倚，才能有效地解決問題。當我們的罪惡感積累下來，便形成潛在的憤怒，對喉輪構成沉重的壓力。最後憤怒會以惡性的形式爆發。此輪如果出問題，亦會對之下各輪穴造成壓力。", "錫呂．瑪塔吉女士說，喉輪極易因罪疚感而阻塞。「因為罪惡的本質是這樣，你開始言語尖刻，態度惡劣。要克服這個問題，你要揀甜蜜好聽的話來說。你要對每個人都言語和順。特別是丈夫對妻子說話要甜蜜。甜蜜的話可清除能量中心的阻塞。你們試找出所有那些令人聽得舒服的說話，甜蜜地稱呼對方是最好清除罪疚感的方法。如果你對人說話尖刻，你不久便會養成習慣，甚至喜歡上這樣做。可是如果你一旦說了句尖刻話，便即反身自問：「神啊！我說了些甚麼呢？」這時你會感到犯下很大的罪惡。因此最好經常把甜蜜的語句掛在嘴邊。且聽鳥兒的歌聲，多麼動聽。同樣地，你們要向所有自然事物的聲音學習，好使人家都會因為聽到你甜蜜動聽的說話而得到快樂。這是十分重要的，否則你的喉輪左部會受阻塞，甚至會使你說話時嘴唇歪向左邊。」", "犬儒主義者和愛作批評的人，此輪特別容易阻塞。冷嘲熱諷來自沮喪的心情，當一個虛假的知識分子無計可施時，便會出言尖酸克薄。好些報章評論員也常常因為國家的危機而出言嘲諷。普羅大眾也愛看這種帶有護罵成分的報導。這樣造成惡性循環。可是憤怒並不能解決問題，我們應依靠容忍和耐心。錫呂．瑪塔吉女士常說：我們應該用愛的力量。冷嘲熱諷、言語尖刻並不能解決甚麼問題，這些批評往往是片面和短視的。片面的觀點往往使問題複雜化。具有廣闊胸襟的人考慮問題時面面俱到，像母親會照顧到家中每一個人的利益一樣。母親是易於寬恕的，她不會計較孩子的錯誤，只想把問題解決。她懂得利用微妙和溫和的手法，不會傷害任何人的自我。觸動別人的自我只會引起反效果，不能起改正作用。在第五中心，這種和自我玩的遊戲會不斷持續下去。那些懂得怎樣去玩的人便可以超越它。我們可以從母親或祖母處學習這種藝術：即如何帶大孩子，令他們順服，不會猜疑。如果懂得循循善誘，兒童便不會受到傷害。到了成人階段，這場遊戲還是要玩下去。且讓我們學習克里希納的應世技巧。印度古語說：百草皆有藥性，人皆有其德，弱者不能看見而已。喉輪還掌管人的溝通能力。通過這種能力，人類學會如何以種種技巧解決紛爭，在人類進化的第五階段，克里希納降世，展示出神的偉大。祂容許暴力成為維護正義的最後手段。但這種暴力不同於宗教狂熱者和種族主義者的暴力。在摩訶婆羅多一書中，正義力量與邪惡力量的戰爭表示真理在最後終會得到勝利。", "喉輪是表達心靈喜樂的管籥。甜蜜動聽的音樂不但娛己，亦以娛人。心靈之籥為內在和外在都帶來喜悅，演奏者自身亦活在喜樂之中。克里希納作為宇宙力量的原型，被繪畫成演奏著笛子的神。猶如花兒可以發出芳香，人也可以發出甜蜜動聽的聲音。語言是心靈的音樂。", "許多通過喉輪的神經叢匯合在一起，叫作明善輪（Hamsa Chakra），它的位置在額輪之下。通過心靈的訓練、社會經驗、教育和灌輸，所有制約都可以在這個中心建立。由於這些思想積集，人們對那些沒有意義的事情也會作用反應，但在得到自覺以後，這個人的心眼便會打開，知道自己受了那些制約，並知道如何改正它。這樣我們便能分辨善惡。我們要經常警覺，不斷改正自己，才能培養出這明辨善惡的能力。", "天地賦予人以集體意識，我們是大有的一個部分。", "我們的最終目的是與大化合一，小宇宙和大宇宙結合在一起。在得到自覺以後，我們亦實現了集體意識。你可以在指掌上感到自己和別人能量中心的能量。這種經驗是中樞神經系統得到啓發的結果。此非嚮壁虛構，亦非概念，而是一個簡單的事實。好像小鳥破蛋而出，我們人類也可以得到第二次出生的機會，進入集體意識的知覺。"];

  var END_MARK_HTML = '<div class="leaf-foot">◇</div>';

  var track = document.getElementById('track');
  var book = document.getElementById('book');
  var dotsWrap = document.getElementById('dots');
  var curPageEl = document.getElementById('curPage');
  var totalPageEl = document.getElementById('totalPage');
  var edgeLeft = document.getElementById('edgeLeft');
  var edgeRight = document.getElementById('edgeRight');
  var loadingEl = document.getElementById('loading');
  var measureInner = document.getElementById('measureInner');
  var measureOuter = document.getElementById('measure');

  var index = 0;
  var pages = [];
  var pageOffsets = [];
  var dragging = false, startX = 0, startY = 0;

  function wrapPara(text, indent){
    return '<p' + (indent ? '' : ' class="continued"') + '>' + text + '</p>';
  }

  function measure(html){
    measureInner.innerHTML = html;
    return measureOuter.getBoundingClientRect().height;
  }

  function maxFit(pageHTML, remaining, indent, limit){
    var lo = 0, hi = remaining.length, best = 0;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      var h = measure(pageHTML + wrapPara(remaining.slice(0, mid), indent));
      if(h <= limit){ best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  function globalOffset(paraIdx, charIdx){
    var off = 0;
    for(var i=0;i<paraIdx;i++) off += PARAGRAPHS[i].length;
    return off + charIdx;
  }

  function paginate(){
    var leafW = book.clientWidth;
    measureOuter.style.width = Math.min(leafW, 640) + 'px';
    measureOuter.style.padding = getComputedStyle(document.querySelector('.leaf') || measureOuter).padding;

    var probe = document.createElement('div');
    probe.className = 'leaf';
    probe.style.cssText = 'position:fixed; top:0; left:-9999px; visibility:hidden; width:' + Math.min(leafW,640) + 'px;';
    probe.style.height = book.clientHeight + 'px';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    var padTop = parseFloat(cs.paddingTop), padBot = parseFloat(cs.paddingBottom);
    document.body.removeChild(probe);
    var availableHeight = book.clientHeight - padTop - padBot;

    pages = [];
    pageOffsets = [];

    var paraIdx = 0, charIdx = 0;
    var firstPage = true;

    while(paraIdx < PARAGRAPHS.length){
      var pageHTML = firstPage ? HEADER_HTML : '';
      var startOffset = globalOffset(paraIdx, charIdx);
      var brokeMidPage = false;

      while(paraIdx < PARAGRAPHS.length){
        var text = PARAGRAPHS[paraIdx];
        var remaining = text.slice(charIdx);
        var indent = (charIdx === 0);
        var candidate = pageHTML + wrapPara(remaining, indent);

        if(measure(candidate) <= availableHeight){
          pageHTML = candidate;
          paraIdx++; charIdx = 0;
          continue;
        } else {
          var k = maxFit(pageHTML, remaining, indent, availableHeight);
          if(k > 0){
            pageHTML = pageHTML + wrapPara(remaining.slice(0, k), indent);
            charIdx += k;
          } else if(pageHTML === (firstPage ? HEADER_HTML : '')){
            k = Math.max(1, maxFit('', remaining, indent, availableHeight));
            pageHTML = pageHTML + wrapPara(remaining.slice(0, k), indent);
            charIdx += k;
          }
          brokeMidPage = true;
          break;
        }
      }

      pages.push(pageHTML);
      pageOffsets.push(startOffset);
      firstPage = false;
      if(!brokeMidPage) break;
    }

    if(pages.length){
      var lastIdx = pages.length - 1;
      var withMark = pages[lastIdx] + END_MARK_HTML;
      if(measure(withMark) <= availableHeight){
        pages[lastIdx] = withMark;
      } else {
        pages.push(END_MARK_HTML);
        pageOffsets.push(pageOffsets[lastIdx] + 1);
      }
    }
  }

  function renderPages(keepOffset){
    track.innerHTML = '';
    dotsWrap.innerHTML = '';
    pages.forEach(function(html){
      var leaf = document.createElement('div');
      leaf.className = 'leaf';
      var inner = document.createElement('div');
      inner.className = 'leaf-inner';
      inner.innerHTML = html;
      leaf.appendChild(inner);
      track.appendChild(leaf);

      var dot = document.createElement('div');
      dot.className = 'dot';
      dotsWrap.appendChild(dot);
    });
    totalPageEl.textContent = pages.length;

    var target = 0;
    if(typeof keepOffset === 'number'){
      for(var i=0;i<pageOffsets.length;i++){
        if(pageOffsets[i] <= keepOffset) target = i; else break;
      }
    }
    goTo(target, false);
  }

  function leafWidth(){ return book.clientWidth; }

  function goTo(i, animate){
    index = Math.max(0, Math.min(pages.length - 1, i));
    var w = leafWidth();
    track.classList.toggle('no-anim', animate === false);
    track.style.transform = 'translateX(' + (-index * w) + 'px)';
    var dots = dotsWrap.children;
    for(var n=0;n<dots.length;n++) dots[n].classList.toggle('active', n === index);
    curPageEl.textContent = index + 1;
    edgeLeft.classList.toggle('show', index > 0);
    edgeRight.classList.toggle('show', index < pages.length - 1);
  }

  function rebuild(){
    var keepOffset = pageOffsets.length ? pageOffsets[index] : 0;
    paginate();
    renderPages(keepOffset);
    loadingEl.style.display = 'none';
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 200);
  });
  window.addEventListener('orientationchange', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 250);
  });

  book.addEventListener('touchstart', function(e){
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = true;
    track.classList.add('no-anim');
  }, {passive:true});

  book.addEventListener('touchmove', function(e){
    if(!dragging) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if(Math.abs(dy) > Math.abs(dx)) return;
    var w = leafWidth();
    track.style.transform = 'translateX(' + (-index * w + dx) + 'px)';
  }, {passive:true});

  book.addEventListener('touchend', function(e){
    if(!dragging) return;
    dragging = false;
    var dx = e.changedTouches[0].clientX - startX;
    var w = leafWidth();
    track.classList.remove('no-anim');
    if(Math.abs(dx) > w * 0.18){
      goTo(index + (dx < 0 ? 1 : -1));
    } else {
      goTo(index);
    }
  });

  edgeLeft.addEventListener('click', function(){ goTo(index - 1); });
  edgeRight.addEventListener('click', function(){ goTo(index + 1); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') goTo(index + 1);
    if(e.key === 'ArrowLeft') goTo(index - 1);
  });

  window.addEventListener('load', function(){
    setTimeout(rebuild, 30);
  });
  if(document.readyState === 'complete'){ setTimeout(rebuild, 30); }
})();
</script>

</body>
</html>
