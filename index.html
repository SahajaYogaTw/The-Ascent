<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生命的昇進 The Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#a9895a;
    --gold-soft:#c8ab7c;
    --ink:#2e2820;
    --ink-soft:#5c5344;
    --soft:#fdfcfa;
    --card:#ffffff;
    --muted:#8c8070;
    --border:#e6ddc9;
    --shadow:0 2px 18px rgba(74,66,56,0.06);
  }
  [data-theme="night"]{
    --gold:#c8ab7c;
    --gold-soft:#a9895a;
    --ink:#e8e0d0;
    --ink-soft:#b7ac97;
    --soft:#201e1a;
    --card:#2a2723;
    --muted:#75695a;
    --border:#3a352d;
    --shadow:0 2px 18px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--soft);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC",sans-serif;
    transition:background .4s ease, color .4s ease;
    overscroll-behavior-y:none;
  }
  .app{max-width:640px; margin:0 auto; min-height:100vh; position:relative;}

  /* ---------- Screens ---------- */
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- Cover / TOC screen ---------- */
  .cover{
    padding:64px 32px 20px;
    text-align:center;
  }
  .cover .mark{
    font-size:13px;
    letter-spacing:.4em;
    color:var(--gold);
    margin-bottom:22px;
  }
  .cover h1{
    font-family:"Noto Serif TC",serif;
    font-size:34px;
    font-weight:700;
    letter-spacing:.08em;
    margin:0 0 6px;
    line-height:1.4;
  }
  .cover .en{
    font-family:"Noto Serif TC",serif;
    font-style:italic;
    font-weight:500;
    color:var(--gold);
    font-size:17px;
    letter-spacing:.12em;
    margin-bottom:18px;
  }
  .cover .author{
    font-size:15px;
    color:var(--ink-soft);
    letter-spacing:.15em;
    margin-bottom:2px;
  }
  .cover .author-en{
    font-size:14px;
    color:var(--muted);
    letter-spacing:.1em;
    margin-bottom:40px;
  }
  .cover .rule{
    width:34px;height:1px;background:var(--gold-soft);
    margin:26px auto;
    opacity:.6;
  }

  .continue-card{
    margin:0 24px 24px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .continue-card.show{display:flex;}
  .continue-card .cc-label{font-size:12px; color:var(--muted); letter-spacing:.15em; margin-bottom:4px;}
  .continue-card .cc-title{font-size:16px; color:var(--ink); font-weight:500;}
  .continue-card .cc-arrow{color:var(--gold); font-size:16px;}

  .mynotes-summary{
    display:none;
    align-items:center; justify-content:space-between;
    margin:0 24px 24px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .mynotes-summary.show{display:flex;}
  .mynotes-summary .ms-label{font-size:12px; color:var(--muted); letter-spacing:.15em; margin-bottom:4px;}
  .mynotes-summary .ms-title{font-size:16px; color:var(--ink); font-weight:500;}
  .mynotes-summary .ms-arrow{color:var(--gold); font-size:16px;}
  .mynotes-list{display:flex; flex-direction:column; gap:10px; padding:0 24px 100px;}
  .mynote-item{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 15px;
    cursor:pointer;
  }
  .mynote-item .mn-body{flex:1;}
  .mynote-item .mn-chap{font-size:11px; color:var(--gold); letter-spacing:.08em; margin-bottom:4px;}
  .mynote-item .mn-text{font-size:14px; color:var(--ink); line-height:1.7;}
  .mynote-item .mn-del{color:var(--muted); font-size:15px; padding:2px 4px; flex-shrink:0;}
  .mynotes-empty{padding:60px 24px; text-align:center; color:var(--muted); font-size:14px;}

  .search-wrap{
    padding:0 24px 18px;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 16px;
  }
  .search-box span{color:var(--gold); font-size:15px;}
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:"Noto Sans TC",sans-serif;
    font-size:16px; color:var(--ink);
  }
  .search-box input::placeholder{color:var(--muted);}

  .search-results{
    padding:0 24px 12px;
  }
  .search-results.empty{display:none;}
  .sr-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .sr-item .sr-chap{font-size:12px; color:var(--gold); letter-spacing:.1em; margin-bottom:5px;}
  .sr-item .sr-snippet{font-size:15px; color:var(--ink-soft); line-height:1.7;}
  .sr-item mark{background:none; color:var(--gold); font-weight:600;}
  .sr-count{font-size:13px; color:var(--muted); padding:0 2px 10px; letter-spacing:.05em;}

  .toc-section-label{
    padding:0 24px 10px;
    font-size:12px;
    letter-spacing:.25em;
    color:var(--muted);
  }
  .toc-list{padding:0 24px 100px;}
  .toc-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 4px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .toc-item:last-child{border-bottom:none;}
  .toc-num{
    font-family:"Noto Serif TC",serif;
    font-size:14px;
    color:var(--gold-soft);
    min-width:24px;
  }
  .toc-title{
    flex:1;
    font-size:17px;
    color:var(--ink);
    font-weight:400;
    letter-spacing:.02em;
  }
  .toc-title-en{
    display:block;
    font-size:12px;
    font-style:italic;
    color:var(--gold-soft);
    letter-spacing:.06em;
    margin-top:3px;
  }
  .toc-arrow{color:var(--muted); font-size:14px;}
  .toc-item.preface .toc-title{font-family:"Noto Serif TC",serif; font-weight:500;}

  .theme-toggle-fixed{
    position:fixed;
    top:20px; right:20px;
    width:42px;height:42px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    font-size:17px;
    cursor:pointer;
    z-index:50;
    box-shadow:var(--shadow);
  }

  /* ---------- Reader screen ---------- */
  .reader-top{
    position:sticky; top:0; z-index:40;
    background:var(--soft);
    padding:14px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    color:var(--gold);
    font-size:13px;
    letter-spacing:.05em;
    cursor:pointer;
    padding:6px 8px 6px 0;
  }
  .back-btn span.sym{font-size:15px;}
  .reader-controls{display:flex; align-items:center; gap:12px;}
  .font-controls{
    display:flex; align-items:center; gap:3px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:11px;
    padding:3px;
  }
  .fc-btn{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    font-family:"Noto Serif TC",serif;
    font-weight:600;
    cursor:pointer;
    border-radius:8px;
  }
  .fc-btn:active{background:var(--soft);}
  .fc-btn.small{font-size:13px;}
  .fc-btn.big{font-size:20px;}
  .fc-divider{width:1px; height:20px; background:var(--border);}
  .theme-btn-inline{
    width:40px;height:40px;
    border-radius:11px;
    background:var(--card);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    font-size:16px;
    cursor:pointer;
  }
  .theme-btn-inline:active{background:var(--soft);}
  .theme-btn-inline.active-mode{
    background:var(--gold);
    color:#fff;
    border-color:var(--gold);
  }

  .progress-track{
    height:2px; background:var(--border);
    position:sticky; top:68px; z-index:39;
  }
  .progress-fill{height:100%; background:var(--gold); width:0%; transition:width .1s linear;}

  .reader-body{
    padding:8px 30px 120px;
  }
  .chap-eyebrow{
    text-align:center;
    font-size:11px;
    letter-spacing:.3em;
    color:var(--muted);
    margin:26px 0 10px;
  }
  .chap-title{
    text-align:center;
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.06em;
    margin:0 0 40px;
  }
  .chap-title-en{
    display:block;
    font-size:14px;
    font-style:italic;
    font-weight:500;
    color:var(--gold);
    letter-spacing:.1em;
    margin-top:8px;
  }
  .reader-body p{
    font-family:"Noto Serif TC",serif;
    line-height:2.15;
    letter-spacing:.03em;
    margin:0 0 1.6em;
    color:var(--ink);
    text-align:justify;
  }
  .poem-block{
    margin:1.8em 0;
    padding:0 4px;
  }
  .poem-block p{
    font-family:"Noto Serif TC",serif;
    line-height:1.85;
    letter-spacing:.04em;
    margin:0 0 0.35em;
    text-align:center;
    color:var(--ink-soft);
    font-style:italic;
  }
  .reader-body p.attribution{
    font-family:"Noto Sans TC",sans-serif;
    font-size:.85em;
    color:var(--muted);
    text-align:right;
    letter-spacing:.05em;
  }
  .reader-body mark{
    background:rgba(169,137,90,.22);
    color:inherit;
    border-radius:2px;
  }
  .reader-body mark.user-hl{
    cursor:pointer;
    padding:0 1px;
    border-radius:2px;
  }
  .hl-colorbar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:70;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:14px 22px calc(14px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -6px 22px rgba(0,0,0,.10);
  }
  .hl-colorbar.show{display:flex;}
  .hl-colorbar-label{font-size:12px; color:var(--muted); letter-spacing:.03em; flex:1; line-height:1.5;}
  .hl-swatch-row{display:flex; align-items:center; gap:11px;}
  .hl-swatch{
    width:26px;height:26px;
    border-radius:50%;
    border:2px solid transparent;
    box-shadow:0 0 0 1px var(--border);
    cursor:pointer;
  }
  .hl-swatch.selected{
    box-shadow:0 0 0 2px var(--ink);
  }
  .hl-done{
    font-size:13px; color:var(--gold); font-weight:600;
    letter-spacing:.05em;
    cursor:pointer;
    padding:6px 4px;
    flex-shrink:0;
  }
  .hl-mode-padding{ padding-bottom:70px; }

  .chap-nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:30px 30px 60px;
    gap:14px;
  }
  .chap-nav-btn{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    cursor:pointer;
  }
  .chap-nav-btn.disabled{opacity:.3; pointer-events:none;}
  .chap-nav-btn .cn-dir{font-size:10px; color:var(--gold); letter-spacing:.2em; margin-bottom:5px;}
  .chap-nav-btn.next{text-align:right;}
  .chap-nav-btn .cn-title{font-size:13px; color:var(--ink-soft); line-height:1.5;}

  ::selection{background:rgba(169,137,90,.3);}

  @media (min-width:641px){
    .app{box-shadow:0 0 60px rgba(74,66,56,.08); min-height:100vh;}
  }
</style>
</head>
<body data-theme="day">
<div class="app">

  <!-- ===== TOC / Home screen ===== -->
  <div class="screen active" id="screen-toc">
    <div class="theme-toggle-fixed" id="themeToggleCover">☾</div>
    <div class="cover">
      <h1>生命的昇進</h1>
      <div class="en">The Ascent</div>
      <div class="author">［印］馬哈贊　著</div>
      <div class="author-en">By Yogi Mahajan</div>
    </div>

    <div class="continue-card" id="continueCard">
      <div>
        <div class="cc-label">◈ 繼續閱讀</div>
        <div class="cc-title" id="continueTitle"></div>
      </div>
      <div class="cc-arrow">▸</div>
    </div>

    <div class="mynotes-summary" id="mynotesSummary">
      <div>
        <div class="ms-label">✧ 我記下的重點</div>
        <div class="ms-title" id="mynotesSummaryTitle"></div>
      </div>
      <div class="ms-arrow">▸</div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <span>✦</span>
        <input type="text" id="searchInput" placeholder="搜尋全書內容…">
      </div>
    </div>

    <div id="searchResultsWrap" class="search-results empty"></div>

    <div id="tocListWrap">
      <div class="toc-section-label">目　錄</div>
      <div class="toc-list" id="tocList"></div>
    </div>
  </div>

  <!-- ===== Reader screen ===== -->
  <div class="screen" id="screen-reader">
    <div class="reader-top">
      <div class="back-btn" id="backBtn"><span class="sym">◂</span> 目錄</div>
      <div class="reader-controls">
        <div class="font-controls">
          <div class="fc-btn small" id="fontDec" title="縮小字級">A</div>
          <div class="fc-divider"></div>
          <div class="fc-btn big" id="fontInc" title="放大字級">A</div>
        </div>
        <div class="theme-btn-inline" id="themeToggleReader" title="日／夜間模式">☾</div>
        <div class="theme-btn-inline" id="hlModeToggle" title="劃重點">✎</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="reader-body" id="readerBody">
      <div class="chap-eyebrow" id="chapEyebrow"></div>
      <h2 class="chap-title" id="chapTitle"></h2>
      <div id="chapContent"></div>
    </div>
    <div class="chap-nav">
      <div class="chap-nav-btn prev" id="prevBtn">
        <div class="cn-dir">◂ 上一章</div>
        <div class="cn-title" id="prevTitle"></div>
      </div>
      <div class="chap-nav-btn next" id="nextBtn">
        <div class="cn-dir">下一章 ▸</div>
        <div class="cn-title" id="nextTitle"></div>
      </div>
    </div>
  </div>

  <!-- ===== My Notes screen ===== -->
  <div class="screen" id="screen-mynotes">
    <div class="reader-top">
      <div class="back-btn" id="mynotesBackBtn"><span class="sym">◂</span> 目錄</div>
    </div>
    <div class="mynotes-list" id="mynotesList"></div>
  </div>

  <div class="hl-colorbar" id="hlColorBar">
    <div class="hl-colorbar-label">選取文字後，點顏色標記</div>
    <div class="hl-swatch-row">
      <div class="hl-swatch" data-color="#f4cf6b" style="background:#f4cf6b"></div>
      <div class="hl-swatch" data-color="#a9c9a0" style="background:#a9c9a0"></div>
      <div class="hl-swatch" data-color="#e3a8ad" style="background:#e3a8ad"></div>
      <div class="hl-swatch" data-color="#9db4d1" style="background:#9db4d1"></div>
    </div>
    <div class="hl-done" id="hlDoneBtn">完成</div>
  </div>

</div>

<script>
const BOOK = {"front": ["生命的昇進", "The Ascent", "［印］馬哈贊著", "By Yogi Mahajan", "根據1993年印度德里版譯出", "序", "靈體不斷呼喚我寫作，字句不斷從她，錫呂．瑪塔吉．涅瑪拉．德維（Shri Mataji Nirmala Devi）女士處來到我的筆端。她為我們這個新時代，即水瓶座時代（Aquarian Age）帶來一種體驗眞理的方法，叫霎哈嘉瑜伽（Sahaja Yoga）。", "我們一生中總有些時候，拋開了自我和社會制約，追求最高的眞理，尋覓靈性的滿足。霎哈嘉瑜伽便是實現眞理，開啓靈性的法門。通過霎哈嘉瑜伽，你可以知道自己內在潛藏的系統，了解它的狀況和功能。練習以後，我們可以看見能量系統奇妙的生長。這個潛藏系統和我們關係極大，系統的各個環節，通過不同的組合方式，決定了我們的心理特徵。本書將揭示到底是何種力量支持著整個能量系統，並討論不同的能量輸入會造成怎樣不同的個人特性。", "我們與生俱來有一種能力，能達到絕對知覺的境界。要實現這種潛能，所需者不過是一點求道之心而已。若道心堅決，我們體內的母性力量便會通過上天之愛和生生不息的生命力，給我們指示簡易的途徑。生命最根本的意義是直截了當的，不可能用概念表達。理性思維的結果只是概念，我們不可能用思維創造甚麼是活生生的，所有活的東西都由大自然創造。在我們生命的內在深處，有一位金光燦爛的女神活著，她是一切生命活動的泉源。", "憑藉大自然和愛的力量，我們可以上昇至這個境界。", "這兩個力量都比理性思維更加精微。工欲善其事，必先利其器，經驗精微的境界，必須憑藉精微的工具。我們首先要越過思維的投射，同時還要取得生活的平衡，然後才能下學上達，與天地同流，打開心眼，洞見眞實。其時於內彷如流著源頭活水，涓涓不息，其聲宛似空谷歌聲，其水有若楊枝甘露，叫人喝了永不言渴。成此境界，實不費分文，不期回饋。天地之能量自然在體內流通，並在最後匯合於整體能量的大海汪洋。", "歷劫修行的求道者終於在今天可以得到滿足了。霎哈嘉瑜伽將會帶給他們眞正滿意的答案。霎哈嘉瑜伽是自然而然的覺醒方式，總結了歷史上各種覺醒方法的精粹。", "今天，使人類集體得到自覺的知識已在世界各地迅速傳播，像曾經預言過的那樣：霎哈嘉瑜伽成為了至高無上的瑜伽，成為了鑑辨眞偽，改變世運的力量，諸天也為之喝采。", "願一切誠實無畏的求道者都因此而得到成就。"], "chapters": [{"title": "第一章 求道者", "paragraphs": ["每個部分都在追尋著全體，因爲部分是由全體來的，它希望重返根源。", "追求眞理是人類的本性，但求道之心卻有深淺強弱之別。其淺者只是種好奇心理，不會導致進一步的行動，其深者有如佛陀對眞我追求之鍥而不捨，九死不悔。追求眞理的熱誠可以粗淺的形式來表現，如旅行家之深入蠻荒，科學家之尋根究底，也可表現爲藝術家的敏銳直覺、好學者對學問的追求。甚至那些不自覺的追求者也是在尋找著，例如借助藥物的癮君子也是在追求著些甚麼，只不過他們仍然在黑暗之中，不知所求者爲何物。", "我們何時成爲眞理的追求者呢？是當有靈感來自內在的時候。在此之前，我們的問題都是外在的，就如小孩子問父母親甚麼是星星，甚麼是太陽，甚麼是月亮一樣。只有內在的靈感才使我們的問題轉變爲內在的追求。我們開始發問：我是誰？我爲甚麼活在此時此地？我跟別人有甚麼牽連？人類的頭腦創造了許多概念。有些我們接受，並應用在生活之中，有些我們不接受，有些我們則去試驗它。由於科學實驗不能提供整全的答案，我們往往走入歧路，甚或死胡同。這種探索，所得者頂多只是思維的投射，又或者是社會的思想積集，這些都是來自我們的自我和超我。通常我們都是通過自我和超我消化外來的訊息，然後對不同的情況作出反應。如果我們能處於平衡、不偏不倚，並能以靜觀及不執著的態度處事，這種知覺狀態便有助於我們昇進。可是這很難做到，人們通常都會被腦筋的千思萬慮所纏繞，沉迷於議論不休。", "在集體的層面，無論思維是通過代表過去的集體潛意識抑或是代表未來的集體超意識，都不會有助於人類的昇進。上述兩種思維方式都是在平面上直線爬行，走一步可能退兩步。人類的昇進像螺旋式向上的運動，它超越了集體潛意識和集體超意識，連接到集體無意識去。", "通過自我和超我過濾的資料只會形成概念。概念不同於眞實。可是自我和超我不是這樣看法。相反，它們會執著於某一觀點不放。同時把自己的觀點強加於人，好像傳播福音那樣。我們只要想像有幾個自我或超我這樣強的人走在一起，世界會變得怎樣。現今世界其實正是如此，於是造成宗教狂熱主義和各種的暴力。", "要對治這個問題，不能只治其標，最重要的是對治其本。如果你希望世界有和平的一天，首先你要得到內在的和平。自我和超我紛亂不休的境界，不可能找到解決問題的答案。答案只有在和平之中，在集體無意識中尋找。當意識進入了這個境界，便不會執著於任何思維概念，不會再對別人說教。此時我們不會去把事物分崩離析，反而會作總覽綜合，以了解事物的整體面相。此時我們有如滴水進入汪洋，眼界變得無窮無限。無窮的智慧啓發了頭腦，此種智慧能令我們看穿不同事物背後的同一性，讓我們知道世間各種事態均是整體大有的一個面相。然而，此種智慧只通於連接集體無意識的頭腦。我們往往想求教於有此種大智的人，但如果找不到，何不自己連接到這個集體無意識，自己直接得到這種大智呢？說時容易，最大的問題是如何連接得上，如何選擇正確的入門途徑？現在市面上有許多牟利的團體，我們應如何選擇？通常在起初時，我們都是通過試誤的方式來選擇。有些團體表面看來很好，但內裏卻問題多多，這時離開它，轉到另一個團體去也不會太壞。又有一些團體，他們話說得很漂亮，但說的是一套，做的是另一套。許多宗教便是這樣，它們的教義是正確的，但行出來的完全不同。當印度聖雄甘地住在南非的時候，他很嚮往基督教，認爲是解決社會種姓制度問題的答案。他懷著滿腔熱誠跑到教堂，所得到的待遇卻是被驅趕坐在一旁的黑人席。甘地當時立即起座離開，永不回頭。那些宗教人士如何能夠一邊大談慈愛，一邊對人大肆壓迫呢。求道者若是眞心誠意，必能認出正確的道路。", "無論追尋甚麼，終有一天你會找到。但是一般事物都有苦樂兩面，不能滿足求道者的眞正需要，此所以在粗淺的層次追求不會帶來眞正的滿足，就像兒童有了一個玩具，還會希望有另一個一樣。只有深入其內，不怕艱辛的求道者才能得到成就。爲採明珠我們甘願深潛碧海，但如果沒有最初靈感的啓發，又有誰會去冒險深潛呢？其實靈感早就潛藏在我們體內的一個泉源。當這個泉源受到發動，人便會昇進爲神。潛能之發動，就如種子生長成大樹一樣。這是生命中最大的奇蹟。古往今來，求道者不知幾多，但那些追求外在形式的人只能得其皮相，只有那些眞正的求道者，才能深入生命之源，發現體內金光燦爛的女神，她便是我們體內的靈量（Kundalini），音譯昆達里尼，經她輕輕一觸，生命便受到點化。", "這是奇蹟中的奇蹟，但此奇蹟千眞萬確存在於每個人生命之中。千古以來智者追求之，經典闡述之，聖人敦行之。爲甚麼過往求道這麼困難呢？其難處其實在於人們只在粗淺的層次追求。世人終日追求可朽壞的財貨，而忘卻不可朽壞的寶藏，就像捨棄寶鑽，拾取琉璃一樣。", "我們要反身自躬，權衡輕重，端正求道的方向。我們須認淸甚麼是暫時的擁有，長遠卻無所得，甚麼是暫時的損失，卻是永恆的得著。", "如何才能喚醒體內金光燦爛的女神呢？只有一途，別無他法。因爲她只喜歡真理，她不會聽世人喧嘩論辯，自語喃喃。她只喜歡由她創造的生命，受創造物散發出的生命能量，在她看來猶如仙樂。仙樂聲終，女神便歸於沉睡。靈量沉睡已有千年，現在，喚醒她的時間終於到了。", "獲得自覺是我們的權利，這是很久很久以前神已預定的。且讓我們堅固求道之心，喚醒體內的靈量，到那時，我們便會發現內在神聖的真我。"]}, {"title": "第二章 靈量（Kundalini）", "paragraphs": ["今天人類思維發展的結果，使我們與生命的根源越離越遠。我們的理論、經濟和科技的發展已走向極端，遠離生命的基礎和活生生的真理。", "生命體的基本特質是自我組織、自我更生和自我投射，內在的意識使生物能自我組織，於是能夠生長，維持和自我保護。自我更生的能力使生命體能夠再生，自我治療，獲得平衡和完成各種系統上的循環，並保持身體的形狀。自我投射則是一種超越思想積集的能力，於是那個生命體便能有所創新。", "這些過程是怎樣完成的呢？一粒種子如何發芽？一隻蛋如何孵化？受了傷的生命體如何復原？爲甚麼身體排斥其他外來物，卻不排斥胚胎？生命體的意識潛藏在身體何處？這都需要用靈量的力量來解釋。", "但我們不能要求洞悉這個奧秘。靈量的律則超出一切之上，它超越了時間、空間、因果，甚至超過了科學。如果我們道心純正，不帶有野心，不作思維分析，靈量便會在靈性的層面作出回應。她會賜給我們無盡的財富，使我們修成正果，得嚐甘露。", "靈量是萬物之母，養育著萬物。她的特性是慈愛、慰藉和關懷。靈量潛藏在人體三角骨之中，呈三圈半的形狀，等待適當的時機。只有一個已實現了自覺的人，才有能力令她昇起。錫呂．瑪塔吉女士說：「靈量是每個人的母親，她怎會對人構成傷害呢？她對你的一切瞭如指掌，時刻渴望給你重生。」", "印度聖人格涅殊羅（Sri Ganeshwari (1275-1297 AD)）這樣說：「靈量是宇宙萬物的母親，亦是天界的最高主宰，她仿如生命的氣息裹上金光，但揭開金光燦爛的外衣，其若隱若現卻似燈火之被微風吹拂，又似空中曇花一現的閃電。」", "---《Sri Gandeva》六章十四節"]}, {"title": "第三章 陰脈、陽脈和中脈", "paragraphs": ["神是甚麼？無神論者說沒有神，有信仰的人會認定有神，儘管他還沒有見過神。誰是誰非呢？無神論者否認有神，他所根據的是甚麼呢？他曾作過靜坐冥想嗎？他曾花過時間作靈性的追求嗎？相反，那些相信有神的人卻能夠有所感應，並不是通過思維，而是從內在獲得感應。且看整個宇宙這樣和諧而有秩序，難道背後沒有甚麼原因，甚麼基本法則在支配其運作嗎？", "眞理的追尋者雖仍未感應到神，但已在正確的道路上。對眞理的追求是人類集體的事業。早期的科學家是如何殫思竭慮，艱苦經營，才發現那些基本的定理，讓今人享受到科技的成果呢？科學不是個人的事業，而是建築在前人基礎之上的，牛頓發現萬有引力，然後愛因斯坦發明相對論，一代接一代，後人憑藉前人的成果，提出新的假設，作新的實驗，發明新的東西。這是歷史上集體力量可以幫助個人的一個例子。", "歷史上，沒有任何一個時間是人類創造的終點。所謂逝者如斯，不捨晝夜。如果一部簡單的機器背後已包含許許多多思維的努力，我們的身體又如何呢？我們身體的功能這樣多，沒有一個自覺力量的支持，生命體又如何進化到現在這個模樣呢？在這一切之背後，必有一個更高的自覺力量存在。錫呂．瑪塔吉女士說：「我們見樹而可想見其根。」", "我們必須謙卑地承認，我們對於支持生命的這個力量一無所知，因爲這個力量之存在遠先於我們。我們如何知道千萬年前，亞當夏娃時代的事呢？這個知識，我們在學校裡可能學得一鱗半爪，但一點零碎的知識不足以引致結論。於是不同的人有不同的看法，互相攻訐。對於主宰生命的力量，我們無從規限，亦無法賦予一個固定的名字。我們只好稱祂爲「自覺原理」、「X」、或「至高無上者」。", "現在我們且假設那個「自覺原理」便是萬有之源，同時我們必須恢復與祂的聯繫。我們不可須臾離開祂，要常活在祂之中，如魚水之兩忘。如何達到這種相忘乎江湖的自覺境界便是霎哈嘉瑜伽所要教授的。我們現在且假設那個最高「自覺原理」是個有著不同強度、不同情態、不同功能的力量。「自覺原理」首先需要一種欲望。", "如果一個科學家沒有欲望，他便不會發明些甚麼。同樣，如果我們沒有欲望，也不會去做甚麼。欲望是一切背後的原動力。佛陀說，欲望是一切痛苦的因由。佛陀所說的欲望和我們這裡所說的欲望不同。佛陀說的欲望是指低層次的欲望，是對有限事物的欲望，這種盲目的欲望常常伴隨著痛苦。但我們亦可以有希求得到覺醒的欲望。已實現自覺的人不是要以大悲心普渡眾生嗎？同樣，我們對神的愛也可有欲望。當「自覺原理」，即神產生欲望時，祂的力量便表現出來，表現爲不同的形式和狀態，形成了整個宇宙。錫呂．瑪塔吉女士說：在人類身體的能量區左邊，有一個欲望的力量，叫月亮脈（Ida Nadi）或陰脈。此脈流經人身的左半邊，把過去的記憶融入意識之中，幫助人們作出行動。當陰脈保持活躍時，人便仍有生存的欲望，當陰脈退回，人便死亡。此脈亦掌管情感，並在右腦位置形成超我（Superego）。以現代的用語，它相當於人的心理（Psyche）。", "另方面，要實現欲望，必憑藉一股力量，這股掌管行動的力量在人體右邊，叫太陽脈（Pingala Nadi）或陽脈。陽脈供應行動的力量。要行動，我們要使用身體，還要認知思考，計劃將來的事情。陽脈便是負責身體活動和思維的，它在左腦形成一個副產品，叫自我（Ego）。在醫學上，左右兩脈表現爲位於脊柱外面的交感神經系統（Sympathetic Nervous System）。", "當這股力量實現了它的欲望後，還要保持獲得的成果。如果我們建成了一間房子，卻不能保有它，那便沒有意思了。這股力量是自覺的，以智慧爲支持。由此便形成了第三脈，即掌管持續和進化的中脈（Sushumna Nadi）。通過智慧，這個力量便升起，恢復與大有根源的聯繫。中脈在人體內表現爲副交感神經系統（Parasympathetic Nervous System）。", "能量系統的能力要在我們得到自覺以後才能實現。追求人生意義的欲望還是不完全的，這個還未實現的欲望表現爲潛藏在體內的靈量。", "當人作出行動時，由於無知，他認爲行動者是他自己，其實他作的都只是關乎死物的事情，一切關乎生物的事情都是由大自然所作。然而人們錯誤的假定助長了他們的自我，使它膨脹如同一氣球。過度的行動亦會使自我膨脹，直到腦腔滿溢爲止。這時，過度膨脹的自我對右邊的超我造成壓力，並使左脈負荷過重。", "這時，那個人便失去了感應能力，他變得孜孜爲利，斤斤計較，愛駕御他人。他的性格是乾巴巴的、狡猾和愛侵略，這個人被自我蒙蔽，很易作出荒謬和愚蠢的事。", "陰脈如果疲弱的話，會造成極端的情緒化。那個人會喜怒無常，時起時伏。傾向於左邊的人是非常易受約制的。他們的性格懶惰，消極和內向。當左邊受的壓力太大時，會產生神經錯亂和癡呆。過度情緒化的人失去平衡，因此助長了右腦那個叫超我（Superego）的力量。超我是反作用於自我的，當它膨脹起來的時候，會把自我壓向另一邊，好像要從陽脈中找到一條出路一樣。同樣，任何一邊過度活躍都會使人像鐘擺一樣，從一邊擺向另一邊。經常搖搖擺擺於兩脈之間會使人失去平衡，對兩脈即交感神經系統造成壓力。", "陽脈掌管男性和陽剛的活動，如分析、競爭、侵略等。陰脈代表女性和陰柔的品質，如柔順、負責、合作、直覺等。", "哈達瑜伽（Hatha Yoga）由Ha和Tha兩字組成，意即日與月，或陽與陰。練習這種瑜伽，可以控制交感神經（左右脈）的活動，即可以增強或完全停止交感神經系統活動一段短時間，同時可能得到副交感神經系統（中脈）的各種低層次的表現，但卻從沒啓動過副交感神經。副交感神經系統才是眞正的瑜伽，才是眞正與上天神聖力量聯合的通道。哈達瑜伽即使能控制左右兩脈，但過分的條件制約，卻不利於生命的昇進。", "交感神經與副交感神經都使用中樞神經系統，霎哈嘉瑜伽指出，人體之中有七個潛在的能量中心。能量通過這些中心，經由大腦細胞，傳入兩個交感神經系統，然後傳導到中樞神經系統。腦細胞的纖維亦因此得到能量，產生智慧。否則大腦如何懂得作加減乘除呢？如何自己作新陳代謝呢？大腦是通過兩個交感神經系統產生智慧的。", "每個細胞都是一個生命體，每個生命體都是通過基因產生意識的。因爲它們有意識，才叫生命體，否則我們便叫它們爲死物。當生命體與意識之間的關係中斷了，那個生命體便算是死了。當人體中任何一脈負荷過重時，那條脈便會受到傷害，並減低了敏感度，導致中樞神經系統無法接收由交感神經和副交感神經傳來的信號。這好像電話線受到干擾，腦細胞及腦纖維無法正常運作，這時便會產生各種各樣心理方面的疾病。身體任何一部分過度活躍亦會導致不平衡。不平衡的狀態會使某些能量中心的能量衰竭，造成癌症等疾病。", "身體衰弱是由於從大化之源吸收的生命能量逐漸減少的緣故。人類的極端傾向使他們離棄了自然的律法。生命能量只有在人能夠達致中和，保持平衡時才得以流通。當人不順應自然之道，便阻塞了生命能量的流通，導致滅亡。", "左腦和右腦負責相反但卻相成的功能。左腦掌管身體的右邊，負責線性思維、計劃、分析等。右腦掌管身體的左邊，負責情感、記憶、欲望等。左腦能使人超越思想積集，轉化自我，向上昇進。言語能力表現在學習和成長的過程之中。左腦可以幫助我們產生創意，新的行爲模式和想法。然後我們通過抽象思維，語言符號，繪畫或其他藝術形式，把意念表達出來。然而，藝術的發展必須要與副交感神經連繫才見精彩，若果一個藝術家以交感神經來創作，他的作品便會顯得線性，局限於潛意識（Sub-Conscious）或超意識（Supra-Conscious）的表現。", "但當這個藝術家通過副交感神經系統來創作時，他的作品便洋溢著自然的、生生不息的創造力。"]}, {"title": "第四章 人體小宇宙", "paragraphs": ["人的身體中有許多個輪穴（chakras），這些輪穴是由於生命能量的轉動，產生成千上萬不同強度的空氣振動而形成的。Chakras這個字的本義是輪。", "輪穴之被稱爲輪穴，是因爲它們是由生命能量旋轉而形成的。各輪穴供應人類精神和情感的能量所需。輪穴是一個順時針方向旋轉的能量場，它有一定的頻率，一定的位置，就好像行星在其軌跡上運動一樣。各個輪穴在醫學上表現爲脊柱以外的不同神經叢，控制著人體各個器官，同時支配著相應部位的神經系統。", "輪穴是意識的中心，每時每刻，它們在接收和發出生命能量。我們必須了解這些輪穴吸入些甚麼，同時甚麼情況會破壞這些輪穴。事實上，我們的每一個念頭，每一個行動都會影響這些輪穴的敏感度和一般表現。當這些輪穴毫無污垢，尙未衰竭時，它們很容易爲上昇起來的靈量穿透。當人把他的注意力放在靈體（Atma）之上，那個人便有了集體意識，這是靈體的特質。", "但如果這個人生活得不檢點，不負責任，輪穴便會變得遲鈍。這時，那個人可以發展出各種各樣的破壞行爲，養成各種各樣的壞習慣。靈量是渴望能整體地上昇的，但如果上面的能量中心不能打開，則只有幾絲的靈量可以通過。靈量會千方百計地上昇。有時在霎哈嘉瑜伽的練習班上，我們可以用肉眼看見靈量衝擊一個阻塞了的中心的情況。靈量會照顧各能量中心的需要，治療各種疾病，清理上昇的通道。霎哈嘉瑜伽治療法便是藉著這個能量系統來達到治療目的的。靈量能夠對身體的各種腺體和機能起著養育、調節和改正的作用，因此能徹底治療各種疾病。", "交感神經和副交感神經都作用於身體內的神經叢，即能量中心。但不同的是，副交感神經紓緩神經叢的壓力，交感神經則通過收緊而擠壓出能量中心的能量。前者輸入生命力，後者卻是去消耗它。在臍部，副交感神經有所中斷，形成一道鴻溝，而交感神經卻沒有中斷。中脈上的鴻溝便是古往今來修道者要越過的大難關，眞正能越過者幾如鳳毛麟角。體內三脈的這種情況就好像有三張梯，左右兩張放在地面，中間一張懸在半空。此所以當人們希望向上昇進時，往往都走入了交感神經，即陰脈和陽脈的通道。死亡時，靈量離開身體，並帶走各能量中心和我們意識的各種狀況，這便即是我們前世和今生所積下來宿因業障（Karma）。", "我們毋須等到死亡才進入天國。如果我們的輪穴打開了、潔淨了，地上也可以成爲天國。了解輪穴的運作異常重要，如果環境不良，輪穴便吸入惡性的力量，引起疾病和種種痛苦。這便是落入地獄，地獄不是死後才到達的，而是我們在地上受苦的處境。", "有三件事很重要：第一，我們必須認識生命的根源，便是我們的輪穴。第二，我們要使這些輪穴強大和清潔。第三，我們要選擇對輪穴有利的良好環境。", "練習霎哈嘉瑜伽，每個人都可以感應到自己和他人的輪穴。這種感應可使我們知道各個輪穴的狀況，治療身體和精神上各種各樣的疾病。因爲我們可以用手來感應到生命能量的振動。"]}, {"title": "第五章 根輪（Mooladhara Chakra）", "paragraphs": ["「起初，大地之母賦予各物生命，她是人類和各種動物繁衍和生育的力量之源。」", "------澳洲 奧魯魯族（Uluru）土著的神話傳說", "古代的智者視大地爲一個生命體，他們崇拜她，視她爲生命之母。只要視大地爲聖潔，具有生命和感應，便不可能無節制地開發她，因爲我們不可能對母親進行侵略和宰制。太空人昇空之後，從星空下望地球，人們才猛然醒悟到她的美麗，開始檢討人與大地的關係，其實從古到今，許多原始民族、傳統社會，都保留著對母親大地的崇拜。", "科學研究的成果使化學家詹姆士．黎富樂（James Lovelock）和微生物學家里因．馬古里斯（Lynn Margulis）相信，地球本身是一個生命體。", "觀察地球的生態特徵，如大氣的成分、海水的鹹度、在行星上和在動物中元素的分配，在在都顯示，地球是一個能自我調節的和諧系統，像生命體那樣具有自我組織的性質。", "地球的性質和活動不可能通過把部分加起來便等如總和那樣來了解。因爲每一個微小的部分都與另一些部分相連繫，互相依存。各部分之間通過許多極爲複雜的 途徑來溝通。地球的外貌是經億萬年演化而成的，並在繼續演化著。上述兩位科學家很清楚地知道，他們提出的所謂新理論，不過是古老神話傳說的翻版。於是他們根據希臘神話傳說中大地之母的名字，命名他們的理論爲「地母假設」（Gaia Hypothesis）。", "每一個生命體都有心靈，如果大地是個生命體，那麼她必像我們一樣具有心靈。有心靈者必有自我意識，這樣說來，大地一定是有自我意識的了。我們體內的第一個能量中心便是由大地之母的自我意識元素造成的。", "靈量的上昇是由靈量的所在開始，通過第一能量中心，一直昇至第七個能量中心，最後穿過頭蓋骨，穿過第七中心，並與表現爲集體意識的靈體結合。", "第一個輪穴位於脊柱末端外少許，它守衛著潛藏在三角骨中的靈量，不讓非神聖的力量進入。", "在進化的第一階段，第一個生命體形如阿米巴蟲。之後，它變得越來越複雜，發展成多細胞的生命體。根輪是由土元素造成的，是一切生命的開始。當這個輪穴被喚醒，它像磁石般的力量便開始發生作用。一個根輪被喚醒的人會有內在的方向感。此輪是心理的基礎，支持著更高的輪穴。對此輪穴作任何損害都會使人失去平衡，造成精神的疾病。", "這個輪穴掌管兩種身體的功能：一是保留，一是排泄。根輪亦在多方面調節生殖系統。對排泄器官施加壓力，如便秘會對這個中心造成不良的影響。跟著我們要闡明，性在進化過程中的作用，我們必須以無邪的心來看待性慾。佛洛依德說壓抑性慾會帶來種種心理問題，然而他的理論走向極端。不錯，壓抑性慾會妨礙健康發展，可是沉迷於性慾的後果更嚴重。現代的性學權威已走到鼓勵人隨便濫交的地步。他們鼓吹性愛越多越好。這樣其實會使系統破壞。事實上，那些人會變成性無能，精神沮喪，不知喜樂，性格非常不自然。沈迷或濫用性慾會使我們與靈體斷絕連繫。", "性慾是絕對正常的、自然的人類慾望。但我們必須正確地看待性慾。性行爲不能令靈量上昇，因此各種性的冒險不能帶我們進入更高的意識狀態。如果我們不把性慾聯繫到人作爲人的階段，而非等同於禽獸，那麼我們便不能達到更高的意識境界。人和禽獸有很大的差別，例如，人作爲萬物之靈，我們知道甚麼是污穢，於是厭惡不潔，而動物卻不知這樣做。支配我們的自然律是由我們進化階段的正確生活方式而來的。我們知道平衡的生活方式很重要。不像其他動物，人類有自由意志，我們可以選擇，甚至選擇走向極端。另一點是人類的行爲要受到集體的制約。", "無論做甚麼，我們都希望得到集體的肯認。例如，我們不會爲醉漢、娼婦立像，或給他 進，而囤積卻會導致停滯，那種人會對社會帶來危害。", "印度的財富女神拉希什米（Laxmi）把財富的性質表示得惟妙惟肖，她一手接受，一手施予。臍輪右部掌管肝臟，同時負責我們在物質界的行動，例如錢財的管理、商務、計劃將來、邏輯思維等。不良的飮食，如過度肥膩的食物，酒類，毒品和藥物，都會影響到這個部位。過度思維也一樣會造成不良影響。其病徵是思想模糊、不能面對將來、生活不檢、財政紊亂、缺乏邏輯思維的能力等。", "家庭生活穩定與否亦會影響臍輪左部。如果丈夫不尊重妻子，或發生了家庭糾紛，臍輪左部便會受到影響。臍輪左部能帶來內在的平靜和滿足。內在的滿足和諧使人的性格平衡，向上昇進。過分匆忙會刺激臍輪左部，使人變得慌張失措，坐立不安，惶惶不可終日。這時，人便失去平衡，易於疏忽犯錯，惶恐和擔憂取代了自我節制的能力。在大部分的情況下，憂慮都是由不受駕御的想像力引起的。這種人專門虐殺喜樂，他們自己不能放鬆，也不讓別人放鬆。雖然緊張如命，煞費苦心，他們往往都一無所得，不碰得焦頭爛額便算好了。", "我們不但要對別人有耐心，對自己也要有耐心。許多時，如果我們不能達到對自己的要求，我們便會覺得沮喪。我們要記著：人不是按時鐘辦事的機器。我們的稟性是歷世進化而成的。人類的努力固然可以作多少的修正，改進錯誤或者精益求精，但這是需要時間的。我們要接受自然的發展過程，讓我們慢慢成熟。這不同於消極主義，因爲我們不是說要消極地任由命運安排。相反我們是有意識地使事情發生。在薄伽梵歌，克里希納教導阿周拿，叫他忠實執行他的義務，不必求報。如果我們要評判自己，我們應因爲自己曾盡全力而感到滿足。", "如果我們明白到這一點，一方面竭盡全力，另方面對自己有耐心，這樣，我們便會活得快樂。", "臍輪左部獲得平靜不但爲自己帶來平安，還會爲周圍的人帶來祥和喜樂。此猶之乎如果我們內在美麗，外表也會相繼美麗。隨著平安而來的是財用，不但個人花費不缺，集體也會財用充足。臍輪可以帶來八種恩賜：繁榮、吉運、尊嚴、靈性上昇、純潔的知識、家庭和集體的喜樂、財富，還有成功。", "如果胃部功能受損，便會危害消化和吸收的過程。第三中心掌管胃部和肝臟的上部。因此，照顧胃部很重要。我們對食物的態度，和我們吃些甚麼都會影響胃液的分泌和有關的腺體。如果進食時太快，動怒或擔憂，食物便會消化得不好。因爲能量大量消耗，胃部肌肉會變得緊張，不能自由地消化食物。我們應該享受平衡的飲食，開心愉快地讓食物進入胃部，然後讓胃液與食物融合，身體便會受到滋養。吃得安樂也是一種靜坐冥想。", "胃部是很敏感的器官。你知道一部液化器需要消耗多少電力嗎？如果一部液化器鬆脫了一顆螺絲釘，它也不能正常運作了。然而儘管得不到好好的照顧，胃部還是發揮出比液化器更大的功能。", "胡亂禁食也會損害這個中心。禁食不能與神接觸。胃部需要定時進食和適當的食物，不可以拿來開玩笑。只有在某種健康狀況下，有適當的指導，才能進行禁", "食。然而禁食本身在靈性修養上沒有重要性。如果腦子裡還是不斷想著食物，禁食又有甚麼作用呢？如果我們的身體不要進食，它自然會發出訊號。霎哈嘉瑜伽是自然而然的，反對所有否定自我和違反自然的行爲。上帝已經爲我們擺下了筵席，我們卻拒絕赴宴。奉神之名禁食是最令人難堪的。我們會在生日、結婚或其他大喜的日子禁食嗎？且讓我們重溫奧義書（Upanishad）的說法：整個世界是神的外衣，捨棄它，然後得回它。"]}, {"title": "第八章 集體意識", "paragraphs": ["古代的聖人視宇宙爲一整體的能量，此能量凝固爲各種各樣物質性的東西。因此各種形狀不同的事物不過是整體能量的一個表現。所有事物不過是一些能量點，它們本質相同，不過是具有不同的頻道，是整體能量不同的排列和組合而已。", "新物理學已經拋棄了視宇宙爲各自獨立的組成部分的看法，而視宇宙爲一個部分和整體互相依存的關係網。", "美國加州大學的史塔普教授（Henry Stapp）指出：「粒子不是個獨立存在的，不可分析的物體。它在本質上是一組與外在各事物相連的關係。」", "生命體是個開放的系統。生命體的生存依賴與外界環境的互動。而外在環境是個包括有機物和無機物兩種形式的生命的過程。因此我們的生態系統是個在所有不同層面上都不斷發生互動的，互相依存的關係網絡。", "從這個角度看，可以想見宇宙各層次不斷變動的結構。從原子內的粒子到銀河系，從細菌到人類。我們可以用新的眼光去看宇宙各部分之間的互相影響和能量的交換。", "這個關係網絡結合了個別人類的心靈和地球的心靈，以至整個太陽系的心靈，最後還結合到一個普遍的、整體宇宙的心靈。", "我們可以假設個體的心靈和整個生態系統是互相作用的，並受宇宙心靈的影響。而且個體心靈能夠與他人的心靈溝通互動，互相影響。這些影響可以是正面的，也可以是負面的。負面的影響表現爲身體的病症，情感或精神上的錯亂。", "因此，人類之間的生物、精神、情感和文化方面的聯繫都不能和集體的過程分開。霎哈嘉瑜伽可以證明這一點。個人的能量中心的障礙和問題都可以通過集體的能量來解決。即使是一個人靜坐，也能得享集體的好處，因此個人要在整體中昇進。", "一個只想到自己生存的生物體最後只會毀滅他賴以生存的環境，並毀滅他自己。因此存在的單位不僅是個體，而且是生物體與環境互動的組織結構。眞正存在者是與環境一而二，二而一的「在其環境中的生命體」。", "人群、社會和文化都有其集體心靈，因而具有集體的意識。心理學家容格（Jung）曾提出一個假設，說集體心靈或集體心理具有集體意識。當個人聯繫到這些集體意識時，他們便會受到那個集體意識的影響。在一定程度上，個人也可以塑造這個集體意識。我們在下一章會討論這是如何可能的。"]}, {"title": "第九章 十大宗師", "paragraphs": ["第二中心圍繞著第三中心旋轉，形成一個虛幻的海洋，它包含了存在的所有方面，如人格、星球和地心吸力對我們的影響、我們的行爲模式和身體的狀況等等。這是一個受外界影響的區域。它代表著那個當我們還未自覺時，我們的知覺隔離於眞理的那個眞空地帶。當靈量充滿了這個眞空地帶，我們的注意力便會被帶離迷幻的海洋，進入對眞實界的知覺。", "當人類繁衍，基本需要得到滿足後，腦子裡便會對創造感到驚奇。我們不禁問：「這一切是如何發生的？」當懇切追求時，那個人便會希望得到引導，但那很困難，因爲一切創造都在他許久以前發生。當你初到某境，你需要問曾到過那裡的人指示方向。同樣，在靈性的追尋中，得到一個已得到自覺的導師的指導是必需的。當我們祈禱的時候，我們說些甚麼呢？我們通常要求得到一些事物，對嗎？例如我們會說：請給我指示道路，請給我這個那個。當我們準備好了自己，我們便可接受指導。在適當的時間，適當的事情才會發生。今天，導師原理（Guru Principle）被喚醒的時候到了。從亙古以來，原始宗師（Primordial Master）開始活躍並降世爲世上各宗教的大宗師，如老子、達陀陀哩耶（Dattatreya）、蘇格拉底、摩西、孔子、索羅亞斯德（Zoroaster）、穆罕默德、那納克（Nanak）等，他們都是幫助人類進化的精神導師。", "不幸，今天有很多江湖郎中和假導師，他們把自己裝扮成眞導師一樣。對於那些頭腦複雜的求道者，他們很難分辨誰是眞正的導師。我們通常會受那些能滿足我們自我概念的人吸引。比方，如果有個人老是把神掛在嘴邊，我們便會當他是精神的導師，甘願作他的奴隸。導師行業成爲今天的一大行業。這些假導師利用人性的弱點來賺錢。他們把你的幻海弄得閉塞了，然後用狗鍊把你鎖在他們的自我之下。你可能會被他們的偽裝人格、個人魅力和善言巧辯所蒙蔽。但如果你和這些錯誤的東西掛了鉤，你便不能繼續昇進，因爲通過自由意志，你選擇把自己交與他們。", "同樣，耶穌基督也曾說過，如果你自願迷失的話，邪靈便會附在你的身上。如果你很脆弱，缺乏內在的力量，你便很容易被使用邪靈的人愚弄，邪靈會附在你身上。因爲那些邪靈像寄生蟲一樣，需要人的心靈來飼養。通過人的心靈，他們能夠加入他們的思想，滿足他們的欲望。一個嗜酒的邪靈需要喝酒，但他不能滿足自己，於是他附在那些酗酒的人身上，鼓動他們酗酒的欲望，叫他們多喝，通過喝酒人的心靈經驗，邪靈便得到滿足。這是爲甚麼邪靈有時候會利用人作靈媒。同時，他們會使那個人更加脆弱，甚至令他生病。因此在聖經中，耶穌基督經常說，他醫治疾病的方法是把病人的身體潔淨，把附體的邪靈趕出。耶穌在加利利海濱把附在瘋子身上的邪靈趕跑，祂所做的其實是恢復那個病人本身的意識，重新支配他自己的身體，把邪靈的控制消除。", "美國肯薩斯州萬寧格（Menninger）基金會的艾瑪．格林博士（ Dr. Elmer Green）是美國著名的精神病專家，他當了宇航心理學家十五年，又作過導彈研究，他說：「根據那些經年研究靈界的人士報告他們發現一些附著在某地的存在物，他們在通常的情況下都不會騷擾人類。從事內在探索的人說，這些存在物的身體完全是由情感、精神、和以太（Ether）造成。他們在這個發展階段，心理上和普通的人類沒有多大分別。他們各自有特別的性格，有些滿懷惡意、殘忍成性、十分狡猾。他們會趁靈媒出神時利用他們的軀殼來活動。如果那個人的性格有某些缺點，他們便會通過他的能量中心來控制他的大腦，然後利用那個人的軀殼來行樂，由於控制過度，有時甚至破壞了那個人的神經系統。許多精神病人都說他們受到精神性的物體控制。可是一般醫生都不加理會，認爲是行爲失常，或是心理的投射，置之不理。」", "有趣的是上文提到，邪靈是通過能量中心來控制人的大腦的。這種說法和基督教傳統的說法一樣。基督教說邪靈停留在感覺和靈體的通道中間，所以不能在靈體最深處構成任何影響，他們只能影響想像力那個部分。", "許多人說能夠降神，其實道理不過如此。許多人自己具有超自然力量，或有超人的感知力，但他們不明白爲甚麼會這樣，也不能把這種能力傳與他人。因爲那些根本不是他們本身的能力，而是有亡魂附體的緣故。人類的正常機能並沒有甚麼神秘。被亡魂附體是十分危險的，能破壞交感神經和副交感神經的功能。由於過度透", "支，身體的能量很快便衰竭。再加以擠壓的話，整個身體的機能便會受到干擾，產生致命的病症。同時亡魂會控制人的頭腦，造成癱瘓或其他心理疾病。", "左邊的交感神經系統具有儲存那些死去的和過去的事物的能力。通過它，我們可以連結到潛意識的儲存庫，或稱集體的潛意識界。在這條通道頂端有個氣球狀的東西，在大腦後面，叫超我。它因爲儲存由左脈而來的思想積集的訊息而變得沉重。如果壓力太大，超我還會被弄得片片碎。要是那個人繼續過分受到社會習慣的制約，超我便會產生局部的眞空地帶，從集體潛意識吸入另一個亡靈進去。所以在修道的過程中，如果你用太多人爲的方法，沉迷於守竅、控制思想、強迫禁欲、勉強靜坐、執著於情感等等，都會使左脈和超我聯繫到集體潛意識去。那裡是所有亡靈、或好或壞、或凡或聖的所在。那些亡靈會通過你來表現他們自己，那時你會得到一些超能力或超感知力，這其實都是由通過超我控制著我們的亡靈那裡來的。", "那些所謂導師還使用一種快捷方便的方法，他們把所謂「能量中心」轉向左脈，這樣你便會和集體潛意識接上。這種方法使受術者進入「跳神」的狀態，完全受到假導師植入的亡靈控制。", "在第一種情況，受術者便感到鬆弛，因爲他的思想完全停止了。練習若干年以後，他才會發覺自己的缺點，他變得不能面對現實，最後走上濫用藥物之途。在第二種情況，受術者完全變成導師的奴隸，不由分說地把自己所有的財產交給他。那些所謂導師也從不解釋他們所用的方法，亦從不把力量傳授他人。所有那些所謂宗教，那些胡亂引動靈量的方法只可以發動交感神經系統，而不能發動副交感神經系統。", "所有那些在催眠狀態下得到的能力，如使亡靈現體、超視能力、語言能力、治療能力、停止思維的超越感覺、靈魂出竅和其他各種各樣的能力，都很容易在那些控制亡靈的人身上找到。在任何一個霎哈嘉瑜伽中心，我們都可以證明這些統統是亡靈的力量。", "這不是神的力量，因爲神對那些粗淺的東西沒有興趣。神只關心人的內在存有，並幫助人類進化。因此那些把注意力放在異象神通的人，很容易爲亡靈所附。", "超能力不一定代表超凡的人格。那些到處炫耀超能力的人明顯地還沒有克服自我。事實上，這種人的學生信徒也只會是追求他的超能力多於追求眞理。他們有些是被誤導的，有些則是機會主義者。他們有些是出於好奇，有些是由於自私，有些是緣於貪念。", "有些江湖騙子利用西方傳統衰落所帶來的靈性眞空，假若一個精神導師是利用恐懼或罪疚感來控制一個團體的話，那麼他便很可疑了。那些討好人們自我的導師更加危險。驕傲和罪疚感一樣，是求道者的大忌。那些穿著導師服飾的團體會反映出導師的心態。有些聰明的導師還可以通過思維來吸引你，他要麼給你更多問題去思考，要麼令你的思想自相矛盾。眞正的導師必然經", "常提醒求道者，找尋自己內在的眞正導師。眞正的導師必然希望有一天門徒能獨立自主。", "求道者在躍入黑暗之前可先查考導師的行爲。首先，那個導師是否躬行其訓，有沒有雙重標準。如果他教人生活儉約，那麼他就不應該在瑞士銀行開有戶口。你也可以反身自問：「我究竟受他甚麼地方吸引？是他的魅力？性方面的吸引力？滔滔雄辯？還是名利成就？」你還可以追問：「我是否以他來填充父母或配偶的形象？我是否只是想參加一些團體，以增加安全感？這是否只是一種逃避？抑或只是一種時髦的玩意？我眞正的目的是甚麼？」如果你的目的是爲了參加某些團體，或者是爲了一些自私的目的，那麼你的道心便不純正了。", "求道之心必須純正，不容有他。只有這樣，眞我才能正確地引導求道者。純正的求道之心是得成正覺的保證。當然，有純正的求道心也未能保證不會被騙，我們還要運用常識和思考。我們發現，今天許多求道者都是拜在假導師門下的。這些假導師使他們盲從附和，無法脫身。你必須清楚自己所學的究竟是甚麼，那些學生信徒有怎麼樣的能力。", "當被亡靈附了體的人來學霎哈嘉瑜伽，他們會像精神病人那樣發抖。如果這個人能克服種種困難，得到自覺，他之後便會對各種神通異象沒有興趣，也不去炫耀它。因爲那時他已脫離了所有那些亡靈的控制。我們毋須先通過潛意識才能達到無意識。潛意識是自己獨立的，進入了的人將會迷失。昇進的唯一途徑是經過中脈，即副交感神經的通道。", "鑽研超心理學和利用潛意識的力量都很危險。因爲這些做法很容易失控，令施術者受害。那些人可能會暫時受惠，長遠卻受到無可彌補的身體、精神和尊嚴方面的損失。", "幻覺和異象是幻海出現問題所引起的。幻海閉塞會形成一張幻象之幕，使我們看不見眞理。除非有一個已得到自覺的導師爲你清除，才有機會痊癒。幻海是導師原理之所在，當導師原理被喚醒時，那個人便變成一個真正的導師。他從上天得到授權，可以喚醒他人的靈量。", "那些沒有到過假導師那裡的人很容易得到自覺，也很容易鞏固他們的自覺。遵行正確生活方式的人，他們的幻海是潔淨的。當正法的力量被喚醒，那時便毋須別人告訴你應該做甚麼，不應該做甚麼。慢慢地，所有壞習慣都能自然而然地根除。"]}, {"title": "第十章 心輪（Heart Chakra）", "paragraphs": ["且讓友誼沒有意義，", "若非爲了靈性加深的緣故。", "------紀伯倫（Kahlil Gibran）", "嬰兒出生時，首先會對母親的靈體作出反應。他尙未能知覺自己與母親的分別，但他卻能知覺靈體，他自己的靈體與母親的靈體。嬰兒從子宮出來時，會感到驚慌。他的第一反應是希望返回子宮，幸好他的靈體受到母親的靈體給予的慰藉，支持著他生活在一個疏離的環境。在這個時期，自我和超我還未發展出來，他是個純粹的靈體。他只對母親的靈體作出反應，那個反應便是無條件的愛。那不是由思想積集造成的反應，而全然是兩個靈體遇合的喜樂。", "眞愛是由靈體而非身體或思維發出的。因此當你說愛一個人時，你要問自己是愛他或她的身體還是靈體。身體方面的吸引是生理性的，是由於性方面的吸引力，夢中情人的形象，對別人才智的欣賞，或畫家所作的形像的投射。身體的吸引不是眞愛，因爲那是由思維造成的。思維不會去愛，只會欲求。由於思想的積集，我們經常把其他東西誤認爲是愛，例如佔有、性慾、自私自利等。於是愛的對象變成是滿足欲望的對象。眞正的愛是超然的，不事佔有。", "當欲望得到滿足後，那種新奇感便沒有了。比方孩童會因爲得到一個新玩具感到興奮，但過了幾天，那種新奇感和興奮便沒有了。建立在身體吸引上的關係會出現同樣的情況。而且那種吸引力可能來自社會制約、傳媒塑造出來的形象，甚至是自我欺騙。有些人懂得怎樣去挑引別人，那些中了外表圈套的人特別危險。在這種情況下，兩人的遇合不是由於靈體，而是身體的形狀。形狀是個概念，只是個幻象，不是眞正的存在。幻象不能去愛或被愛。莎士比亞這樣說：", "「請說迷戀在那裡萌芽？在心底還是在腦海中？迷戀如何生長，如何受到滋養？告訴我，告訴我！", "迷戀由眼睛發亮開始，", "養育得過多，", "迷戀便會消逝，", "在它的搖籃之中。」", "------威尼斯商人第三幕（2）", "你所看見別人的形象只是你思想的投射。只有知道了自己的靈體，你才可以與他人的靈體建立關係。那種關係才是眞正的愛，根深蒂固，帶來永恆的滿足和喜樂。", "許多古老文化的習俗都肯認人的靈體。例如在印度，當新郎到新娘家時，新娘會在門前相迎，禮拜新郎的靈體。因此他們視婚姻爲靈性上的結合。沒有靈性的層次，婚姻只是個社會制度或者契約。後者只是種短暫的關係，或離或合，這種狀態令人失去安全感，對心輪造成不良影響。夫妻間互不信任，恐懼便會將二人分開。現今社會缺乏安全感的問題，不是由於金錢匱乏，而是由於情感的困擾。", "「跟我們談一談婚姻吧。", "他回答說：", "你們一塊出世，也要永遠合一。", "在死神的白羽隔絕你們的歲月時，", "你們也要合一。", "對了，連在靜默地憶想上帝之時，", "你們也要合一。", "不過在你們合一之中，", "要有空間。", "讓上天的風在你們之間舞蹈。」", "---紀伯倫《先知》", "只有通過心輪，我們才能經驗到眞愛的喜樂。如果任何一方，無論是男方還是女方，宰制另一方，或佔有另一方，眞愛便沒有了，他們的關係也會受到破壞。我們要讓靈體愛的能量自由流通，我們便要尊重對方，不以自己的意志妨礙對方的成長。互相了解加深，男女雙方都會知道他們地位平等。女性不喜歡受到宰制，她們在平等的關係中才能肯定自己。男人因爲體力較佳，負責保護家庭，外出謀生。因爲錢在他手，他便很容易感到高高在上。如果女性不能肯定自己的地位，她會感到挫折，並發展出抑壓的憤怒。那種怒氣通常都會發洩在兒童身上，許多時候帶來很壞的後果，經年累月，會造成神經病、乳癌和其他婦科疾病。這都是由於婦女受到壓迫，得不到公平的待遇所致。", "在人類進化的第四個階段，羅摩（Rama）降世，展示理想的夫婦關係。他還展示如何作一個仁民愛物的聖君，恢復了許多衰落了的社會價値。他以身示範聖王治世之道，和如何根據正法建立社會和政治的規範，以符合進化的律則。通過自己的自我犧牲和誠敬的生活方式，他展示了人們應如何生活，那些是良善的和尊貴的行爲，這些行爲使人能夠找到靈體，保護心靈，不受外來侵襲。人類有理性的能力，能保護自己喜樂的泉源和內在的感覺系統。不幸的是，許多時人用理性來對抗他們的心靈。", "羅摩強調子女對父母、父母對子女、妻子對丈夫、丈夫對妻子等等的責任。在他任國王期間，他認爲智慧和高齡是同一物，所以，他常常聽取長者的意見。這對社會的整合和持續是必要的。因爲，如果家庭解體，整個社會便會分崩離析。所以，維持整個社會的秩序，小至家庭，大至國家，都要受到尊重。一個社會要提供社會保障，若果老年人知道自己將要在老人院終老，那麼，不安全的感覺便油然而生了。錢是買不到安全感的。俗語說：老人變小孩，老人很需要愛和關懷。再者，老人的祝福是充滿喜樂的，所以，極端的個人主義", "只會導致孤獨。愛許多時被誤解爲只存在於男女之間，其實愛流通於所有部分：子女、父母、兄弟、姊妹、朋友、老人等中間。當人們彼此相愛，互相關心，整個社會的心輪便會打開，成爲集體的愛，這種力量足以改變整個社會，這便是愛的力量。愛的確具有行動的力量。整個創造本身便是上天浩愛的見證。", "愛能產生自信。有自信的人能抵抗外來的惡性影響。恐懼只會不斷減弱我們的抵抗力，使我們容易患病。那些心輪強大的人會散發出光輝，在生活中成爲不敗的戰士。相反，活在恐懼的深淵，我們的心只會不斷枯萎。心悸和胸部的疾病就是由於缺乏安全感所引起的。現代心理學把許多問題都歸咎於缺乏安全感，我們知道不安全的感覺其實是來自我們的自我。", "我們付出甚麼，就會吸引些甚麼回來。如果你的心輪受阻，你便會吸引到一些也是心輪受阻的伴侶和朋友回來，使到問題持續下去。因此，在建立一個關係之前，我們要使自己的心靈強壯，打好基礎。如果自小缺乏母愛，良好的夫婦關係可以彌補其不足。", "如果你的反應是打從心底發出的話，你便毫不計較別人的缺點，可以和別人一起分享，且樂於施與。一個母親會自然而然把一切都分給孩子，不感到受負累，那便是愛的呼召。愛是使家庭充滿生氣的力量來源，愛維繫著家庭、養育著家庭、支持著家庭。", "強大的心輪是健全人格的基礎。有愛的滋養，人就顯得和藹可親，充滿喜樂。愛之道貴乎自然，有了愛，就如種子吸收土壤的養分一樣、發芽成長。一個醫生如果有愛心，他治療疾病的能力也會增強，即使只對病人噓寒問暖，病人也會感到舒適。有愛心的人能吸引周圍的人，好像蜜糖吸引蜜蜂一樣。愛使我們對人仁慈，不用思維，我們便會主動去幫助別人。這並不是人爲的決定，而是自然而發的。有愛心的人能感受到別人的苦難，這是因爲他對同類具有感通之情的緣故。", "錫呂．瑪塔吉女士經常說：「誰是他人？」「當有限的大腦在知道神以後便變成無限。如果你是太陽和陽光，是月亮和月光，那還何來二元對立？只有還存分別心，才有二元對立，有二元對立，才有執著才有自己和自己的財產等觀念，如果所有事物都是我，還有甚麼他者呢？當大腦失去對自己的認同，有限的大腦便變成無限的靈體了。」", "錫呂．瑪塔吉女士經常感到別人痛苦出現在她的身體上。她經常吸收別人的疾病和痛苦。許多次病人被帶到她面前，都感到病況好轉，而錫呂．瑪塔吉女士卻身受其苦。她微微一笑說：「不要緊，那只是一副皮囊。」而那個病人便被治好了。", "錫呂．瑪塔吉女士認爲沒有愛的世界是個石器時代的世界，因爲人心硬得像石頭一樣，麻木不仁。沒有愛心，任何計劃都會變得乾枯乏味，缺乏歡欣。無怪乎科技不斷進步，人類卻越覺煩悶，毫無喜樂。生產線和市場推銷技巧便是兩個例子。我們的社會及經濟領域也受到同樣的壓力。成功和侵略成爲人類目前的普遍價値。學校變了大規模生產的工廠，向兒童灌輸大規模生產所需要的紀律，培養他們成爲未來的行政人員、企業家、推銷員等等。他們鼓勵兒童去競爭，去爭取勝利，因爲這個世界是屬於勝利者的。在這場競爭中，每個人都要想盡辦法擊倒其他人。那些所謂成功的日本商人有許多都因爲患上心臟病而英年早逝。過度活躍和繁忙的生活會造成各種各樣精神上、情緒上和心理上的疾病。無論一個人在社會上多麼有地位，沒有愛，他只像失去芬芳香氣的花朵，全沒有吸引力。", "過度的右邊活動會使注意力轉移到思維層面。久而久之，注意力習慣停留在思維層面，便不能接受從心靈而來的喜樂。通常我們要有一點支持力，才能把注意力連接到喜樂的泉源。可是許多時，當注意力轉移的時候，往往從右邊走向左邊，不能停在中央的位置。在現代社會，許多人都有這種從一個極端走向另一個極端的毛病。", "只有當注意力移到中脈，我們才能解決行爲走向極端的問題。在思維的層面，我們很難了解宇宙大我的存在，因爲宇宙大我，或神是超過我們思維的層次的。在思維的層面，思想是平面直線發展的，必會迷失在自建的迷宮，產生各種各樣的問題。這些問題沒有眞正的答案，因爲問題本身不眞實存在。心理治療醫生費九牛二虎之力解了一個思想的結，思維馬上又陷入另一些纏繞。但如果那人讓愛注入心輪，問題便會消失於無影無形。那些沉迷於思維的人已把心靈的大門緊閉，只有靈量知道怎樣打開它。我們要相信靈量，靈量能使注意力從右脈回到中脈，並打開心輪。於是靈量便能昇上頭頂部位，使人進入無思無慮的覺醒狀態。經過反覆不斷練習，注意力便會離開右脈，習慣性地停留在中脈。這時整體大我的能量便能穿透心輪，帶來滿足和喜樂。", "要保持平衡，我們必須在各社會團體和各種制度中，建立人類的眞正價値。這樣不但個人能保持平衡，社會也能變得和諧、有創造力和能夠昇進；同時亦能促進社會經濟制度走向平衡，達至集體的福祉。轉變不是來自外在，而是來自核心家庭。例如企業家父親般的慈愛不但能改進生產，同時可滋養心輪右部，給他自己，他的家庭和整個社會帶來滿足。", "同樣的道理也可應用於宏觀的國家政策。如果決策者照顧到人類的價値，他們作的決定便會帶來平安、繁榮和昌盛。心輪強大會帶來富足。在愛的籠罩下，經濟指數也能自然而然地克服障礙。心輪有內在的能力，能應付逆境。這便是愛的力量。有此力量在，所有戰爭和侵略都會終止。如果一個國家造成正面的影響，便能影響整個世界。但心輪的工作並不是一蹴即就的，而是需要耐心和容忍。這些都不是用時間可以量度的。我們且記著：上天的浩愛可令一切事情皆得以成就。", "富人生活太忙碌，根本沒有時間享受。我們要問：一個人在積累大量財富以後，可以做什麼呢？許多時只是多喝兩杯，胡亂花費而已。但如果那個人有內在的平衡，他便能有效地利用金錢。靈性的力量可以穿透生活", "的每一部分，包括經濟、政治、藝術等等，這便是霎哈嘉瑜伽要研究的課題。神創造這個宇宙，不是要叫我們去侵略或去躲懶，而是去慶祝、去頌讚、去享受。所有美麗的藝術品都是遠古時代美的反映。人的身體是一切藝術品中最美好的。從人的身上可看見造物主的愛和榮耀。", "愛是所有被創造物、所有生命能量背後的原理，神就是愛，愛就是神。在眞愛之中，無所謂你我，只有溶合。在溶合之中，我們才能體會到更深層次的人性。從身體表面上看，我們有不同的膚色、身材、樣貌、思想和頭腦。但在愛之中，個別的點滴成大海汪洋，生命能量依不同頻率跳動，造成不同的形狀，生生不息，形成宇宙之舞。可是，仇恨和嫉妒卻形成一股反流量，與宇宙之舞對抗。但有愛存在，便會有生長、有喜樂、有進化。", "我們毋須用強迫的方法去超越自我，許多人誤以爲苦行便是潔淨其身，以爲這些傷害自己的行爲是對的。相反，順適人意的行爲卻是不對的、會麻痺靈體。其實，自我否定與自我虐待都是違反靈體的，會傷害靈體的尊嚴。", "迦比爾（Kabir）說：「如果你不能轉向內在，轉那些念珠又有甚麼用？」", "心臟是身體的泵房，過度的精神或體力消耗，會使這個中心的能量流失，引致嚴重的心臟病。劇烈運動也會令心輪減弱，參加馬拉松賽跑可以證明些甚麼呢？得到冠軍又怎樣？同樣，現代的運動瑜伽只會傷害心輪，往昔的修行者發明一套運動方法，旨在糾正由於不良生活方式所引起的脊柱疾病，希望使身軀回復自然狀態而已，後來才發展成運動瑜伽。但一個健康的人，根本不需要做這種瑜伽。錫呂．瑪塔吉女士說：「就像吃藥一樣，我們斷不會將所有藥都吃下肚。」可是今天，特別是在西方，許多人誤以爲運動瑜伽是提昇靈性的方法。他們花許多時間來練習那些姿勢。然而，即使他們把頭倒立在地，還是找不到神的。", "現在還有許多冠上瑜伽作爲名稱的事物。例如辦公室瑜伽，叫人坐在椅上，向前彎或向後仰，他們需要獲得像玩具一樣具體的東西，以爲向前彎多一點、或向後仰多一點，便是有進步。此猶如有些人以爲身披黃袈裟，行素食，練習身體瑜伽，便可以達到神的境界，這統統都是誤解。衣服的顏色、食物的選擇、瑜伽的姿勢，所有這些都與神無關。只有通過靈量上昇，通過正確的生活方式，與及正確的行爲和思想，才能達到神性的境界。", "迦比爾說：「如果赤裸身體便可以達到神，那麼森林裡的野獸早已找到神了。」", "如果我們把身體當作可以扭橫折曲的機器，我們就會變成機器。運動瑜伽只會令陽脈過分活躍，使人變得枯燥、冷漠、沒有愛心。在這極端的情況下，靈體更會感到不愉快，而想離開身體，此時，這個人便會有心臟病，最後甚至死亡。"]}, {"title": "第十一章 喉輪（Visshudhi Chakra）", "paragraphs": ["在進化的第五階段，第五能量中心形成，其作用是表達靈體的喜樂。人類寫作音樂、詩歌來榮耀上天，頌讚人與上天的聯繫。但逐漸地，人類的自我發展起來，吸收了所有的注意力。自我的思維開始投射他自己的觀念。自此之後，第五中心不再是上天的工具，而成爲自我的工具。今天第五中心因爲人類過分的思維而受到阻塞，不容上天的意識流通。由於第五中心受阻，我們失去了敏銳的感覺，感覺不到自己靈體發出的能量。只有承認絕對眞理，我們才可以建立與上天的聯繫。當聯繫建立起來，第五能量中心便會打開，發生作用。", "胡亂唸咒，或念誦假導師傳授的口訣，都會傷害喉部的能量。口訣能對精神起作用，就如單調的催眠曲可減弱嬰兒的知覺，令他入睡。同樣，單調的聲音會使知覺遲鈍，引開了注意力，於是人便感到沒有了壓力，身心舒朗。此所以在生活緊張的社會，販賣口訣的行業十分成功，口訣也有自我催眠的效果。自我催眠是反自覺意識的，只有敏銳的知覺才可把問題解決。當我們了解問題之所在，問題已不再是問題了。就如拼圖遊戲往往令小孩束手無策，但一旦拼合成功，他就會發覺其實十分簡單，難題不再是難題了。", "生命的創造力帶領人類到達新的高度。那些以爲自己是眞正的行動者，然後以成就自居的人只會變得驕傲。由於成功感，於是自高自大、趾高氣揚，最後引致各種各樣的問題。但當一個人認同於眞我，認同於靈體，所有問題都會消失於無形。人必自尊自重，然後別人才敬重他。我們也要尊重自己的靈量，我們內在的母性力量。沒有尊重，能量便不會流通，靈量也不會作出回應。", "喉輪是身體的第五個過濾器，它非常敏感，保護身體不受外來病毒和細菌的感染。吸入受工業污染的空氣，吸煙等都會傷害這個中心。", "罪疚感會損害此輪。有些人過分關心別人，把他們的行爲的責任都包攬在身。如果那個人沒有達到預期的要求，他便感到羞恥，於是他的喉輪便受到阻塞。比方有一個野心很大的女士，每當她丈夫在公眾場合結結巴巴、大出洋相的時候，她便感到受傷害，好像她自己犯了甚麼過錯一樣，於是造成她的第五中心受阻。我們要學習作旁觀者，心不要隨事物而轉。只有我們能冷靜地旁觀，才可以看清楚事物的本相。不偏不倚，才能有效地解決問題。當我們的罪惡感積累下來，便形成潛在的憤怒，對喉輪構成沉重的壓力。最後憤怒會以惡性的形式爆發。此輪如果出問題，亦會對之下各輪穴造成壓力。", "錫呂．瑪塔吉女士說，喉輪極易因罪疚感而阻塞。「因爲罪惡的本質是這樣，你開始言語尖刻，態度惡劣。要克服這個問題，你要揀甜蜜好聽的話來說。你要對每個人都言語和順。特別是丈夫對妻子說話要甜蜜。甜蜜的話可清除能量中心的阻塞。你們試找出所有那些令人聽得舒服的說話，甜蜜地稱呼對方是最好清除罪疚感的", "方法。如果你對人說話尖刻，你不久便會養成習慣，甚至喜歡上這樣做。可是如果你一旦說了句尖刻話，便即反身自問：「神啊！我說了些甚麼呢？」這時你會感到犯下很大的罪惡。因此最好經常把甜蜜的語句掛在嘴邊。且聽鳥兒的歌聲，多麼動聽。同樣地，你們要向所有自然事物的聲音學習，好使人家都會因爲聽到你甜蜜動聽的說話而得到快樂。這是十分重要的，否則你的喉輪左部會受阻塞，甚至會使你說話時嘴唇歪向左邊。」", "犬儒主義者和愛作批評的人，此輪特別容易阻塞。冷嘲熱諷來自沮喪的心情，當一個虛假的知識分子無計可施時，便會出言尖酸克薄。好些報章評論員也常常因爲國家的危機而出言嘲諷。普羅大眾也愛看這種帶有謾罵成分的報導。這樣造成惡性循環。可是憤怒並不能解決問題，我們應依靠容忍和耐心。錫呂．瑪塔吉女士常說：我們應該用愛的力量。冷嘲熱諷、言語尖刻並不能解決甚麼問題，這些批評往往是片面和短視的。片面的觀點往往使問題複雜化。具有廣闊胸襟的人考慮問題時面面俱到，像母親會照顧到家中每一個人的利益一樣。母親是易於寬恕的，她不會計較孩子的錯誤，只想把問題解決。她懂得利用微妙和溫和的手法，不會傷害任何人的自我。觸動別人的自我只會引起反效果，不能起改正作用。在第五中心，這種和自我玩的遊戲會不斷持續下去。那些懂得怎樣去玩的人便可以超越它。我們可以從母親或祖母處學習這種藝術：即如何帶大孩子，令他們順服，不會猜疑。如果懂得循循善誘，兒童便不會受到傷害。到了成人階段，這場遊戲還是要玩下去。且讓我們學習克里希納的應世技巧。印度古語說：", "百草皆有藥性，", "人皆有其德，", "弱者不能看見而已。", "喉輪還掌管人的溝通能力。通過這種能力，人類學會如何以種種技巧解決紛爭，在人類進化的第五階段，克里希納降世，展示出神的偉大。祂容許暴力成爲維護正義的最後手段。但這種暴力不同於宗教狂熱者和種族主義者的暴力。在摩訶婆羅多一書中，正義力量與邪惡力量的戰爭表示眞理在最後終會得到勝利。", "喉輪是表達心靈喜樂的管籥。甜蜜動聽的音樂不但娛己，亦以娛人。心靈之籥爲內在和外在都帶來喜悅，演奏者自身亦活在喜樂之中。克里希納作爲宇宙力量的原型，被繪畫成演奏著笛子的神。猶如花兒可以發出芳香，人也可以發出甜蜜動聽的聲音。語言是心靈的音樂。", "許多通過喉輪的神經叢匯合在一起，叫作明善輪（Hamsa Chakra），它的位置在額輪之下。通過心靈的訓練、社會經驗、教育和灌輸，所有制約都可以在這個中心建立。由於這些思想積集，人們對那些沒有意義的事情也會作出反應，但在得到自覺以後，這個人的心眼便會打開，知道自己受了那些制約，並知道如何改正它。這樣我們便能分辨善惡。我們要經常警覺，不斷改正自己，才能培養出這明辨善惡的能力。", "天地賦予人以集體意識，我們是大有的一個部分。", "我們的最終目的是與大化合一，小宇宙和大宇宙結合在一起。在得到自覺以後，我們亦實現了集體意識。你可以在指掌上感到自己和別人能量中心的能量。這種經驗是中樞神經系統得到啓發的結果。此非向壁虛構，亦非概念，而是一個簡單的事實。好像小鳥破蛋而出，我們人類也可以得到第二次出生的機會，進入集體意識的知覺。"]}, {"title": "第十二章 額輪（Agnya Chakra）", "paragraphs": ["\u0001POEM\u0001孔雀抱怨說：「我眞要拔掉這些羽毛嗎？這些漂亮的羽毛只會令我變得驕傲。」 無論那個求道者多麼有才智，他都得當心， 追求誘餌，便看不見圈套， 求道者當小心他們的自我，意志和技能， 恐怕沒有其他東西，比自由意志更易置人於死地。", "人類的一切努力，除非與集體意識建立了聯繫，否則只是服務於自我。於是那個人便會產生虛假的信心，釀成災禍。使用和發展人類各方面的才能當然重要，但最好是爲而不持，功成而不居。要時常記著，我們的能力只是集體意識的渠道。", "人類發展的第六階段有三位大宗師降世，他們是佛陀、耆那教的大雄（Mahavira）和耶穌基督。佛陀教導世人慈悲爲懷，反對暴力，又講授八正道，使人能克服自我，生活平衡，於是靈量能夠從中間的通道通過。", "耆那教的大雄教人不要對自己施行暴力，他傳授的訊息很微妙。他教人不要有暴力的思想，通過溫和柔順的思想，超我便可得到昇華，這樣人便能克服思想的積集。耶穌基督則是來到世上幫助世人了解自己的自我，祂甚至讓人把祂釘死在十字架上，引起人們的悔改心，讓他們看見自我的可怕，於是改而活在謙卑之中。耶穌寬恕了那些釘祂在十字架上的人。我們也一樣要寬恕別人，心中的惡意只會把我們往下拉。我們要寬恕別人，把一切過去的留給死去的人。因此，耶穌基督降世是人類靈性昇進的一大突破，祂免去人的罪，使他們的自我昇華。耶穌還教人要互相寬恕，又用自身的復活，證明靈體是不朽的。", "在集體進化的過程之中，一個人的發現往往會爲他人帶來好處。例如，一個科學家發明了某些東西，整個人類都會受惠。我們不必每個人都去重複那個實驗。思想也以同樣的方式出現。當一個觀念在某個偉大的思想家腦中形成，便可給整個社會分享。因爲有些人已成功地這樣做過，社會上其他人按著這樣做便成了。同樣道理，那些大宗師和降世神祇爲我們開啓了道路，我們便毋須重頭做起，因爲祂們已經爲我們準備好了。是以如果耶穌基督已爲我們開啓了一個門戶，已爲我們受了苦，我們便毋須再受苦了。", "很不幸，我們的第六中心，在今天因爲一個錯誤的想法而受到阻塞，那個錯誤的想法認爲我們要承擔生命積累下來的罪。耶穌基督已經免了我們的債，寬恕了我們的罪，使我們在生命進化的過程中取得一大突破。這是耶穌基督的貢獻，我們應因此而懷念祂，否則祂的降生便沒有意義了。由於耶穌基督已經寬恕了我們，我們便毋須背負著過去的包袱，老是認爲自己有罪。", "那些不能寬恕別人的人在第六中心會有阻塞。無論你寬恕或不寬恕別人，無論你做甚麼或甚麼都不做，結果都是一樣。你懷恨於心只會污染你自己思想，妨礙你自己的進化，被你記恨的人一點也不會受到影響。這種做法只會使自我越來越大。要超越自我，我們要學習耶穌基督的寬恕，不肯學習寬恕的人將不能進入上帝的國。", "現在已經有一些心理學家研究霎哈嘉瑜伽。在日本東京，索菲亞大學東方宗教研究所的負責人，威廉．莊士敦（William Johnston）說：「不肯寬恕別人，在記憶中潛藏憤怒，對人是很有害的。由於早期的創傷，有些人拒絕接受別人，認爲別人是不成的，也不接受自己，認爲自己也是不成的，最後這種人只會鬧至精神崩潰。這種問題的根本原因是不自覺地拒絕去愛，例如他們不肯寬恕自己的父母。這樣的人很難去愛別人和寬恕別人，因爲他們遇到甚麼人，都把雙親的形象投射在他們身上。有些人能夠有意識地寬恕別人，但在無意識中卻不能夠，於是不能夠像普通人那樣去愛人。」", "同情共感的另一面是愛與寬恕，如果我們能忘記過去，便如同蓮花般美麗，散發出芳香。", "冤冤相報是種幼稚的行爲，表示那個人還不成熟，還要玩壞人必定要受罰的遊戲。如果殺人者逃脫，就要拿他的孩子來抵罪。復仇的行爲結果只會毀滅自我。", "「在此神殿圍牆之內，我們不知甚麼叫報復，如果有人拋棄責任，愛可使他重新肩負責任。", "伸出友誼之手，", "引他向光明之國。", "那裡人群之間，都由愛來維繫。所有的罪都得赦免，找不到一個背叛的人，那些愛的力量也不能維繫者，便不配活在光明之國。」", "------莫札特：最後的歌劇", "耶穌基督向人類說明了聖靈的眞相和律則，告訴他們別犯下對抗靈體的罪。聖靈在每個人體內的反映便是靈量，即母親愛的力量。耶穌基督說的洗禮是指喚醒人們體內沉睡的力量，讓人們得到自覺。我們的頭蓋骨頂端便是與無所不在的神聖力量建立聯繫的孔道。眞正的洗禮是穿透頭蓋骨，建立這個聯繫。消極的思想、壞習慣、淫邪的眼神會損害這個中心的注意力。過度的視覺娛樂，例如：看得太多電視和電影也會令此中心能量衰竭。", "當我們能超越思維和理性時，第六中心，即通往天國的通道便會打開，讓靈量通過。耶穌基督早已說過，只有那些純眞如兒童的人才能進入上帝的國。", "對神有錯誤的觀念也會使這個中心堵塞。宗教人士往往變得很教條，他們只是忠於經典上的字句，而不是先知的眞正教導。我們不應該變得教條和狂熱。我們應該遵從佛陀之道，而不是佛教；基督之道，而不是基督教。表面的東西是沒有多大用處的。如果你把一幅勞斯萊斯汽車的圖像掛在頸項，你是否能移動一分一吋呢？現在爲宗教狂熱而流的血，已比世界大戰還要多。", "意守第六能量中心是十分危險的，會使這個中心負荷過重，受到破壞。那些具天眼通的人不能受超自然力量的吸引，走上反進化的道路，對他們身心都構成莫大危害。", "靈量是那個使你能夠活在當下，不走向過去，也不走向將來的力量。過去好像磁石一般，常常吸引你的注意力，要你成爲它的媒體。但當靈量昇起，靈量變成更大的磁石，吸引你走向中心，活在當下。如果你的注意力在過去，也許很快便要找心理醫生了。但當你活在當下，你便超越了心理學。", "精神是高於物質的，你不是你的情感，也不是你的理智，靈體是高於精神的。你應該努力成爲靈體。活在當下是異常快樂的，每一刻，你都對宇宙的汪洋大海，即集體意識，或稱之爲神，作出回應。你可以經常活在這個喜樂的泉源之中。通過種種方式，我們被迫活在世俗的狀態，不是被定型於活在過去，便是被定型於活在將來。活在當下是無法勉強的，只有自然而然才能達到。只有活在當下，生命意義才會展現出來。", "動物不能作心靈投射，只有人類能夠。例如，畫家能夠投射抽象的形象，然後畫在畫布上。建築師構想一個意念，然後畫成藍圖。通過這種能力，我們漸漸學會玩思想的遊戲，建立空中的樓閣，然後又去摧毀它。心靈投射的能力使我們能夠進入不同的層次。但許多時，我們會被自己的遊戲逮住，希望釋放自己。求道的過程不是別的，而是努力離開自己所建的思維的迷宮。", "心靈的投射只是個概念。錫呂．瑪塔吉女士說：概念並非眞實，它只是種無知。當無知去除後，人便受到啓發。虛妄去盡，便見眞實。比如在夢中，我們以爲發生了甚麼事情，但一覺醒來，便知道那是幻象。有時我們會說：「噢，我還以爲那是眞的，誰知不過是誤解。」我們的結論來自邏輯推理，但如果前提是虛假的，結論也會跟著是虛假的。只有當我們看見現實，才能辨別虛妄。當我們經驗到事物的幽隱層次時，它的粗糙面紗才會解下。最後的眞實不能繼續剝開，此猶如剝洋蔥，剝到最裡層時，便不能再剝下去了。這一點很重要，心靈好像洋蔥一樣，當所有概念都放下後，只有靈體在閃亮。這才是眞正的現實，其他東西都是虛妄的。", "有些人認爲眞理也是相對的，對某個人是眞的道理，對另一個人未必是眞。「這是我的道理，那是你的道理。」這種說法是屬於思維層面的，說話者也只生活在這個層次。此猶之乎電腦只能根據輸入的資料輸出答案。因此，在心智的層面，只有心智的投射才會被視爲眞理。在蘇格拉底的時代，一個人是否偉大要看他的智力和思辯的能力。那些學者辯士能夠邏輯地證明人是牛。今天的宗教論爭和政治宣傳其實在玩著同樣的遊戲。", "霎哈嘉瑜伽不依賴任何思辯的能力。它是通過既內在又外在的微妙力量來運作。在內，靈量對每個行爲都作出回應。當對靈體的知覺喚醒我們的中樞神經系統，我們便可以實際上感覺到靈體的能量。當我們的注意力轉到自己內在的意識，我們便可以提昇他人的靈量。我們可以感覺到靈量在他人身體的位置和上昇的情況。這樣我們便建立了集體意識，變成一個整全的生命體。再往下去，我們便說不出人我之分。愛的力量何等偉大，只要我們運用雙手，便能提昇別人的靈量。只有這樣，才可能成就人類集體的自覺，在這個黑暗時代喚醒眞理。", "每個能量中心在內和在外都代表著自然的一個基本律法。如果我們違反任何一個律法，便立即在那個能量中心反映出來，並使我們的某個指頭發熱。這樣，我們便可以經驗到所有創造背後的力量，由一粒種子到天上的星球，由一粒原子到整個銀河系，由微觀的生命到宏觀的生命。一旦我們的集體意識鞏固了，便有分辨眞假對錯的能力。這不是簡單的辨別是非黑白，而是揭開了生命的眞相。如此個人才可以超越一己形軀之私，看見生命的普遍眞理。科學家努力通過顯微鏡試圖發現這個眞理。現在，到了眞理全盤向我們展現的時候了。此不單是爲了我們的進化，還爲了我們的生存。錫呂．瑪塔吉女士說，現在是開花結果的時代，人類永恆的追求將會得到集體的實現。"]}, {"title": "第十三章 頂輪（Sahasrara Chakra）", "paragraphs": ["當靈量穿過所有能量中心，便昇上第七個能量中心，打開第五次元的世界。靈量啓發了智慧，使人經驗到眞我。眞我的每一行爲都是屬靈和神聖的，因爲眞我由靈體所生。這時，我們超越了精神和理性，成爲靈體，而不是自我的工具。", "在這種狀態下，意識經驗到自身。集體無意識並不是說沒有意識，而是更敏銳的意識層次，是一般世俗的意識不能達到的。當靈量打開第七中心時，我們便可以在中樞神經系統經驗到集體無意識。這不是個假設，而是活生生的事實。你可以感到靈量在頭頂上昇，熱力和內在的緊張都得以清除，並且感到一股涼風從頭頂昇起。這時，你便進入了和諧的狀態，感到平安、寧靜和喜樂。這是個自然而然的過程。如果你試圖分析它、投射它，便會有別的反應。例如情緒化的人會越加情緒化，進入潛意識，而理智強的人會經驗到思維的投射。這是個生命的過程，就像種子發芽便會成長。英國詩人布萊克（William Blake）這樣寫道：", "「且看花兒發出芳香，誰可解釋：爲何小小的花兒有如此甜蜜的香氣？不要去想它，永恆便會擴大。」", "人們唯一要做的事情是把種子放在母親大地上。同樣地，一個得到自覺的人能把你的靈量昇起，連接上生命的根源。當靈量昇起後，便把走向過去或將來的注意力奪回來，固定在現在這一刻。靈量不斷按自己的意識工作，她是靈體的純潔欲望。因此身體如果有甚麼障礙，她都會清除它們。靈量就像生命的河流，經常沖刷那些障礙，最後一沖而出，直到大海汪洋。", "求道者只要將一切交給靈量。當靈量昇起時，她便會向我們顯示眞理。這不是要經過分析的事情。而是要在你身上發生的事實，十分簡單，十分明白。你只要簡單地讓靈量昇起，然後體會昇進後的經驗。然而，懷疑的心靈卻不能有所昇進。", "「那些無知的人，沒有信心的人，懷疑的人都會被淘汰。因爲對於那些懷疑的心靈來說，無所謂此世界或更高的世界，也沒有喜樂。我們要對生命有積極的態度，絕不動搖的信心，去追求眞理，面對生命。」", "------薄伽梵歌IV:40", "第七能量中心包含了所有其他的能量中心。上文說過靈體位於心輪，其實在頭頂上正中也有靈體的位置，此亦即靈量穿透，注意力與上天合一的位置。在靈體被喚醒前，每個中心的能量是有限的，但當靈量像一條金線那樣，把所有中心像穿珠般穿透了以後，能量便變成無限。此猶之乎池中的水是靜止有盡的，但源頭活水卻永遠新鮮，無窮無盡。建立了聯繫以後，我們便產生與靈體，與萬有合一的超越感覺。這是生命整合於全體的狀態，不是鬼附，亦非進入了潛意識，而是種生生不息的狀態。在這種狀態中，能量自然而然地流通，不用人", "爲強制。通過靈體的經驗，我們可以體會到絕對眞理。絕對眞理是超乎一切猜測、幻想和否定的。在集體無意識中，再沒有形相，再沒有自我，也沒有因果和活動。", "這時，我們便進入了整合的集體意識，成爲集體意識的鏡子。靈量的金光喚醒心智，進入不可知的層次。我們的大腦變成集體意識的終端機，執行宇宙的律法。此時再無個人、朋黨或自我觀念的餘地，我們變成普遍存有的一部分，自然而然地得到與上天的聯合和人格整合。通過生命能量，我們毫無困難地進入精微的溝通方式。由於超越了自我，我們便能享受眞實的美麗，不再受心靈投射的迷惑。從這個觀點看，所有事物都是一齣戲。這是無我的經驗，了解了不變的眞實，所有自我認同的幻象都會煙消雲散。在這種狀態下，我們在做各樣活動時，都能保持清醒敏銳的知覺。當人類意識調合到無限，也會變成無限，自然而然得到啓發。古代聖賢曾經頌讚這種境界，詩意地形容爲與愛人的聯合。佛陀說是空，大雄說是涅槃，吠陀經說是解脫，耶穌說是進入了上帝的國。", "印度聖人格涅殊羅這樣形容得到自覺後的經驗：「靈量保持她的力量，直至她溶入大梵之中，穩固在頭頂的位置。她張開雙臂，好像說：我便是大梵。這時由五個元素造成的迷幕便會降下，生命能量與大梵合一。靈量之與大梵合一，就好像海水變成雲朵，復下降到江河上，然後回歸大海。同樣，我們個別的靈魂，通過人的形體，與大梵重新合一。」", "「到了那個境界，再沒有知識的對象，所有說法都是空。心思路絕，言語道斷，所有迷惑的概念都會消失，這個美麗的境界是思想所遠遠不能達到的。它無始無終、無窮無盡，是最偉大的心靈，是宇宙的眞正胚胎。練習瑜伽的最終目標正是這種無邊的喜樂。到了這個階段，所有形式都無效用 。那些不畏艱辛的求道者最終都會找到眞我，那便是最後的歸宿。」", "「到了那個境界，我們再無法感知她的聲音、光亮和偉大。那裡空空如也，仿似心靈停頓，又似風之靜止。那時我們便毋須靜坐，也再沒有妄想和種種概念。到了這個境界，所有那些低層次的元素都融合在一起。」", "Ganeshwari 15節", "這是個人能夠覺知至高靈體的自覺境界，這時上天的愛在我們眼前全幅展現。存在、自覺、喜樂三者合而爲一。"]}, {"title": "第十四章 神聖的生命能量", "paragraphs": ["生命能量的不同排列組合，形成宇宙之舞各種各樣的形狀。上天的生命能量沒有靜止不動的結構，而是變動不居的，並具生命能量。人體的細胞每時每刻都在吸收著和放射著能量。過去每一個降世神祇都描述過這種生命能量。耶穌基督說是「聖靈的涼風」，商羯羅（Shankra charya）說在涼風中得入極樂，格涅殊羅這樣寫道：", "「由靈量而來的生命之風使身體內外都感到清涼。」", "這種經驗，在獲得自覺以後，便可以知道了。當靈量穿過頭蓋骨昇至頭頂之上，我們便能意識到上天的力量，我們的感應變得敏銳，並開始從指尖感應到這無所不在的力量。", "通過霎哈嘉瑜伽，我們便能知道自己和他人身體上哪一個能量中心出現問題，並依正確的方法來改正它。許多有複雜病症的人，他們的靈量第一次昇起以後，都退回治療有病的能量中心。在霎哈嘉瑜伽，所有關於生命能量的知識都是免費傳授的。若能與上天的聯繫建立得好，一個練習霎哈嘉瑜伽的人能令其他人有同樣的知覺，可以提昇別人的靈量，並在指頭上感應出能量中心的特性和問題。", "對生命能量有所知覺，即使在人群之中，我們也能保持平衡。因爲我們可以覺知外界環境改變對我們生命能量造成的影響。例如我們遇見發出熱的能量的人，便能感覺到受他滋擾。熱力表示不良的能量正在襲擊我們。我們的自衛本能會促使我們防衛那些惡性影響。就好像我們保護自己，不暴露於惡劣的天氣一樣，我們要保護自己的生命能量。因此了解生命能量，懂得解讀生命能量的訊息很重要，這便是霎哈嘉瑜伽的精粹。", "巴泰齊亞博士（Dr. B. Bhattacharya）在他的著作《宇宙射線治療法》（\\\"The Science of Cosmic Ray Therapy\\\"）中如此說道：「一個人的照片與眞人有相同的能量振動，宇宙射線集中在某人的照片上，即在瞬間以光速找到並包圍那個眞人。宇宙射線能即時在那個人身上發生作用。」在得到自覺以後，我們可以從錫呂．瑪塔吉女士甚至她的照片接收生命能量。這和上述的說法符合。同時有了這種對生命能量的知覺，我們可以從感應一個人的照片而知道他的毛病。"]}, {"title": "第十五章 靜坐冥想", "paragraphs": ["「靜坐冥想」（Meditation）這個詞在今天變得很含混，好像甚麼都可以叫做靜坐冥想。靜坐冥想其實不可能用概念去界定，但我們卻可以辨別靜坐冥想的動機。有些人是爲了治療身體的疾病，促進健康；有些人是爲了在靈性上得到自覺。一般來說，靜坐冥想的目的是要與整體大我聯合起來。這個整體大我可以有不同的名稱，或稱之爲神，或稱之爲天父上帝，或稱之爲集體意識，其背後的意思都是爲了達到合一。如何達到這個目標呢？我們思想過、閱讀過、歌頌過，但這是如何發生的呢？答案是要通過靜坐冥想，但如何作靜坐冥想呢？霎哈嘉瑜伽能將這理想變成現實，使我們調合到自己的靈體。在開始時或許不能馬上鞏固這個聯繫，卻至少可以經驗到無思無慮的自覺境界。經過恆常的練習，便能鞏固這個狀態。當身體上的七個能量中心都恢復了健康，靈量便會停留在第七中心，啓發我們的中樞神經系統，這時我們便能全然醒覺自己的靈性存在，成爲靈體本身。這便是靜坐冥想的極致。現在且讓我們看看在達到這一點前，會經過甚麼階段。", "當你閉目靜坐時，不同的意念情緒會影響著你。甚麼東西會決定你靜坐時的心情？若果當天你事事如意，靜坐時你必會感到滿足，輕鬆寫意；若果當天你過得不愉快，靜坐時便會感到心情低落。這些情緒都是來自「自我」或「超我」，因爲靈體是沒有情緒的。", "當我們閉目靜坐時，許多時都會有雜念。第一步要做到的是作旁觀者般的觀察。思想來了又去，好像我們站在馬路上看車輛的往來，漸漸地，我們會發現兩個念頭之間有一空隙。這個空間會越來越大。第二便是停留在這個空間，這便是無思無慮的覺醒狀態。當注意力從雜念轉移到這個空間時，我們便可冷靜地觀察潛意識。當我們能自覺地觀察，潛意識便不能吸引我們的注意力。", "起初，你會受到過去的經歷纏繞。但練習靜觀一切便能克服這個問題。過去的創傷會在你腦海中留下疤痕，你越是活在你的過去中，你過去的悲劇便會越佔去你的生活。若長期活在悲劇之中，你會變得憂傷。人的天賦本質本來等同於整個宇宙的力量，所謂第二本質不過是人自己賦予而已。童年時的痛苦往往留下印記，成爲我們的第二本質。許多恐懼和老年時的怪異行爲都源於我們心靈的深處。通過靜坐冥想，我們可以了解這些問題，並知道怎樣去糾正它。這不是別人可以爲你做的，每個人都要解決自己的問題。在靜坐冥想中，我們的注意力變得敏銳，頭腦變得精微，可以時常觀察到思維的變化。有了這種能力，思維的印象便不會積累在潛意識中。過去思想積集造成的疤痕會被靈量治癒。靈量以不同的韻律傳播她的生命能量。生命能量能潔淨各個能量中心。在靜坐冥想當中，思想的內容並不重要，注意力之所在才最重要。儘管有各種認知和想像出現，但它們都不是靜坐冥想的目標。我們不要把靜坐冥想混同於超視覺訓練、白日夢、自我暗示和自我催眠，或其他心理治療的技巧。靜坐冥想是學習去經驗，這種經驗不是由有意選擇的方法或習慣而來的。", "睡眠時最好把注意力停留在頭頂部位。在這種狀態，注意力不會被吸引到潛意識去。我們能夠熟睡，醒來容光煥發。睡眠的時間可能很短，但由於我們連繫到無所不在的整體能量，故補充得很快。如果能整天保持這個連繫，我們便不會感到疲倦。在這個狀態，我們不會覺得自己做過任何事。一切都自然地發生，好像有一個無形的指揮家指揮著樂隊演奏，我們則作爲觀眾去享受。「事情是由我做的。」這種觀念會把我們往下拉。這種「我做事」的意識造成緊張，令我們疲倦，身心交瘁。在緊張的狀態，與宇宙能量的連繫中斷，只倚靠中樞神經系統來補充能量。在極端的情況下，中樞神經系統衰竭，那個人也無法復原。霎哈嘉瑜伽要做的是提昇一個人的靈量，使他處於平衡，並連接到整體大有的能量。這時那個人便能從宇宙能量得到補充。在得到自覺之後，我們明白到靜坐冥想是一種狀態。在此狀態中，並沒有作事者。我們不是作靜坐冥想，而是在靜坐冥想當中。我們亦毋須離棄世俗的生活。", "關於霎哈嘉瑜伽的醫療發現：", "一些醫生學者曾經對不同的學習霎哈嘉瑜伽人士進行實驗，大部分均顯示，練習靜坐可以減輕神經衰弱、緊張、煩躁和抑鬱。靜坐能使人加強自我控制的能力，實現自我，使人生充滿快樂。", "印度的雷醫生（U. C. Rai）指出：「那些減低精神壓力的醫療方法，例如服用鎭靜劑之類，雖然副作用很多，但仍繼續沿用。然而這不是長遠解決問題的辦法。因此，人們不斷嘗試其他減輕壓力的方法，如靜坐等。近年錫呂．瑪塔吉女士所教授的霎哈嘉瑜伽，是種易學易行的減壓方法。霎哈嘉瑜伽建基於人體內部的能量系統，練習者能夠在指掌上及頭頂感應到一股涼風，於是能夠確認靈量的提昇。靈量提昇後，練習者便可得到自覺，並進入無思慮的入靜，這是一種愉快的經驗，心靈和肉體都得到鬆弛。我們曾對霎哈嘉瑜伽練習者進行測試，項目包括心跳、血壓、皮膚對電流的反應、血乳酸及尿酸化驗。實驗結果證明，學習霎哈嘉瑜伽，無論是初學者還是長年練習者，均有顯著的生理變化，他們都能保持交感神經的健康。由此可以說，霎哈嘉瑜伽的確可以抵抗壓力，令人舒適，預防問題發生。」（註一）", "近期對霎哈嘉瑜伽的研究亦得到以下發現：", "．一開始靜坐，阿爾伐波（Alpha）便增加。", "．接著，一連串的菲提波（Theta）活動出現，常常與阿爾伐波混在一起。", "．在進入無思慮的入靜後，會有高頻率的比提波（Beta）出現。", "．心跳、呼吸減慢、氧氣消耗量下降，面容安詳鎭靜，頭頂滲出的涼風增加。（註二）", "註一:參閱The International Medical Science Academy第二卷，88年3月號，雷醫生發表的關於霎哈嘉瑜伽對身體及心智的影響，及如何消除壓力的報告。雷教授是新德里Sucheta Kripalani醫院，生理學系的前任系主任。", "註二：參閱Dr. Deepak Chugh和Dr. Sandeep Sethi---合著的「霎哈嘉瑜伽對精神衰弱病患者的治療作用」及「霎哈嘉瑜伽提昇靈量後的生理反應」。第二篇研究報告已爲作者取得博士銜頭。"]}, {"title": "第十六章 萬物之母", "paragraphs": ["「道可道，非常道；", "名可名，非常名。", "無名天地之始，有名萬物之母。」", "老子", "宇宙接連另一個宇宙，不停地誕生生命。因是母，果是子。有因斯有果。現在科學家正研究DNA，也許有一天，他們會發現母與子的關係。有一次有人向羅摩那（Ramana Maharshi）問道，他回答說：「你從那裏來，便回到那裏去。」", "因果的連鎖永恆不斷。其根始是萬物之母，亦即耶穌基督所說的聖靈。在基督之前，吠陀之前，人類還未有文字之前，人類本具的智慧已知道太初力量（Adi Shakti）是一種母性的力量。從近年孩兒谷（Son Valley）的發掘得知，遠在二萬年前的史前石器時代，人類已開始崇拜這個母性力量。孩兒谷位於印度Makhaya Pradesh一個鎭內，於1980年出土，由亞拉哈巴大學（Allahabad University）的沙馬教授（Prof. G. R. Sharma）主持。", "「起先只有汪洋大海，", "一片黑暗，", "沒有日，沒有月，", "沒有人類，沒有動物與植物，", "海洋處處皆是，", "海洋就是母親，", "那母親不是人類，甚麼都不是，", "她是個靈，是那將要來的，她是思想和記憶。」", "------哥倫比亞．康尼族（Kogni）的神話傳說", "起初，我們來自各人的生母，最後，我們將回歸大地之母。除非我們明白這個眞理，否則那人的生命便不能完滿實現。科學家亦認爲人類有共同的祖先，此毫不奇怪，因爲在二十萬年以前，宇宙之母曾留下基因於每一個人類。", "無可置疑，神只得一個，萬有的根源也只有一個。然而，神也有主動和被動兩方面的特性，祂活躍的形相便是萬物之母。這種對神的了解，深藏於人類的無意識中。在人類的歷史當中，此知覺逐漸滲入人類的思維。印度人崇拜母神、希臘人崇拜雅典娜、西方的聖母瑪利亞崇拜，都是這種了解的延續。", "直至十五世紀末，聖母崇拜各處皆是。最普遍的是將童貞女瑪利亞看成是愛與慈悲的象徵。歷史學家曾這樣描述說，信徒崇拜聖母的熱情，遠比對男性化三位一體神的信仰更高。每座教堂均有瑪利亞的塑像和對聖母的崇拜。這方面的信仰嚴重威脅到以父系爲中心的教會，因而遭受禁制。", "瑪利亞象徵至善", "由於人類的思維趨向抽象觀念，母性的信仰便與道家的陰陽概念連合起來，母親便是我們所指的陰性力量。", "有時無形會轉爲有形，去幫助人類了解眞理。數以百萬計的印度人崇拜母性形象的化身，如悉妲（Sita）、羅陀（Radha）、西方則尊崇聖母瑪利亞。", "母性的信仰在歷史過程中，會再表現出來，這是完全可能的。耶穌基督曾經說過：「我會給你們請來一個輔導者，保惠師和救贖者。聖靈會教導你們一切。」在下一章，且讓我們發現這個預言是如何實現的。"]}, {"title": "第十七章 後記", "paragraphs": ["在公元前五百年間的憂患時代，克里希納降臨主持正法，祂還在薄伽梵歌中如此說：「每逢正義衰落，不義橫行時，我便會降臨。」二千年前，在黑暗的時代裡，耶穌基督降生救贖人類。耶穌還說：「我會求父，他會給你另一個保惠師，並永遠與你同在。」", "每一個得到自覺的人都可以見證到，天父上帝在我們心中成爲永恆的靈。故此，個體生命可以成爲整體生命的一部分。這集體生命就是靈性的真實，這種連合就是真正的洗禮，印度哲學所說的第二次出生，也是耶穌基督所承諾的。古蘭經也這樣描述復活的日子：", "「祂創造你成爲一個靈，然後再帶你的靈體返回生命。」（31：28）", "這指的不就是永恆生命中的集體意識嗎？古蘭經又說：「到那日我們會封閉他們的口，他們的手會說話，他們的腳會證實他們所行的不義。」（36：63）", "這就是描述對生命能量的知覺，由身體中的微妙系統感應出來，毋須通過語言文字。", "「我們已把各人的命運繫在他們的頸上，到復活那日，我們會在他們面前揚聲：『看罷，這是你的記錄！』到了那一天，你的靈魂會呼召你去答辯。」（17：12）", "這一段描述靈量如何紀錄你生命的歷史，如何刻下人類自我創傷的疤痕。", "自古以來，不少先知哲人已預見到今天才實現的靈性現實。在美國，珍妮．迪遜（Jeanne Dixon）預言大約在1924年將有神祇降世，而錫呂．瑪塔吉女士正生於1923年3月21日。在英國，詩人布萊克（William Blake）在他的詩歌中非常清楚的預言，在未來的日子，當上帝的子民成爲先知時，他們便可賦予其他人有能力成爲先知。這正是預言了今天的霎哈嘉瑜伽練習者，可以給其他人自覺的經驗。而且布萊克的描述大部分都合於霎哈嘉瑜伽在英國的發展。特別是布萊克提到藍貝思（Vale of Lambeth），那裡成立了第一個霎哈嘉瑜伽中心，布萊克詩中提及的許多其他地方，都是錫呂．瑪塔吉女士住過的地方。", "在所有古代占星學者中，最偉大的是比恩大師（Brign Rishi）。他生於二千多年以前，他的兩部巨著Brign Samhita和Nadi Granth，寫於蓮花葉上，描述如何根據天星的組合及置換，去了解人生的命運和預知將來有關靈性事件的大事。今天，許多人都追求一個新的時代，有很多所謂導師到處招攬信眾。我們可以透過古代先知的敘述比對今日的世界。便會明瞭誰是眞正的降世神祇，誰會成爲人類的救贖者，勸導者和保惠師，指示如何進行末日的審判。許多人預言這一次的神祗降世會以女性的特質表現出來，即基督教所說的聖靈（Holy Spirit），或印度傳統的太初母性力量（Adi Shakti）。", "古籍上載滿了足以引證錫呂．瑪塔吉女士是現世眞", "正的精神導師的記述。她的人格和教導都應驗了古代先知的預言。最明顯的記載是比恩大師的Nadi Granth：這部古籍由三百多年前的另一個哲人蒲正德（Bujander）編輯出版，並附上印度方言瑪拉塔語的評論。", "根據Nadi Granth的記載，在1970年，人類意識會開始轉移。前黑暗時期（Vaivastan）和黑暗時期（Kaliyuga）會結束。然後人類的靈力會成爲統治的力量。在1922年一位瑜伽士去世以後，一位偉大的瑜伽修行者會出世，這位偉大的瑜伽修行者是聖靈的化身，具有神的所有力量，掌管上天的所有能力。她有決定去做與不做的能力。在過去，求道者必須依靠虔誠（Bhakti），知識（Gyana）瑜伽及其他種種技巧，以求得到解脫。由此他們可以達到生命的意義，滿足心靈的渴求。在那個時代，人們要歷盡萬苦千辛，務求把沉睡的靈性能量提昇至不同的能量中心。正因爲這個偉大瑜伽修行者的恩賜，求道者就能在現世享受解脫的喜樂，這是自然的，求道者能清楚看見自己靈量的提昇，他們再不需要棄絕身軀，把自己封閉於山洞中，靜坐至死。相反，依靠瑜伽的力量，求道者可以戰勝死亡。他們不需要棄絕身體，也不需要寄望來世。通過這種瑜伽而達到自覺，人不用擔憂飮食衣著和居所。疾病與心靈的痛苦完全被消滅，他們再不需要醫院。他們有能力發展成微妙的靈體，還擁有其他各種各樣的能力 。", "以上的每一個預言都實現在錫呂．瑪塔吉女士的現世工作中。她出生於印度山城欽達瓦羅，正是1923年3月21日，時値春分，亦是晝夜平分的時候。在1970年5月5日，錫呂．瑪塔吉女士開始傳授霎哈嘉瑜伽，練習者都能自然而然地達到自覺，毋須修苦行，斷食及孤獨生活至死。他們的靈能靜觀而不執著於物，對任何事物均能超然面對，他們能征服一切的欲望。", "成千上萬的人，因錫呂．瑪塔吉女士而得以喚醒他們的七個能量中心，看到自己靈量的提昇，同時感到不同能量中心的狀況。", "心理學家容格（Jung）說人有集體無意識，他是透過自己的睡夢、靈感和對病人的觀察窺探出這個無意識界。他並知道集體領域是由成熟的自覺過程獲得，而假象與幻想會妨礙人獲得自覺，通向更深一層的集體意識。", "霎哈嘉瑜伽的練習者都知道，這是描述靈量如何記錄人生命的歷史，及記載著人類自我創傷的疤痕。在獲得自覺以後，所有這些知識都好像一本開啓了的書一樣。", "還有，當一個人得到了自覺，並幫助他人得到自覺，這時，他的所有物質問題，如收入、飮食、住所都會像奇蹟般得以解決，這是我們親眼所見，親身經歷的。", "自覺可以使人平衡，處於中和及醫治人類的問題，並將人類與上天聯繫起來。靈量的提昇並不是透過討論，學問或哲學思維而得。這是自然而得，活生生的經驗，個人本身並不需要付出任何勞力，需要的只是眞誠的渴求，這便是許多宗教所說的重生。", "靈量的知識是絕對的知識，錫呂．瑪塔吉女士自己從不參考任何書籍，但對每一方面，她都有驚人的靈感和了解。錫呂．瑪塔吉女士所開創的霎哈嘉瑜伽是超越理性的，好像種子發芽成爲一棵巨樹一樣，我們不能解釋出來，你只能說這一切都應驗了古代先知的預言。這便是現世紀的啓示，現時代的福音。", "這是眞理來臨的時代，我們現在可以拋開過往求而不得之苦。即使有些人在以前從未尋得也不是問題，我們需要開放心靈去了解，我們現在所得的雖是空前，但並不會把以往的求道者和修行者變得渺小。此如進行一個實驗，最重要的是得出結果，其餘的不必計較。這是一項集體的成就。或許在混亂之中，許多求道者經歷數生也找不到眞理，他們都在今天轉世，以得到上天的應許，我們可能就是這些古人。現代的求道者須眞誠地面對自己，戰勝一切環境的障礙，找出力量去脫離過去，尋找更有意義的事物。", "霎哈嘉（Sahaja）是與生俱來的意思，我們每個人皆有潛能成爲那靈體，現在正是把這潛能化作活生生的事實的時候。霎哈嘉瑜伽是直接和實際的方向，全不是甚麼智力遊戲和權力角逐。我們要排除一切固執，僵化的思想，宗教狂熱，禁欲主義，和其他種種「主義」。每個人都要尊重自己，自力更新，不可以成爲別人或社會的寄生蟲。婚姻是神聖的制度，是個人成長和維持社會所必須的。靈性父母所生的子女將成爲這個黃金時代的偉大靈魂。大地之母已準備了筵席給她的子女，而我們要做的只是享受和慶祝她的創造。我們要尊敬和學習所有偉大的降世神祇，但偏執於任何一個，都會把上天了解得偏了。每一個降世神祇只彰顯上天的某一方面，等於增加多一塊踏腳石，促進我們靈體的進化。故此單獨立足於某一塊石頭等於活在孤島之上。上天只能在集體意識中經歷出來，並不容許任何的個人觀念、宗派、教條和自負。上天已回答了人類的祈求，了解我們自己的大好機會已經來臨。現在我們毋須任何書本的教授，毋須學習任何說教，毋須派救濟品，毋須作愚公移山，毋須別人帶引入門。一切都是自然而然成爲你的。因爲收成的時候已經到了，母親會把所有的愛心，喜樂，慈愛都給予她的子女。", "「聖靈要降臨於你，", "至高者的能力會啓迪你。」", "路加福音1：35", "如何追求眞理", "「我們首先要知道，我們不可能創造眞理，也不可能利用眞理。眞理是永恆的，過去、現在、將來都如是。我們不可能欺騙眞理。我們要達到它，並接受它。眞理不是一個概念，我們無法改變它。霎哈嘉瑜伽會教你怎樣去經驗眞理。當求道者被誤導時，後果是很嚴重的。」大部分的靈通，屬靈和超意識團體就好像藥物一樣，他們誘惑求道者，令他們落入圈套。他們的害處是內在的，不容易從外表發覺到，到發現時恐怕爲時已晚。", "並非所有超越的事物均來自天上，不是所有能力都能引領我們走上正道。異象、異聲、星象、氣感、招魂、預言、與亡魂溝通，及所有諸如此類的行爲都是十分危險的。這些事情是存在的，但卻不能引領人到上帝那裡。它們只能暫時給我們力量，他們令我們的自我相信自己是特別的。但所有這些力量不久便生出酸澀來，令人生病，鬱鬱不安。他們是有意地邀請鬼魂附體，他們令人走上迂迴的道路，即使不能毀滅，也是足以迷惑一個眞正的求道者。有些組織及導師要的是錢，有些要的是靈魂，另有些純粹想多些人陪他們落入地獄。", "要選擇精神導師或求道組織，我們可問以下的問題：", "1\\. 有沒有人向你索取金錢？眞理並不是商品，可以買賣及據爲己有。", "2\\. 你的導師有沒有催促你成爲他的推銷員？你應以信心去了解自己所走的路是否眞的有價値，不是計較你看了多少書，上過多少堂課，或你可以得到些甚麼證書。眞理並不是靠推銷的。", "3\\. 你本身是否感受到所學技法的效果？不要滿足於含糊的承諾，例如說過一段時間，你便可成爲組織中的核心人物等等。", "4\\. 他們有否叫你穿稀奇古怪的衣服？叫你採用古怪的姿勢靜坐？叫你不斷念咒？眞理是不會要人費力，只視乎人有沒有眞正的渴求，所以不需要重重的考驗。", "5\\. 你所選擇的是否合乎正道？即那條道路是否與歷世以來的大聖大賢，智者哲人的教導相符，抑或只是帶你進入潛意識或超意識的可怕經驗。", "6\\. 組織內的成員，包括導師、領袖或其他人是否可以信靠？你和他們在一起是否感到舒暢？他們有否流露愛與喜樂？他們的熱情是否眞實？他們所教導的價値能否在你眼前表現出來？", "7\\. 你有否選擇逗留或離去的自由？你要依你的心靈，而不是由自我來作決定。若你感到害怕和擔憂，提醒他們你是這樣。如果你感到懷疑和受到威嚇，你應立即離開，不要受別人控制。", "8\\. 有沒有方法證明他們所教授的確實有效？無論練習的結果如何，他們的理論應受到驗證。", "是的，生命有起有落。人有受苦、可憐的時候，但如果我們樂於受苦，楚楚可憐，我們便陷入了苦惱的循環。且讓我們以積極的態度戰勝苦惱，在烏雲背後看見晴天。當我們看見污泥，且讓我們也看見出污泥而不染的蓮花。讓我們享受上天母性力量安排的戲劇，她對我們充滿了慈愛。她會引領我們通過生命進化的不同階段，最後與最高的靈體合一。生命是何等豐盛，且讓我們細意體味，並且感謝上蒼。", "書名：《生命的昇進》", "著者：［印］馬哈贊（Yogi Mahajan）", "譯者：采菊", "出版：香港霎哈嘉瑜伽中心", "地址：香港銅鑼灣禮頓道 116 號", "禮信大廈6/F樓D座", "電話：29150092，28137671，25045260，26025272", "Email:Sahaja_Yoga@hongkong.com或<smtech@hkstar.com>", "中文網頁：http://www.angelfire.com/ak/scriptbook/", "英文網頁:http://www.sahajayoga.org/", "製作：明師出版社", "初版：2000年", "ISBN:962-8449-05-6", "本書於全世界保留版權，未經同意請勿翻印一九七零年五月五日，錫呂．瑪塔吉，涅瑪拉，德維（Shri Mataji Nirmala Devi）女士發明了一種內在超越的方法，叫霎哈嘉瑜伽。不多久，這種靜坐瑜伽便傳遍世界各地，改變了數以萬計人士的生命。本書闡述此改變的過程和力量的泉源，並說明個人如何可以從一己形軀之私，提昇至無窮無盡的整體大我。", "香港霎哈嘉瑜伽中心出版"]}]};

const STORAGE_KEY = 'ascent_reader_progress';
const HIGHLIGHT_KEY = 'ascent_reader_highlights';
const POEM_MARK = '\u0001POEM\u0001';
const LINE_SEP = '\u2028';
const FONT_KEY = 'ascent_reader_fontsize';
const THEME_KEY = 'ascent_reader_theme';

// ---------- Highlights ----------
function loadHighlights(){
  try{ return JSON.parse(localStorage.getItem(HIGHLIGHT_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveHighlights(obj){
  localStorage.setItem(HIGHLIGHT_KEY, JSON.stringify(obj));
}
function getHighlightsFor(sectionIdx, key){
  const all = loadHighlights();
  const sec = all[sectionIdx];
  if(!sec || !sec[key]) return [];
  return sec[key].slice().sort((a,b) => a.start - b.start);
}
function addHighlight(sectionIdx, key, start, end, color){
  const all = loadHighlights();
  if(!all[sectionIdx]) all[sectionIdx] = {};
  if(!all[sectionIdx][key]) all[sectionIdx][key] = [];
  let list = all[sectionIdx][key];
  list.push({ id: 'h' + Date.now() + Math.floor(Math.random()*1000), start, end, color: color || '#f4cf6b' });
  list.sort((a,b) => a.start - b.start);
  const merged = [];
  list.forEach(h => {
    const last = merged[merged.length - 1];
    if(last && h.start <= last.end){
      last.end = Math.max(last.end, h.end);
      last.color = h.color; // newest color wins for merged range
    } else {
      merged.push(Object.assign({}, h));
    }
  });
  all[sectionIdx][key] = merged;
  saveHighlights(all);
}
function removeHighlight(sectionIdx, key, id){
  const all = loadHighlights();
  if(!all[sectionIdx] || !all[sectionIdx][key]) return;
  all[sectionIdx][key] = all[sectionIdx][key].filter(h => h.id !== id);
  if(all[sectionIdx][key].length === 0) delete all[sectionIdx][key];
  if(Object.keys(all[sectionIdx]).length === 0) delete all[sectionIdx];
  saveHighlights(all);
}
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderParaText(pEl, text, key){
  pEl.setAttribute('data-key', key);
  const hls = getHighlightsFor(currentSection, key);
  if(!hls.length){ pEl.textContent = text; return; }
  let html = '';
  let pos = 0;
  hls.forEach(h => {
    const s = Math.max(0, Math.min(text.length, h.start));
    const e = Math.max(s, Math.min(text.length, h.end));
    const color = h.color || '#f4cf6b';
    html += escapeHtml(text.slice(pos, s));
    html += `<mark class="user-hl" data-hl-id="${h.id}" style="background:${color}">${escapeHtml(text.slice(s, e))}</mark>`;
    pos = e;
  });
  html += escapeHtml(text.slice(pos));
  pEl.innerHTML = html;
}

let currentSection = 0;
let fontSize = parseInt(localStorage.getItem(FONT_KEY) || '17', 10);

const tocList = document.getElementById('tocList');
const screenToc = document.getElementById('screen-toc');
const screenReader = document.getElementById('screen-reader');
const screenMynotes = document.getElementById('screen-mynotes');

function renderToc(){
  tocList.innerHTML = '';
  sections.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'toc-item' + (s.isPreface ? ' preface' : '');
    const t = splitTitle(s.title);
    const titleHtml = t.sub ? `${t.main}<span class="toc-title-en">${t.sub}</span>` : t.main;
    el.innerHTML = `<div class="toc-num">${s.isPreface ? '◈' : String(i).padStart(2,'0')}</div>
      <div class="toc-title">${titleHtml}</div>
      <div class="toc-arrow">▸</div>`;
    el.addEventListener('click', () => openSection(i, true));
    tocList.appendChild(el);
  });
}

function checkContinue(){
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  const card = document.getElementById('continueCard');
  if(saved && sections[saved.section]){
    card.classList.add('show');
    document.getElementById('continueTitle').textContent = sections[saved.section].title;
    card.onclick = () => openSection(saved.section, true, saved.scroll);
  }
}

function getParaTextByKey(sectionIdx, key){
  const paras = sections[sectionIdx].paragraphs;
  if(key[0] === 'm'){
    const rest = key.slice(1);
    const parts = rest.split('_');
    const i = parseInt(parts[0], 10), li = parseInt(parts[1], 10);
    const raw = paras[i];
    if(raw && raw.startsWith(POEM_MARK)){
      const lines = raw.slice(POEM_MARK.length).split(LINE_SEP);
      return lines[li] || '';
    }
    return '';
  } else if(key[0] === 'a'){
    const i = parseInt(key.slice(1), 10);
    return (paras[i] || '').replace(/^-+/, '').trim();
  } else if(key[0] === 'p'){
    const i = parseInt(key.slice(1), 10);
    return paras[i] || '';
  }
  return '';
}

function renderMyNotes(){
  const all = loadHighlights();
  const summary = document.getElementById('mynotesSummary');
  const list = document.getElementById('mynotesList');
  const items = [];
  Object.keys(all).forEach(secIdxStr => {
    const secIdx = parseInt(secIdxStr, 10);
    if(!sections[secIdx]) return;
    Object.keys(all[secIdxStr]).forEach(key => {
      all[secIdxStr][key].forEach(h => {
        const fullText = getParaTextByKey(secIdx, key);
        const snippet = fullText.slice(h.start, h.end);
        if(!snippet) return;
        items.push({ secIdx, key, id: h.id, snippet, title: sections[secIdx].title });
      });
    });
  });
  if(items.length === 0){
    summary.classList.remove('show');
    list.innerHTML = '<div class="mynotes-empty">還沒有標記任何重點</div>';
    return;
  }
  summary.classList.add('show');
  document.getElementById('mynotesSummaryTitle').textContent = `共 ${items.length} 則`;
  list.innerHTML = '';
  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'mynote-item';
    el.innerHTML = `<div class="mn-body"><div class="mn-chap">${escapeHtml(it.title)}</div><div class="mn-text">${escapeHtml(it.snippet)}</div></div><div class="mn-del">✕</div>`;
    el.querySelector('.mn-body').addEventListener('click', () => {
      openSection(it.secIdx, true);
      setTimeout(() => {
        const mk = document.querySelector(`mark[data-hl-id="${it.id}"]`);
        if(mk) mk.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 80);
    });
    el.querySelector('.mn-del').addEventListener('click', (e) => {
      e.stopPropagation();
      removeHighlight(it.secIdx, it.key, it.id);
      renderMyNotes();
    });
    list.appendChild(el);
  });
}

function splitTitle(title){
  const m = title.match(/^(.*?)[（(]([^）)]*)[）)]\s*$/);
  if(m){
    return { main: m[1].trim(), sub: '（' + m[2].trim() + '）' };
  }
  return { main: title, sub: null };
}

function openSection(idx, saveIt, scrollFrac){
  currentSection = idx;
  const s = sections[idx];
  document.getElementById('chapEyebrow').textContent = s.isPreface ? '導言' : `第 ${idx} 章　·　全書共 ${chapters.length} 章`;
  const t = splitTitle(s.title);
  document.getElementById('chapTitle').innerHTML = t.sub
    ? `${t.main}<span class="chap-title-en">${t.sub}</span>`
    : t.main;
  const body = document.getElementById('chapContent');
  body.innerHTML = '';

  function isAttribution(p){
    return p.startsWith('---') || p.startsWith('——');
  }
  function isVerseLine(p){
    if(isAttribution(p)) return false;
    return p.length <= 22;
  }

  const paras = s.paragraphs;

  // Anchor-based grouping: for each attribution line, walk backward through
  // preceding paragraphs collecting the quoted passage that precedes it —
  // short lines are always included, and longer lines are included while a
  // Chinese quotation mark remains unmatched (「...」spanning multiple
  // paragraphs), stopping once the quote balances out.
  const poemRangeStart = {}; // end index (attribution index - 1) -> start index
  for(let i = 0; i < paras.length; i++){
    if(!isAttribution(paras[i])) continue;
    let j = i - 1;
    let balance = 0;
    let start = null;
    let steps = 0;
    while(j >= 0 && steps < 25){
      const q = paras[j];
      if(isAttribution(q)) break;
      const opens = (q.match(/「/g) || []).length;
      const closes = (q.match(/」/g) || []).length;
      const short = q.length <= 22;
      if(!(short || balance > 0 || closes > opens)) break;
      balance += closes - opens;
      start = j;
      steps++;
      if(balance <= 0 && (opens > 0 || closes > 0)) break; // quote just balanced — stop
      j--;
    }
    if(start !== null && start < i - 1){
      poemRangeStart[i - 1] = start; // map end-index -> start-index
    }
  }
  const poemRangeStarts = new Set(Object.values(poemRangeStart));
  const poemRangeEndFor = {}; // start index -> end index
  Object.entries(poemRangeStart).forEach(([end, start]) => { poemRangeEndFor[start] = parseInt(end, 10); });

  let i = 0;
  while(i < paras.length){
    const p = paras[i];
    if(p.startsWith(POEM_MARK)){
      const wrap = document.createElement('div');
      wrap.className = 'poem-block';
      p.slice(POEM_MARK.length).split(LINE_SEP).forEach((line, li) => {
        const lp = document.createElement('p');
        renderParaText(lp, line, `m${i}_${li}`);
        wrap.appendChild(lp);
      });
      body.appendChild(wrap);
      i++;
      continue;
    }
    if(isAttribution(p)){
      const pEl = document.createElement('p');
      pEl.className = 'attribution';
      renderParaText(pEl, p.replace(/^-+/, '').trim(), `a${i}`);
      body.appendChild(pEl);
      i++;
      continue;
    }
    if(poemRangeStarts.has(i)){
      const end = poemRangeEndFor[i];
      const wrap = document.createElement('div');
      wrap.className = 'poem-block';
      for(let k = i; k <= end; k++){
        const lp = document.createElement('p');
        renderParaText(lp, paras[k], `p${k}`);
        wrap.appendChild(lp);
      }
      body.appendChild(wrap);
      i = end + 1;
      continue;
    }
    if(isVerseLine(p)){
      // gather consecutive verse lines
      let j = i;
      const groupIdx = [];
      while(j < paras.length && isVerseLine(paras[j]) && !poemRangeStarts.has(j)){
        groupIdx.push(j);
        j++;
      }
      if(groupIdx.length >= 2){
        const wrap = document.createElement('div');
        wrap.className = 'poem-block';
        groupIdx.forEach(k => {
          const lp = document.createElement('p');
          renderParaText(lp, paras[k], `p${k}`);
          wrap.appendChild(lp);
        });
        body.appendChild(wrap);
        i = j;
        continue;
      }

      // single short paragraph, not part of a verse group -> treat as normal paragraph
    }
    const pEl = document.createElement('p');
    renderParaText(pEl, p, `p${i}`);
    body.appendChild(pEl);
    i++;
  }
  applyFontSize();

  // prev/next
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(idx <= 0){ prevBtn.classList.add('disabled'); }
  else { prevBtn.classList.remove('disabled'); document.getElementById('prevTitle').textContent = sections[idx-1].title; }
  if(idx >= sections.length - 1){ nextBtn.classList.add('disabled'); }
  else { nextBtn.classList.remove('disabled'); document.getElementById('nextTitle').textContent = sections[idx+1].title; }

  screenToc.classList.remove('active');
  screenMynotes.classList.remove('active');
  screenReader.classList.add('active');
  window.scrollTo(0,0);
  const rb = document.getElementById('readerBody');
  if(scrollFrac){
    requestAnimationFrame(()=>{ window.scrollTo(0, scrollFrac * (document.body.scrollHeight - window.innerHeight)); });
  }
  updateProgress();
  if(saveIt !== false){ persistProgress(); }
}

function persistProgress(){
  const doc = document.documentElement;
  const scrollFrac = window.scrollY / Math.max(1,(document.body.scrollHeight - window.innerHeight));
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ section: currentSection, scroll: scrollFrac }));
}

function updateProgress(){
  const frac = window.scrollY / Math.max(1,(document.body.scrollHeight - window.innerHeight));
  document.getElementById('progressFill').style.width = Math.min(100, Math.max(0, frac*100)) + '%';
}

window.addEventListener('scroll', () => {
  if(screenReader.classList.contains('active')){
    updateProgress();
  }
});
window.addEventListener('beforeunload', () => {
  if(screenReader.classList.contains('active')) persistProgress();
});
let scrollSaveTimer;
window.addEventListener('scroll', () => {
  if(!screenReader.classList.contains('active')) return;
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(persistProgress, 500);
});

document.getElementById('backBtn').addEventListener('click', () => {
  persistProgress();
  setHlMode(false);
  screenReader.classList.remove('active');
  screenToc.classList.add('active');
  checkContinue();
  renderMyNotes();
  window.scrollTo(0,0);
});

document.getElementById('mynotesSummary').addEventListener('click', () => {
  screenToc.classList.remove('active');
  screenMynotes.classList.add('active');
  window.scrollTo(0,0);
});

document.getElementById('mynotesBackBtn').addEventListener('click', () => {
  screenMynotes.classList.remove('active');
  screenToc.classList.add('active');
  window.scrollTo(0,0);
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if(currentSection > 0) openSection(currentSection - 1, true);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if(currentSection < sections.length - 1) openSection(currentSection + 1, true);
});

function applyFontSize(){
  document.getElementById('readerBody').style.fontSize = fontSize + 'px';
  document.querySelectorAll('.reader-body p').forEach(p => p.style.fontSize = fontSize + 'px');
  localStorage.setItem(FONT_KEY, fontSize);
}
document.getElementById('fontInc').addEventListener('click', () => {
  fontSize = Math.min(24, fontSize + 1);
  applyFontSize();
});
document.getElementById('fontDec').addEventListener('click', () => {
  fontSize = Math.max(14, fontSize - 1);
  applyFontSize();
});

// Theme toggle
function applyTheme(t){
  document.body.setAttribute('data-theme', t);
  const icon = t === 'night' ? '☼' : '☾';
  document.getElementById('themeToggleCover').textContent = icon;
  document.getElementById('themeToggleReader').textContent = icon;
  localStorage.setItem(THEME_KEY, t);
}
function toggleTheme(){
  const cur = document.body.getAttribute('data-theme');
  applyTheme(cur === 'night' ? 'day' : 'night');
}
document.getElementById('themeToggleCover').addEventListener('click', toggleTheme);
document.getElementById('themeToggleReader').addEventListener('click', toggleTheme);
applyTheme(localStorage.getItem(THEME_KEY) || 'day');

// Search
const searchInput = document.getElementById('searchInput');
const searchResultsWrap = document.getElementById('searchResultsWrap');
const tocListWrap = document.getElementById('tocListWrap');

function highlight(text, q){
  const idx = text.indexOf(q);
  if(idx === -1) return text.slice(0, 60) + '…';
  const start = Math.max(0, idx - 18);
  const end = Math.min(text.length, idx + q.length + 40);
  let snippet = (start>0?'…':'') + text.slice(start, idx) + '<mark>' + text.slice(idx, idx+q.length) + '</mark>' + text.slice(idx+q.length, end) + (end<text.length?'…':'');
  return snippet;
}

function doSearch(q){
  q = q.trim();
  if(!q){
    searchResultsWrap.classList.add('empty');
    searchResultsWrap.innerHTML = '';
    tocListWrap.style.display = '';
    document.getElementById('continueCard').style.display = '';
    return;
  }
  tocListWrap.style.display = 'none';
  document.getElementById('continueCard').style.display = 'none';
  let results = [];
  sections.forEach((s, si) => {
    s.paragraphs.forEach(rawP => {
      const p = rawP.startsWith(POEM_MARK) ? rawP.slice(POEM_MARK.length).split(LINE_SEP).join('　') : rawP;
      if(p.includes(q)){
        results.push({ si, title: s.title, snippet: highlight(p, q) });
      }
    });
  });
  results = results.slice(0, 40);
  searchResultsWrap.classList.remove('empty');
  if(results.length === 0){
    searchResultsWrap.innerHTML = '<div class="sr-count">找不到相關內容</div>';
    return;
  }
  let html = `<div class="sr-count">找到 ${results.length} 筆結果</div>`;
  results.forEach(r => {
    html += `<div class="sr-item" data-si="${r.si}"><div class="sr-chap">${r.title}</div><div class="sr-snippet">${r.snippet}</div></div>`;
  });
  searchResultsWrap.innerHTML = html;
  searchResultsWrap.querySelectorAll('.sr-item').forEach(el => {
    el.addEventListener('click', () => {
      const si = parseInt(el.getAttribute('data-si'), 10);
      searchInput.value = '';
      doSearch('');
      openSection(si, true);
    });
  });
}
searchInput.addEventListener('input', (e) => doSearch(e.target.value));

renderToc();
checkContinue();
renderMyNotes();

// ---------- Highlight mode (select text, tap a color in the fixed bottom bar) ----------
const chapContentEl = document.getElementById('chapContent');
const hlModeToggle = document.getElementById('hlModeToggle');
const hlColorBar = document.getElementById('hlColorBar');
const readerBodyEl = document.getElementById('readerBody');
let hlModeOn = false;
let hlActiveColor = null;

function setHlMode(on){
  hlModeOn = on;
  hlModeToggle.classList.toggle('active-mode', on);
  hlColorBar.classList.toggle('show', on);
  readerBodyEl.classList.toggle('hl-mode-padding', on);
  if(!on) window.getSelection().removeAllRanges();
}
hlModeToggle.addEventListener('click', () => setHlMode(!hlModeOn));
document.getElementById('hlDoneBtn').addEventListener('click', () => setHlMode(false));

function getOffsetWithin(container, node, offset){
  const preRange = document.createRange();
  preRange.selectNodeContents(container);
  preRange.setEnd(node, offset);
  return preRange.toString().length;
}

// Read whatever is currently selected, right now — called at the moment a
// swatch is pressed (mousedown/touchstart), before the browser has a chance
// to collapse the selection because of the tap itself.
function captureSelectionRange(){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  const anchorNode = range.commonAncestorContainer;
  const elNode = anchorNode.nodeType === 3 ? anchorNode.parentElement : anchorNode;
  const pEl = elNode ? elNode.closest('p[data-key]') : null;
  if(!pEl || !chapContentEl.contains(pEl)) return null;
  if(!pEl.contains(range.startContainer) || !pEl.contains(range.endContainer)) return null;
  const start = getOffsetWithin(pEl, range.startContainer, range.startOffset);
  const end = getOffsetWithin(pEl, range.endContainer, range.endOffset);
  if(end <= start) return null;
  return { key: pEl.getAttribute('data-key'), start, end };
}

hlColorBar.querySelectorAll('.hl-swatch').forEach(sw => {
  let firedAt = 0;
  const activate = (e) => {
    const now = Date.now();
    if(now - firedAt < 400) return; // avoid double-firing from both mousedown and touchstart
    firedAt = now;
    const hl = captureSelectionRange();
    e.preventDefault();
    hlActiveColor = sw.getAttribute('data-color');
    hlColorBar.querySelectorAll('.hl-swatch').forEach(s2 => s2.classList.remove('selected'));
    sw.classList.add('selected');
    if(!hl) return;
    const fullText = getParaTextByKey(currentSection, hl.key);
    addHighlight(currentSection, hl.key, hl.start, hl.end, hlActiveColor);
    const pEl = chapContentEl.querySelector(`p[data-key="${hl.key}"]`);
    if(pEl) renderParaText(pEl, fullText, hl.key);
    renderMyNotes();
    window.getSelection().removeAllRanges();
  };
  sw.addEventListener('mousedown', activate);
  sw.addEventListener('touchstart', activate, { passive:false });
});

chapContentEl.addEventListener('click', (e) => {
  // Tapping an existing highlight always removes just that mark.
  const mk = e.target.closest('mark.user-hl');
  if(!mk) return;
  const pEl = mk.closest('p[data-key]');
  if(!pEl) return;
  const key = pEl.getAttribute('data-key');
  const id = mk.getAttribute('data-hl-id');
  removeHighlight(currentSection, key, id);
  const fullText = getParaTextByKey(currentSection, key);
  renderParaText(pEl, fullText, key);
  renderMyNotes();
});
