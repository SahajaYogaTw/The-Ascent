<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>生命的升進</title>
<style>
  :root{
    --gold:#d9c690;
    --soft:#1f3d2b;
    --muted:#bcd0bf;
    --ink:#ffffff;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
  }

  body{
    background:var(--soft);
    font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .cover{
    height:100vh;
    max-width:640px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px;
    text-decoration:none;
    color:var(--ink);
  }

  h1{
    font-size:46px;
    font-weight:600;
    letter-spacing:0.2em;
    margin:0 0 14px;
  }

  .subtitle-en{
    font-size:12px;
    letter-spacing:0.3em;
    color:var(--muted);
    margin-bottom:6px;
  }

  .byline{
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.08em;
    margin-top:18px;
  }

  .enter{
    position:absolute;
    bottom:56px;
    left:0;
    right:0;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.3em;
  }

  .chev{
    display:block;
    margin:10px auto 0;
    width:9px;
    height:9px;
    border-right:1px solid var(--muted);
    border-bottom:1px solid var(--muted);
    transform:rotate(45deg);
    animation:bob 2.2s ease-in-out infinite;
  }

  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(45deg); opacity:0.6; }
    50%{ transform:translateY(6px) rotate(45deg); opacity:1; }
  }
</style>
</head>
<body>

<a class="cover" href="序言.html">
  <div class="subtitle-en">THE ASCENT</div>
  <h1>生命的升進</h1>
  <div class="byline">［印］馬哈贊　著</div>
</a>

<div class="enter">
  進入序言
  <span class="chev"></span>
</div>

</body>
</html>
