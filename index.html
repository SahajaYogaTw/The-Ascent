<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>生命的升進</title>
<style>
  :root{
    --gold:#d9c690;
    --soft:#1f3d2b;
    --muted:#bcd0bf;
    --ink:#ffffff;
  }
  :root.light{
    --gold:#b8975f;
    --soft:#f7f4ee;
    --muted:#9c9484;
    --ink:#4a4238;
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; height:100%; }

  body{
    background:var(--soft);
    font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    transition:background 200ms ease, color 200ms ease;
  }

  .themebtn{
    position:absolute;
    top:18px; right:18px;
    background:none; border:none;
    color:var(--muted);
    font-size:18px;
    padding:8px;
    cursor:pointer;
    z-index:10;
  }

  .cover{
    height:100vh;
    max-width:640px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px;
    text-decoration:none;
    color:var(--ink);
  }

  h1{ font-size:46px; font-weight:600; letter-spacing:0.2em; margin:0 0 14px; }
  .subtitle-en{ font-size:12px; letter-spacing:0.3em; color:var(--muted); margin-bottom:6px; }
  .byline{ font-size:13px; color:var(--muted); letter-spacing:0.08em; margin-top:18px; }

  .continue{
    margin-top:30px;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--gold);
    text-decoration:none;
    border:1px solid var(--gold);
    border-radius:20px;
    padding:9px 20px;
  }

  .enter{
    position:absolute; bottom:56px; left:0; right:0;
    text-align:center; font-size:12px; color:var(--muted); letter-spacing:0.3em;
  }

  .chev{
    display:block; margin:10px auto 0; width:9px; height:9px;
    border-right:1px solid var(--muted); border-bottom:1px solid var(--muted);
    transform:rotate(45deg);
    animation:bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(45deg); opacity:0.6; }
    50%{ transform:translateY(6px) rotate(45deg); opacity:1; }
  }

  .booknav{
    position:absolute; bottom:0; left:0; right:0;
    max-width:640px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:14px 24px 18px; box-sizing:border-box;
  }
  .booknav a, .booknav span{ font-size:12px; letter-spacing:0.08em; color:var(--muted); text-decoration:none; padding:6px 4px; }
  .booknav a{ color:var(--ink); }
  .booknav .home{ color:var(--gold); letter-spacing:0.2em; }
  .booknav .disabled{ color:var(--muted); opacity:0.4; pointer-events:none; }
</style>
</head>
<body>

<button class="themebtn" id="themeBtn">☾</button>

<div class="cover" id="coverLink">
  <div class="subtitle-en">THE ASCENT</div>
  <h1>生命的升進</h1>
  <div class="byline">［印］馬哈贊　著</div>
  <a class="continue" id="continueLink" style="display:none;"></a>
</div>

<div class="enter">
  進入序言
  <span class="chev"></span>
</div>

<div class="booknav">
  <span class="disabled">‹ 上一頁</span>
  <span class="home disabled">回首頁</span>
  <a href="preface.html">下一頁 ›</a>
</div>

<script>
  var root = document.documentElement;
  var saved = localStorage.getItem('theme') || 'light';
  root.classList.toggle('light', saved === 'light');
  var btn = document.getElementById('themeBtn');
  btn.textContent = saved === 'light' ? '☾' : '☼';
  btn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var next = root.classList.contains('light') ? 'dark' : 'light';
    root.classList.toggle('light', next === 'light');
    localStorage.setItem('theme', next);
    btn.textContent = next === 'light' ? '☾' : '☼';
  });

  document.getElementById('coverLink').addEventListener('click', function(e){
    if(e.target.id === 'continueLink') return;
    window.location.href = 'preface.html';
  });

  try{
    var last = JSON.parse(localStorage.getItem('lastRead') || 'null');
    if(last && last.file){
      var link = document.getElementById('continueLink');
      link.href = last.file;
      link.textContent = '繼續閱讀：' + last.title;
      link.style.display = 'inline-block';
      link.addEventListener('click', function(e){ e.stopPropagation(); });
    }
  }catch(e){}
</script>

</body>
</html>
